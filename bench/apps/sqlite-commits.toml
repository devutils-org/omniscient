# A database making every commit durable: 200 single-row transactions under a
# rollback journal with synchronous=FULL, each waiting for the disk.
kind = "database"
about = "sqlite3 committing 200 single-row transactions, each synced"
requires = ["sqlite3", "python3"]
storage = true
setup = [
  ["python3", "-c", "import sys\nwith open(sys.argv[1], 'w') as f:\n    f.write('PRAGMA journal_mode=DELETE;\\nPRAGMA synchronous=FULL;\\nCREATE TABLE t(x);\\n')\n    for i in range(200): f.write(f\"INSERT INTO t VALUES ('{'x' * 100}');\\n\")", "{work}/commits.sql"],
]
command = ["sqlite3", "{work}/app.db", ".read {work}/commits.sql"]

[latency]
limit = "disk"
