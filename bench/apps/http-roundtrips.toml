# A network client and server in one process, on loopback: 30 requests, each
# on a connection of its own. Every connection is one handshake and one
# accept.
kind = "network"
about = "python3: an HTTP server thread and 30 GETs, one connection each"
requires = ["python3"]
command = ["python3", "{apps}/http_roundtrips.py", "30"]
truth = "static"
# Each connection has two ends, both in this process: 60 sockets close.
values = { connections = 30, sockets = 60 }

[[trace]]
label = "connects"
args = ["net.tcp.connect", "-m", "trace", "-e", "summary"]
value = "events"
truth = "connections"
tolerance = 0.0

[[trace]]
label = "accepts"
args = ["net.tcp.accept", "-m", "trace", "-e", "summary"]
value = "events"
truth = "connections"
tolerance = 0.0

[[trace]]
label = "lifetimes"
args = ["net.tcp.lifetime", "-m", "trace", "-e", "summary"]
value = "events"
truth = "sockets"
tolerance = 0.0
