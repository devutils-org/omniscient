# A thread that waits for a mutex a helper holds: blocked, asleep, while the
# helper runs. The answer must name the holder beside the waiter.
kind = "lock-bound"
about = "150 acquisitions of a mutex a helper thread holds 2 ms at a time"
needs = ["triage-fixture"]
command = ["{fixture}", "lock", "150", "2000"]
truth = "omn-truth"
# Not the tool's: the workload sleeps usleep(20) between acquisitions, and on
# the aarch64 OrbStack machine a 20 us sleep lasts 2.9 ms, so 150 of them
# outweigh the mutex (lock_wait_ns is a third of wall_ns there) and the sleep
# is rightly what the answer names.
known = { aarch64 = "on the OrbStack VM usleep(20) lasts about 2.9 ms, so the workload's own sleeps outweigh its mutex waits; the answer is right for that machine" }

[latency]
limit = "lock"
# The program prints its truth before joining the holder, which then finishes
# its last hold: the program's whole life is a hold or more past `wall_ns`.
check = [
  { row = "whole", truth = "wall_ns", tolerance = 0.10 },
]
