[workspace]
members = ["shim", "mcp"]

[package]
name = "omn"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Omniscient: one vocabulary for system observability, spoken directly"
license = "MIT OR Apache-2.0"

[[bin]]
name = "omn"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
toml = "0.9"
perf-event-open-sys = "7.0.0"
rustc-demangle = "0.1"
cpp_demangle = "0.5"
framehop = { version = "0.16", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
strip = true
