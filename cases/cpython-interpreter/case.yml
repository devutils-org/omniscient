# Case 3, without a perf map: CPython 3.14 running a pure-Python program.
#
# ROADMAP phase 12. The interpreter as the distribution ships it, asked "why is
# this slow, for latency" twice: once with its time on a cpu, spent by one
# Python function that the input makes dominant, and once with its time off
# the cpu, in a read of a pipe nobody writes to yet. Each cause is known
# without the tool: the first from `cProfile`, the profiler CPython ships, run
# on the same program and input, and from the program's own clocks; the second
# from the clock of the process that writes into the pipe.
#
# Without `-X perf` the interpreter writes no perf map, so no frame of any
# stack names the program's own code: every frame is the interpreter's. The
# verdict must say so rather than name one of the interpreter's C functions as
# the suspect. `cases/cpython-perf-map` asks the same two questions with
# `-X perf`, where the Python function can be named. `docs/cases.md`
# describes every field.
name: cpython-interpreter
about: >-
  CPython 3.14's `python3` as the distribution ships it, running a pure-Python
  script: a stripped launcher, `libpython3.14.so` with its dynamic symbols
  only and no frame pointers, and no perf map, so the program's own functions
  exist only as the interpreter's data.

program:
  command: python3
  obtained: >-
    the distribution's package (`python` 3.14.7 on Arch Linux on the
    development machine), not rebuilt: `/usr/bin/python3` and
    `libpython3.14.so.1.0`, carrying their dynamic symbols only, built without
    frame pointers, with the perf trampoline compiled in (unused here)
  version: [python3, --version]

needs:
  - run: [python3, --version]
    for: the program under test

# The interpreter's own names: its dynamic symbols. Nothing names a Python
# function here, by design.
symbols: local

fetch: []

# The input: 2 000 lines of `weight word`, weights 3 000 to 9 000 (about 12
# million scoring steps in all), from a fixed seed so every run scores the
# same lines.
setup:
  - [python3, -c, 'import random; r = random.Random(3);
      open("{dir}/input.txt", "w").write("".join(f"{r.randrange(3000, 9001)} w{r.randrange(10**9):09d}\n" for _ in range(2000)))']

causes:
  # ------------------------------------------------------------------ on cpu
  - name: one-function-dominates
    on: cpu
    question: latency
    objective: latency
    injection:
      kind: input
      about: >-
        An input whose lines carry weights that make `score`, a pure-Python
        loop of `weight` steps per line, the program's time: about 12 million
        steps where reading the file and ranking the result touch each of the
        2 000 lines once. Nothing about the interpreter or the script
        changes; only what it is given to read.
    target: [python3, '{case}/hot.py', '{dir}/input.txt']
    own_account: stdout
    reference:
      - name: account
        extractor: key-value
        from: target
      - name: cprofile
        extractor: key-value
        run: [python3, '{case}/cprofile_account.py', '{case}/hot.py', '{dir}/input.txt']
    holds:
      - {value: cprofile.score_share, at_least: 0.9, why: cProfile puts nine tenths of the program's own time in `score`}
    expect:
      limit: cpu
      state: on-cpu
      # No `leaf`: without a perf map no frame names a Python function, and the
      # interpreter's hottest C function (`__tls_get_addr`, `_Py_Dealloc`) is
      # where every Python program spends its time, not why this one is slow.
      # The verdict must say the time is in the interpreter's frames; whatever
      # function it names in backquotes as "hottest" is one of the
      # interpreter's, presented as the suspect.
      never_says: ['hottest function `']
      # Both ways say a flat interpreter profile as one and name no function
      # (`docs/mcp.md`, "A flat profile of an interpreter is said as one"):
      # held on each way by `the-dominant-stack-ends-in-the-known-frame`, and
      # `both-ways-name-the-same-suspect` fails if one way names a function
      # and the other none. No two C leaves of it are compared: the coin the
      # seventeenth wave's flaky tally counted is gone with python's finding
      # 2.
      names_no_function: true
      agrees:
        - row: on-cpu
          with: account.cpu_ns
          # The account covers the three functions only: the interpreter's
          # start and exit are the slack it leaves.
          outside: account.real_ns
          # A time-based sample counts the interrupts that ran on the task's
          # cpu, which `process_time` (getrusage) leaves out (`cpu.profile`'s
          # caveat: 0.7 % at 997 Hz on the machine it was measured on).
          relative: 0.01

  # ----------------------------------------------------------------- off cpu
  - name: a-blocking-read
    on: off-cpu
    question: latency
    objective: latency
    injection:
      kind: process
      about: >-
        A second process creates a named pipe, holds it open for writing, and
        writes one line into it 1.5 s after the target appears. The target
        first prepares (`prepare`, 3 million steps of a pure-Python loop,
        about 0.2 s on a cpu), then opens the pipe (at once: a writer is
        there) and reads it, and the read blocks until the line arrives; the
        tool never touches either process. The preparation keeps the
        program's own cpu well above what the tracers spend watching it
        (`reader.py`).
      run: [python3, '{case}/writer.py', '{dir}/fifo', '1500', python3]
      ready: ready
    target: [python3, '{case}/reader.py', '{dir}/fifo', '3000000']
    own_account: stdout
    reference:
      - name: writer
        extractor: key-value
        from: injection
      - name: account
        extractor: key-value
        from: target
    holds:
      - {value: writer.target_seen, at_least: 1, why: the writer saw the target and kept the pipe empty in front of it}
      - {value: account.bytes, at_least: 1, why: the read returned the line the writer wrote}
    expect:
      limit: sleep
      state: blocked
      # The block's own frame: libc's read(2) wrapper.
      leaf: __read
      agrees:
        - row: blocked
          with: writer.held_after_target_ns
          # The writer starts its clock when it sees the target in /proc;
          # the target reaches its read `before_read_ns` after its script's
          # first line, and that line once the interpreter has started, some
          # 20 to 50 ms after it appeared on a loaded machine. The writer may
          # also have seen it up to its `poll_ns` (10 to 40 ms) late: 100 ms
          # covers the two.
          slack_ns: 100000000
          plus: account.before_read_ns
        - row: blocked
          with: account.read_ns
          outside: account.read_ns
