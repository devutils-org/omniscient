# Case 5: `gcc` on a known translation unit.
#
# Held back in `cases/held/` from the seventeenth wave to the eighteenth: the
# person's way named the driver's `wait4`, and the agent's read whichever
# table weighed most. Both ways now follow the wait into the compiler
# (`docs/fixes/w18-cases.md`).
#
# ROADMAP phase 12. A compiler is a process tree: the driver `gcc` starts the
# compiler proper `cc1`, then the assembler `as`, and waits for each. The
# translation unit is sqlite's `shell.c` (1.2 MB, 155 headers), fetched once
# with the amalgamation. On the cpu, the cause is the optimisation passes:
# two builds of the same unit, `-O2` against `-O0`, whose difference is the
# cause, with gcc's own `-ftime-report` as the account. Off it, the compile
# shares its cpu with two competitors, and the kernel's `schedstat` of each
# process, read from outside, is the account. Both causes start the watcher
# (`cases/shared/watch.py`), which first ends whatever an earlier run of the
# case left behind: a run the budget stopped leaves its cc1 compiling into the
# same files. `docs/cases.md` describes every field.
name: gcc-shell
about: >-
  The distribution's gcc compiling one translation unit to an object file:
  the driver `gcc`, which does nothing itself but start `cc1` and `as` and wait
  for them, so the program's time is spent in processes its main thread is
  not.

program:
  command: gcc
  obtained: >-
    the distribution's package (`gcc` 16.2.1 on Arch Linux on the development
    machine), not rebuilt: the driver and `cc1` stripped, each with a GNU
    build id; `as` from binutils
  version: [gcc, --version]
  stripped: true

needs:
  - run: [gcc, --version]
    for: the program under test
  - run: [unzip, -v]
    for: unpacking the translation unit from the amalgamation's archive
  - run: [python3, --version]
    for: reading gcc's report, and watching and competing with the compile
  - run: [taskset, -c, '0', 'true']
    for: the cpu the contended compile and its competitors share (cpu 0)
  - run: [sh, -c, 'test "$(nproc)" -ge 2']
    for: a cpu to watch from that is not the contended one

# Names by build id where DEBUGINFOD_URLS is set; nothing here asserts one.
symbols: debuginfod

# The translation unit: sqlite's own shell, as the amalgamation ships it.
fetch:
  - url: https://www.sqlite.org/2026/sqlite-amalgamation-3530400.zip
    sha256: 1e71ddf93849c6a6ecf58b827c0692073d2dd7ee40196158068f7b29f422e87d
    file: sqlite-amalgamation-3530400.zip

setup:
  - [unzip, -o, -q, '{cache}/sqlite-amalgamation-3530400.zip', -d, '{dir}']

causes:
  # ------------------------------------------------------------------ on cpu
  - name: the-passes-o2-adds
    on: cpu
    question: latency
    objective: latency
    injection:
      kind: process
      about: >-
        Two builds of the same translation unit that differ by one flag:
        `-O2`, asked, against `-O0`, run beside it by the reference. The
        difference is the optimisation passes and the code generation they
        feed, about eight times the whole `-O0` compile on this unit: all of
        it `cc1` on a cpu, while the driver waits. The process started beside
        the compile only watches: it ends what an earlier run left, then
        reads every task's `schedstat` under the driver, from outside.
      run: [python3, '{case}/../shared/watch.py', gcc, '{dir}']
      ready: ready
    # `-ftime-report` is gcc's own account, on its stderr, handed to a file
    # by an `exec` that keeps the pid.
    target: [sh, -c, 'exec "$@" 2>{dir}/o2.report', sh,
             gcc, -O2, -ftime-report, -c, '{dir}/sqlite-amalgamation-3530400/shell.c',
             -o, '{dir}/shell-o2.o']
    reference:
      - name: watch
        extractor: key-value
        from: injection
      - name: ftime
        extractor: key-value
        run: [python3, '{case}/ftime.py', '{dir}/o2.report', --,
              gcc, -O0, -ftime-report, -c, '{dir}/sqlite-amalgamation-3530400/shell.c',
              -o, '{dir}/shell-o0.o']
    holds:
      - {value: watch.target_seen, at_least: 1, why: the watcher saw the compile}
      # The -O2 compile ran under the tool (cc1 had 18 % of its samples in the
      # preload shim) and the -O0 one bare, so part of the ratio of about 8
      # is the tool's: 3 holds with that taken out.
      - {value: ftime.ratio, at_least: 3, why: the passes -O2 adds are most of its compile}
    expect:
      limit: cpu
      state: on-cpu
      # The main thread waits for its child in wait4, and the time is the
      # child's: the verdict must not stop at the wait and call the run
      # asleep, which is what the sentence for a sleep says.
      never_says: [asleep on something that is not a lock]
      # The verdict follows the driver's wait into the compiler.
      says: ['for a child, in `wait4`']
      agrees:
        - row: on-cpu
          with: ftime.o2_total_ns
          # The report covers `cc1` from its first phase to its last: the
          # driver's own start, `as` and the exit are the rest of the life.
          outside: ftime.o2_total_ns
          # Printed to the hundredth of a second.
          slack_ns: 10000000
          # A time-based sample counts the interrupts on the task's cpu, and
          # `cc1`'s wall clock its few waits (`cpu.profile`'s caveat).
          relative: 0.02

  # ----------------------------------------------------------------- off cpu
  - name: a-cpu-shared-with-two-competitors
    on: off-cpu
    question: latency
    objective: latency
    injection:
      kind: process
      about: >-
        Two processes that spin on cpu 0, started before the compile; the
        compile is launched on that cpu (`taskset -c 0`, an affinity given at
        exec, the program unchanged), so each of its processes runs a third
        of the time and waits for the cpu the rest. The same process reads
        every task's `schedstat` under the compile, from outside, once a
        millisecond.
      run: [python3, '{case}/../shared/watch.py', gcc, '{dir}', '0', '2']
      ready: ready
    target: [taskset, -c, '0', gcc, -O0, -c, '{dir}/sqlite-amalgamation-3530400/shell.c',
             -o, '{dir}/shell-contended.o']
    reference:
      - name: watch
        extractor: key-value
        from: injection
    holds:
      - {value: watch.target_seen, at_least: 1, why: the watcher saw the compile}
      - {value: watch.competitors, at_least: 2, why: the competitors were spinning}
      - {value: watch.longest_waited_share, at_least: 0.5, why: cc1 waited for its cpu longer than it ran}
    expect:
      limit: cpu-queue
      state: runnable
      never_says: [asleep on something that is not a lock]
      # The verdict follows the driver's wait into the compiler.
      says: ['for a child, in `wait4`']
      agrees:
        - row: runnable
          # The compile's critical path is the driver, then cc1, then `as`,
          # one at a time: every process under the driver, the driver
          # included (cc1 alone leaves out `as`, a tenth of cc1 here).
          with: watch.run_delay_ns
          # A task's last millisecond may be in no read.
          plus: watch.poll_ns
          relative: 0.02
