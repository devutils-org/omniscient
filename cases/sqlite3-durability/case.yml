# Case 2: `sqlite3`, durability.
#
# ROADMAP phase 12. The same program as case 1, asked about the other thing a
# database spends its time on: making each commit durable. The same commits,
# one row each, under two journal settings: a rollback journal with
# `synchronous=FULL`, where every commit waits for the disk to say its journal
# and its database are on the platter, and a write-ahead log with
# `synchronous=NORMAL`, where no commit waits for anything. Each cause is known
# without the tool: from sqlite's own `.timer`, and from a second run of the
# same commits counting the syncs they make. Every run starts from a fresh
# copy of an empty database, in a directory of its own run's: the ways and
# the references measure the same commits on the same empty table, and two
# checkouts running the case at once never share a file.
# `docs/cases.md` describes every field.
name: sqlite3-durability
about: >-
  The sqlite3 command-line shell as the distribution ships it, reading a file
  of single-row INSERT statements with `.read`: every statement is a
  transaction of its own, so every statement is a commit, as durable as the
  database's `journal_mode` and `synchronous` make it.

program:
  command: sqlite3
  obtained: >-
    the distribution's package (`sqlite` 3.53.4 on Arch Linux on the
    development machine), not rebuilt: stripped, built with frame pointers,
    carrying a GNU build id, the library linked into the shell
  version: [sqlite3, --version]
  stripped: true

needs:
  - run: [sqlite3, --version]
    for: the program under test
  - run: [python3, --version]
    for: the scripts that write the commits and count their syncs
  - run: [strace, -V]
    for: counting the syncs of a second run of the same commits (the measured run is never traced)
  # A sync on tmpfs returns at once: the case is about one that waits for a
  # device, so the databases live under the case's cache directory, never in
  # the temporary one.
  - run: [sh, -c, 'mkdir -p {cache} && test "$(stat -f -c %T {cache})" != tmpfs']
    for: a database on storage where a sync waits for a device ({cache} is not on tmpfs)

symbols: debuginfod

fetch: []

# This run's directory on storage, `{dir}/work`: a directory under
# `{cache}/work` named after the run's scratch directory (which holds the
# test's pid), linked from it. A directory whose run's scratch directory is
# gone is an earlier run's, and is removed here. In it, the two empty
# databases every run copies; and the two inputs: 500 commits for the run that
# waits on each, 50 000 for the run that waits on none (enough for its cpu to
# be seconds rather than milliseconds), each row's text 1000 characters wide
# there (below).
setup:
  - [sh, -c, 'work="{cache}/work" run="$(basename "{dir}")" scratch="$(dirname "{dir}")";
      mkdir -p "$work" &&
      for old in "$work"/*; do
        [ -e "$old" ] || continue; [ -d "$scratch/${old##*/}" ] || rm -rf "$old"; done &&
      rm -rf "$work/$run" && mkdir "$work/$run" && ln -s "$work/$run" "{dir}/work"']
  - [sqlite3, '{dir}/work/delete.empty.db',
     'PRAGMA journal_mode=DELETE; CREATE TABLE t(id INTEGER PRIMARY KEY, v TEXT);']
  - [sqlite3, '{dir}/work/wal.empty.db',
     'PRAGMA journal_mode=WAL; CREATE TABLE t(id INTEGER PRIMARY KEY, v TEXT);']
  - [python3, '{case}/commits.py', '{dir}/commits-500.sql', '500']
  - [python3, '{case}/commits.py', '{dir}/commits-50000.sql', '50000', '1000']

causes:
  # ----------------------------------------------------------------- off cpu
  - name: every-commit-waits-for-the-disk
    on: off-cpu
    question: latency
    objective: latency
    injection:
      kind: process
      about: >-
        A rollback journal (`journal_mode=DELETE`) with `synchronous=FULL`: for
        each of the 500 commits sqlite writes the journal, syncs it, writes the
        database, syncs it, and deletes the journal -- four syncs a commit on
        this machine, each one waiting for the device. Nothing about the
        program changes; only the database's settings. The process started
        beside it only watches: it reads the program's `schedstat`, from
        outside, once a millisecond.
      # Watched as sqlite3, from its exec: the shell before it, which copies
      # the database, lives 10 to 20 ms, less than one pass over /proc takes
      # on a loaded machine, and a watcher that waits for it can miss it and
      # never find the target (docs/fixes/w18-cases.md).
      run: [python3, '{case}/../shared/watch.py', sqlite3, '{dir}/work/delete.db']
      ready: ready
    # A fresh copy of the empty database, then sqlite3 by an `exec` that keeps
    # the pid: what the watcher reads is sqlite3's alone.
    target: [sh, -c, 'cd {dir}/work && rm -f delete.db delete.db-journal &&
               cp delete.empty.db delete.db && exec "$@"', sh,
             sqlite3, '{dir}/work/delete.db', 'PRAGMA synchronous=FULL', .timer on,
             '.read {dir}/commits-500.sql']
    own_account: stdout
    reference:
      - name: timer
        extractor: sqlite3-timer
        from: target
      - name: watch
        extractor: key-value
        from: injection
      - name: syncs
        extractor: key-value
        run: [python3, '{case}/fsyncs.py', '{dir}/work/delete.empty.db', FULL,
              '{dir}/commits-500.sql']
    holds:
      - {value: watch.target_seen, at_least: 1, why: the watcher saw the program}
      - {value: syncs.wal, at_most: 0, why: the journal is a rollback journal}
      - {value: syncs.per_commit, at_least: 2, why: every commit syncs its journal and its database}
    expect:
      limit: disk
      state: blocked
      # The block's own frame: the sync, by its libc name.
      leaf: fdatasync
      # The commit, which the stack under the sync passes through: by the
      # debug file debuginfod serves for this build id, `syncJournal` <-
      # `sqlite3PagerCommitPhaseOne` <- `sqlite3BtreeCommitPhaseOne`.
      through: sqlite3PagerCommitPhaseOne
      # `.timer`'s off-cpu (each statement's wall clock less its cpu) is not
      # compared: the time the program waited for a cpu is in it, and in the
      # `runnable` row rather than `blocked` -- up to 18 % of it with five
      # agents loading the machine. The kernel's account splits the two.
      agrees:
        - row: blocked
          # The program's life, less its cpu and its wait for one, by its
          # `schedstat`.
          with: watch.target_blocked_ns
          # Its last millisecond may be in no read; and the edges the
          # watcher's life does not hold (the gate to the exec, the exit to
          # the reap) are a few milliseconds more.
          plus: watch.poll_ns
          slack_ns: 5000000
        - row: runnable
          with: watch.target_run_delay_ns
          plus: watch.poll_ns
          slack_ns: 5000000

  # ------------------------------------------------------------------ on cpu
  - name: commits-that-wait-for-nothing
    on: cpu
    question: latency
    objective: latency
    injection:
      kind: input
      about: >-
        The same single-row commits, 50 000 of them, against a write-ahead log
        with `synchronous=NORMAL`: a commit appends its pages to the log and
        returns, and only a checkpoint (one per 1000 pages of log) syncs
        anything. What is left of a commit is its own work, on the cpu: the
        statement, and the kernel's write path for the log. Each row is 1000
        characters wide: the thread-safe shell takes a mutex on every call,
        the triage's mutex shim reports each one, and with 64-character rows
        its collector's cpu was 92 to 99 % of the statements' (once 104 %,
        over the agent's budget); 1000 characters is more work a commit for
        the same locks, and 74 %.
    target: [sh, -c, 'cd {dir}/work && rm -f wal.db wal.db-wal wal.db-shm &&
               cp wal.empty.db wal.db && exec "$@"', sh,
             sqlite3, '{dir}/work/wal.db', 'PRAGMA synchronous=NORMAL', .timer on,
             '.read {dir}/commits-50000.sql']
    own_account: stdout
    reference:
      - name: timer
        extractor: sqlite3-timer
        from: target
      - name: syncs
        extractor: key-value
        run: [python3, '{case}/fsyncs.py', '{dir}/work/wal.empty.db', NORMAL,
              '{dir}/commits-50000.sql']
      # The same commits with no tool attached: printed beside the measured
      # run's own account, which is the run as the tool's collectors left it.
      # Nothing is asserted on it; the difference is filed in
      # docs/fixes/w17-build.md, "the triage's mutex shim doubles a real
      # program's cpu".
      - name: bare
        extractor: sqlite3-timer
        run: [sh, -c, 'cd {dir}/work && rm -f bare.db bare.db-wal bare.db-shm &&
                cp wal.empty.db bare.db && exec "$@"', sh,
              sqlite3, '{dir}/work/bare.db', 'PRAGMA synchronous=NORMAL', .timer on,
              '.read {dir}/commits-50000.sql']
    holds:
      - {value: syncs.wal, at_least: 1, why: the journal is a write-ahead log}
      - {value: syncs.per_commit, at_most: 0.05, why: no commit syncs; only the checkpoints do}
    expect:
      limit: cpu
      state: on-cpu
      agrees:
        - row: on-cpu
          with: timer.cpu_ns
          outside: timer.real_ns
          # A time-based sample counts the interrupts that ran on the task's
          # cpu, which getrusage leaves out (`cpu.profile`'s caveat); 50 000
          # statements' worth of `.timer` resolution is in the extractor's.
          relative: 0.01

open_findings:
  - check: every-cited-number-agrees-with-the-reference
    sometimes: true
    filed: >-
      docs/fixes/w17-build.md, "a blocked row called exact is short of the
      kernel's", re-measured in docs/fixes/w18-cases.md, "the durability
      case's blocked row": over 500 commits `blocked` is now within 7 to 20
      ms of the program's `schedstat`, either side, where it was 50 to 60 ms
      (3 %) under; beyond the 6 ms the two resolutions allow in most runs,
      within it in about one in four
