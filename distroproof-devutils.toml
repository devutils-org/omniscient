# Cross-tool installed-artifact campaign, using only disposable QEMU guests.
# sh scripts/distroproof/devutils-build.sh
# distroproof up -f distroproof-devutils.toml --no-tui --pin-cache --jobs 4 --json target/matrix/devutils.json
# Each VM gets an L3 cache of its own (--pin-cache): with VMs sharing the
# host's cache and cpus, cpu.cache_misses, runqlat and every other pair read
# across the machine missed their band (2026-10-19); pinned to one domain each
# of the 3900X's four, they failed no more pairs than one VM at a time
# (2026-10-21). Longest first, so the queue ends together: Ubuntu 18.04's
# pairs run until their 2400 s timeout, then Fedora and Gentoo. Debian 11 is
# not here: past its end of life its security archive answered 404 for
# packages its index still listed (2026-10-21).
[defaults]
memory = "3G"
cpus = 2
timeout = "60m"

[[target]]
name = "chain-ubuntu-18.04"
image = "ubuntu-18.04"

[[target]]
name = "chain-fedora-latest"
image = "fedora-latest"

[[target]]
name = "chain-gentoo"
image = "gentoo"
timeout = "120m"

[[target]]
name = "chain-rocky-8"
image = "rocky-8"

[[target]]
name = "chain-ubuntu-22.04"
image = "ubuntu-22.04"

[[target]]
name = "chain-ubuntu-24.04"
image = "ubuntu-24.04"

[[target]]
name = "chain-rocky-9"
image = "rocky-9"

[[target]]
name = "chain-debian-13"
image = "debian-13"

[[target]]
name = "chain-debian-12"
image = "debian-12"

[[target]]
name = "chain-ubuntu-20.04"
image = "ubuntu-20.04"

[[target]]
name = "chain-arch"
image = "arch"

[[target]]
name = "chain-alpine"
image = "alpine"

[run]
setup = "sh scripts/distroproof/witnesses.sh"
command = "python3 scripts/distroproof/devutils/chain.py"
as_user = "test"
file_caps = { "/opt/omn/bin/omn" = ["bpf", "perfmon", "net_raw"] }
collect = ["cross-tools.json", "witnesses.json", "xpac-history.json", "installed-packages.json", "reference.log"]
exclude = ["*"]
include = ["target/devutils-input", "scripts/distroproof", "catalog/references", "tests/reference/workloads", "tests/gpu_workload.py"]
