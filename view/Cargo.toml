[package]
name = "omn-view"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "omn top: an interactive terminal view of what omn measures, live or from a recording"
license = "MIT OR Apache-2.0"

[lib]
name = "omn_view"
path = "src/lib.rs"

# The view is a projection of what `omn` already writes: it reads results and
# events, and never opens a source of its own. So it depends on nothing of
# `omn` -- which also keeps the dependency one way: `omn` links this crate as
# its `top` subcommand, and a crate cannot depend on the crate that links it.
# ratatui 0.29 rather than 0.30: the latter needs rustc 1.88, above the
# workspace's declared 1.82.
[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
