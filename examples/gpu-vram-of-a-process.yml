# Zero video memory held, reported as zero.
#
#   omn -f examples/gpu-vram-of-a-process.yml
#
# `gpu.mem` is the only `gpu` source that attributes anything to a process: the
# driver keeps a per-process VRAM figure and this reads it, so the series is
# that program's own and the device totals ride along beside it under names of
# their own.
#
# The program here never opens a context, and that is the measurement. It holds
# no video memory, and the run reports a series of zeros with `held_as: none`
# -- not an empty series. "Nothing was measured" and "the measurement is zero"
# are different claims about a run, and only the second one is true here. A
# collector that returned nothing would leave a reader unable to tell a program
# that used no GPU from a collector that failed.
#
# The same read also answers a second question nobody asked it: `scope` says
# `process`, so the zero cannot later be mistaken for a device that was empty.
# The device was not empty -- `device_used_bytes` in the same event says what it
# was holding, all of it somebody else's.
#
# For a program that does hold video memory, and for the check that the figure
# is right to the byte, see `examples/gpu-vram-step.yml`.
name: video memory held by a process that holds none
format: text

requests:
  - label: vram
    source: gpu.mem
    target: {launch: [python3, tests/gpu_workload.py, idle, "600"]}
    mode: poll@100ms
    emit: [raw, summary]
    keys: [task]
