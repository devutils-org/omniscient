# What the device did while a kernel was resident on it.
#
#   omn -f examples/gpu-device-state.yml
#   omn -f examples/gpu-device-state.yml --format json
#
# Four device figures over one window -- the energy the board drew, the shader
# clock it ran at, how hot it got, and the fraction of the window something was
# executing -- taken while a workload keeps a compute kernel on the GPU from
# one end of the window to the other.
#
# None of these four belongs to a process, and the launched program does not
# change that: it sets the window, not the scope. Every event says so in its
# `scope` attribute, because a device figure taken while one program ran is not
# that program's figure and the file has to say that without a reader who
# remembers the command line.
#
# This session means nothing on its own. Read it against
# `examples/gpu-idle-baseline.yml`, which is the same four figures over the same
# kind of window with the GPU left alone: the pair is the measurement, and the
# difference between them is the only part attributable to the workload.
#
# The workload is `tests/gpu_workload.py kernel`, which keeps launches queued
# eight deep so the device never waits for the host between two of them. Its
# chosen property is the one being checked: something was executing on the GPU
# for the whole window.
name: the device under a resident kernel
format: text

requests:
  - label: energy
    source: gpu.power
    target: {launch: [python3, tests/gpu_workload.py, kernel, "1600"]}
    mode: poll@100ms
    emit: [timeline, summary]

  - label: clock
    source: gpu.freq
    target: {launch: [python3, tests/gpu_workload.py, kernel, "1600"]}
    mode: poll@100ms
    emit: [timeline, summary]

  - label: temperature
    source: gpu.temp
    target: {launch: [python3, tests/gpu_workload.py, kernel, "1600"]}
    mode: poll@100ms
    emit: [summary]

  # Polled at 100 ms and refreshed by the driver about once a second, so ten
  # consecutive points here are one measurement repeated. The collector records
  # that as a one-second `ts_err_ns` on every event; no emit this source
  # declares can show it. `docs/scenarios/gpu.md` has the entry.
  - label: busy
    source: gpu.engine_busy
    target: {launch: [python3, tests/gpu_workload.py, kernel, "1600"]}
    mode: poll@100ms
    emit: [timeline, summary]
