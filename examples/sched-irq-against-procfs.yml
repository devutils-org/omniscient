# How much of this machine goes to interrupt handlers, and to which devices?
#
#   omn -f examples/sched-irq-against-procfs.yml
#
# `/proc/interrupts` counts the same interrupts this measures and says nothing
# about how long any of them took. A million fast interrupts and ten thousand
# slow ones are the same file and different machines, and the difference is what
# this source is for.
#
# That file is also the ground truth. The kernel increments those counters
# itself, in a different place and for a different reason, so a run bracketed by
# two reads of it has an independent answer to check against. The check is an
# inequality rather than an equality, and deliberately: the tool attaches after
# the first read and detaches before the second, so what it counts is inside
# what the file counts, always. Measured on the development machine over three
# seconds:
#
#   irq  tool  procfs  name
#    70   321     321  nvme0q2
#    69   154     154  nvme0q1
#    71     5       5  nvme0q3
#    84   387     439  iwlwifi:default_queue
#
# The exact ones are the lines that were quiet at the edges of the window; the
# others differ by what arrived while the tool was starting and stopping.
#
# What this cannot say is which *process* paid. An interrupt handler preempts
# whatever was on the cpu, runs outside any schedule, and is charged to nobody:
# a thread that took ten milliseconds longer than its own cpu time explains may
# have spent them being interrupted, and no per-task source in this tool can see
# it. The cpu is the series here for that reason.
#
# And this is the hard half only. The catalog's summary for this source says
# "hard and soft"; softirq time -- the network receive path, block completions,
# the timer wheel -- is `softirq_entry` and `softirq_exit`, which the entry does
# not declare as requirements and this build does not attach to. Every run says
# so in its own output rather than leaving it here.
# `count` narrows what any source may emit -- a single measurement over one
# window is not a distribution and not a ranking -- so this session asks for the
# three `count` allows. examples/sched-sweep-machine.yml has the traced form,
# where `hist` and `topk` are the point.
name: where the interrupts went
format: text
duration: 3s

requests:
  - label: handlers
    source: sched.irq
    target: system
    mode: count
    emit: [rate, raw, summary]
    keys: [cpu]
