# Who unblocks whom.
#
#   omn -f examples/sched-wakeup.yml
#
# This is the measurement no cpu profiler can stand in for. A blocked thread
# burns no cycles and appears nowhere in a profile of the ones that do, so a
# profile of a program that spends its life waiting is a profile of the waiting
# it did not do. `sched.wakeup` records both ends of every wakeup: who was made
# runnable, and who made them.
#
# The property the workload chose: the shell below blocks in `wait4` five times
# and is released five times, each by a different child exiting. So the run must
# contain at least five wakeups whose wakee is the shell, with at least five
# distinct wakers -- and the count of `sleep` children is in the loop, not read
# off the output.
#
# `sched.switches` beside it is the same five blocks counted from the other
# side, through `perf_event_open` rather than eBPF. It needs no privileges and
# cannot say who released the block; `sched.wakeup` needs CAP_BPF and
# CAP_PERFMON and is the only thing that can.
#
# Read the waker as evidence, not as proof. A wakeup issued from a hard
# interrupt, a softirq or an NMI has the interrupt as its waker -- `waker_tid`
# 0 and `waker_context` naming which -- and the join below names it so:
# `interrupt (hardirq) -> task:N` is a timer releasing a `sleep`, where
# `task:0 (idle)` would be the idle task, which is what a waker of 0 with
# `waker_context: task` is. A softirq served in a task's own `local_bh_enable`
# is recorded as a softirq, though that task caused it.
#
# The join is the causal chain, two hops deep: each `sleep` child released by
# the timer, and the shell released by each child's exit. `sched.switches`
# is what the released task did next -- every switch of a task until it is
# woken again is credited to whoever woke it -- so the table ranks who kept
# whom running. `tests/join_engine.rs` checks both kinds of hop against the
# loop's five children. examples/sched-round-trips.yml is where the wakers are
# two threads of one program.
name: what blocks this program, and who releases it
requests:
  - label: wakeups
    source: sched.wakeup
    target: &five-children
      launch:
        - /bin/sh
        - -c
        - "for i in 1 2 3 4 5; do sleep 0.02; done"
    mode: trace
    emit: [raw, topk:5, summary]
    keys: [task]

  - label: switches
    source: sched.switches
    target: *five-children
    mode: trace
    emit: [summary]
    keys: [task]

joins:
  - id: who-released-this
    from: sched.wakeup
    to: sched.switches
    via: task
    match: wakeup
    waker: waker_tid
    depth: 2
    window: 1s
    top: 12
