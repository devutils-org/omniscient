# Is this program running out of handles?
#
#   omn -f examples/proc-handles.yml
#
# Two counts, both exact, both meaningless on their own. A descriptor count is
# read against the limit it is approaching -- which is why the limit and the
# remaining headroom are reported beside it -- and a thread count is read
# against what the program was designed to run.
#
# These are the only two counts in the catalog that can be checked exactly: a
# process holding seventeen descriptors holds seventeen, with no skid, no
# sampling and no folio size in the way. So the workload here says what it
# holds. It opens seventeen files on top of the three every process starts
# with, and starts five worker threads beside its main one, and writes both
# numbers to standard error before holding still. A reader can compare them to
# the series without trusting this tool at all, and `tests/scenario_proc.rs`
# does exactly that.
#
# Both sources are free: one directory listing and one file read per tick. This
# is the session to leave running next to a service that leaks handles slowly,
# where the leak is only visible over hours.
#
# Read the series from its second point, not its first, and ignore its last.
# Defects 1 and 2 of docs/scenarios/proc.md: the first poll lands before the
# launched program has replaced this tool's image, and the last one reads a
# process that has already exited and reports it as holding nothing.
name: handle pressure
format: text

requests:
  - label: descriptors
    source: proc.fd
    target:
      launch:
        - python3
        - -c
        - |
          import sys, threading, time
          held = [open('/dev/null') for _ in range(17)]
          stop = threading.Event()
          workers = [threading.Thread(target=stop.wait) for _ in range(5)]
          for worker in workers:
              worker.start()
          sys.stderr.write('HELD 20\nRUNNING 6\n')
          sys.stderr.flush()
          time.sleep(0.3)
          stop.set()
    mode: poll@50ms
    # `task` is what phase two joins on: a descriptor count that cannot be
    # attributed to a process is a number with nowhere to go.
    keys: [task]
    emit: [timeline, summary]

  - label: threads
    source: proc.threads
    target:
      launch:
        - python3
        - -c
        - |
          import sys, threading, time
          held = [open('/dev/null') for _ in range(17)]
          stop = threading.Event()
          workers = [threading.Thread(target=stop.wait) for _ in range(5)]
          for worker in workers:
              worker.start()
          sys.stderr.write('HELD 20\nRUNNING 6\n')
          sys.stderr.flush()
          time.sleep(0.3)
          stop.set()
    mode: poll@50ms
    keys: [task]
    emit: [timeline, summary]
