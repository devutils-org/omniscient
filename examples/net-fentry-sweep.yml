# Does every axis the two fentry `net` sources declare actually work?
#
#   omn -f examples/net-fentry-sweep.yml
#
# The capability sweep for `net.tcp.connect` and `net.socket`, the eighth
# wave's two, which attach to kernel functions by their BTF type id rather than
# to tracepoints. Every emit each declares, in every mode the matrix lets it
# have: `net.socket` is counted in the kernel, so it also answers `count` --
# with `raw` and `summary`, because a counted run is one number per row and
# the mode x emit matrix refuses a histogram or a ranking of one number.
#
# Both need CAP_BPF and CAP_PERFMON, which `make` puts on the binary; without
# them this file exits 1 and names them.
#
# **On an idle machine `net.tcp.connect` reports nothing, and that is right.**
# Nothing connected. To see both answer, push something through loopback in
# another terminal while this runs:
#
#   python3 -c 'import socket
#   l = socket.socket(); l.bind(("127.0.0.1", 0)); l.listen(1)
#   c = socket.create_connection(l.getsockname()); s, _ = l.accept()
#   c.sendall(b"x" * 65536); s.recv(1 << 20); c.close()'
#
# Every handshake comes back with its outcome -- `established`, `refused`, or
# `failed` -- and every send and receive with the socket's cookie, which is
# the number `SO_COOKIE` and `ss -e` report for it. `tests/scenario_net.rs`
# checks both against a workload that asks the kernel for its own sockets'
# cookies.
name: the fentry leg of the net capability sweep
duration: 500ms
format: text

requests:
  - label: handshakes
    source: net.tcp.connect
    target: system
    mode: trace
    emit: [hist, topk, raw, summary]
    keys: [sock]

  - label: sends-and-receives
    source: net.socket
    target: system
    mode: trace
    emit: [hist, topk, raw, summary]
    keys: [sock]

  - label: counted
    source: net.socket
    target: system
    mode: count
    emit: [raw, summary]
    keys: [sock]
