# Readahead in front of a sequential reader, and not in front of a random one.
#
#   omn -f examples/io-readahead-patterns.yml
#
# The launched program writes two 32 MiB files, syncs them and tells the page
# cache to forget both. It reads the first 2 MiB of one in 64 KiB reads, in
# order, and 128 single pages of the other at random offsets. Each read asks
# for 512 or 128 pages, and what the kernel filled is the question:
#
#   omn-sequential.bin   ahead > 0   the cache was filled past what was read,
#                                    because the reads looked sequential
#   omn-random.bin       ahead = 0   each random page read as itself, and
#                                    nothing around it
#
# How far ahead is the kernel's readahead window, which starts at the device's
# `read_ahead_kb` and grows while the reader keeps up; on the development
# machine, 128 KiB on an NVMe drive under btrfs, this session's 512 pages were
# read with 1280 more ahead of them. What does not depend on the machine is the
# sign, and that random reads are read ahead of by next to nothing.
#
# `count` rather than `trace`: one row per file over the whole run, which is
# the question here. Run it from a real filesystem; the files are removed.
name: readahead, sequential against random
format: text

requests:
  - label: ahead
    source: io.readahead
    target:
      launch:
        - python3
        - -c
        - "import os,random; b=os.urandom(1<<20); s,r='omn-sequential.bin','omn-random.bin'; [open(p,'wb').write(b*32) for p in (s,r)]; os.sync(); fs,fr=os.open(s,os.O_RDONLY),os.open(r,os.O_RDONLY); [os.posix_fadvise(d,0,0,os.POSIX_FADV_DONTNEED) for d in (fs,fr)]; [os.pread(fs,65536,i*65536) for i in range(32)]; [os.pread(fr,4096,p*4096) for p in random.Random(7).sample(range(8192),128)]; [os.remove(p) for p in (s,r)]"
    mode: count
    emit: [rate]
