# The two `runtime` backends this build does not implement.
#
#   omn -f examples/runtime-not-built.yml          # exit 3, and why
#   omn -f examples/runtime-not-built.yml --dump-request
#
# Valid, resolvable, and not written. Exit 3, which is not exit 1 and not exit
# 2; see `proc-not-built.yml` for the three-way distinction.
#
# USDT landed in the eighth wave, so `runtime.gc`, `runtime.alloc` and
# `runtime.custom` collect now (`runtime-usdt-*.yml`). What is left is two
# roads, each pinned here so the answer is "this build does not have it" rather
# than a resolver quietly taking the other one:
#
# - `runtime.jit` over `bpf:usdt`. The mechanism exists; what is missing is the
#   table of which probes are a compilation -- HotSpot's
#   `method__compile__begin`/`end` carry the method's name as a pointer and a
#   length, which needs a string read this build's USDT program does not do.
#   The map backend measures instead, and says what it degrades.
# - `runtime.custom` over `bpf:uprobe`, a probe on a symbol rather than a
#   marker. Nothing declares which symbol yet, and the kernel's `uprobe` PMU
#   wants CAP_SYS_ADMIN besides -- see docs/families/runtime.md.
#
# Only the first request is reached: the run stops at the first source it
# cannot serve.
name: valid, and not written yet
duration: 500ms
format: text

requests:
  # The written source, pinned to its unwritten backend.
  - label: jit-the-other-way
    source: runtime.jit
    target: &any-runtime
      launch:
        - sh
        - -c
        - "sleep 0.2"
    mode: trace
    keys: [task]
    emit: [raw, summary]
    backend: force:bpf:usdt

  # A probe on a symbol, which is the second road of the extension point.
  - label: a-symbol-of-your-own
    source: runtime.custom
    target: *any-runtime
    mode: trace
    keys: [task]
    emit: [summary]
    backend: force:bpf:uprobe
