# The one `sched` backend this build describes and a user can still reach
# without a collector.
#
#   omn -f examples/sched-not-implemented.yml ; echo $?   # 3
#
# It is vocabulary: it resolves, it validates, and it says plainly that nothing
# collects it yet. That is a different answer from "this machine cannot", and it
# has its own exit code so a script can tell them apart -- a reader who takes
# exit 3 for a machine limit goes looking for a kernel option that would not
# have helped.
#
# This file used to name a whole source. The sixth wave left one, `sched.mutex`,
# and the ninth gave it its first backend: the `LD_PRELOAD` shim that already
# interposed `malloc` now interposes `pthread_mutex_lock` too, and
# examples/sched-mutex-known-hold.yml is that measurement. What is left is the
# fallback, pinned here because the resolver would never reach it on a machine
# that can preload:
#
#   bpf:uprobe   a uprobe on `pthread_mutex_lock` inside the target's own
#                libc, which needs the symbol resolved in that mapping. The
#                attach kind exists in `src/bpf/attach.rs`; nothing calls it
#                for this source. It is the one that could serve a process
#                already running, which a preloaded shim never can.
name: described, not built
requests:
  - label: pthread-mutex-contention
    source: sched.mutex
    target: {launch: ["/bin/true"]}
    mode: trace
    emit: [hist]
    backend: "force:bpf:uprobe"
