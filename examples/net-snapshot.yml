# The `snapshot` leg of the sweep: one read, now.
#
#   omn -f examples/net-snapshot.yml
#
# Three `net` sources declare `snapshot`, and all three are counter sources --
# which is the whole difficulty. A counter source reports the *increment*
# between two reads, and a snapshot's window is the time between its one read
# and the closing read that follows it, which is on the order of a hundred
# microseconds. So these numbers are increments over a hundred microseconds,
# not the totals since boot, and on an idle machine every one of them is zero.
#
# That is not an idle machine reporting correctly. `docs/scenarios/net.md`
# records it under "Defects found": an accept queue that is demonstrably
# overflowing -- `net.backlog --mode count` sees nineteen drops in a second --
# reports zero drops and zero overflows through this file.
#
# `net.hwts` is the one source here for which a snapshot means what it says: an
# offset between two clocks is a level, not a counter, so reading it once is the
# whole answer.
name: the snapshot leg of the net capability sweep
format: text

requests:
  - label: links
    source: net.iface
    target: system
    mode: snapshot
    emit: [raw, summary]
    keys: [iface]

  - label: accept-queue
    source: net.backlog
    target: system
    mode: snapshot
    emit: [raw, summary]

  - label: nic-clocks
    source: net.hwts
    target: system
    mode: snapshot
    emit: [raw, summary]
    keys: [iface]
