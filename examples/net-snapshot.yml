# The `snapshot` leg of the sweep: one read, now.
#
#   omn -f examples/net-snapshot.yml
#
# Three `net` sources declare `snapshot`, and two of them are counter sources --
# which used to be the whole difficulty. A counter source reports the
# *increment* between two reads, and a snapshot's window was the time between
# its one read and the closing read that followed it, on the order of a hundred
# microseconds; so these numbers were increments over a hundred microseconds and
# every one of them was structurally zero. An accept queue that was demonstrably
# overflowing -- `net.backlog --mode count` sees nineteen drops in a second --
# reported zero drops and zero overflows through this file.
#
# A snapshot now reports what a single read can honestly report: the counters as
# they stand, under names that say so -- `drops_since_boot` rather than `drops`,
# and a `basis` attribute on every event. There is no closing read, because
# there is no window to close. `docs/scenarios/net.md` has the entry, under
# "Defects found" 3, marked fixed.
#
# `net.hwts` is the one source here for which a snapshot means what it says: an
# offset between two clocks is a level, not a counter, so reading it once is the
# whole answer.
name: the snapshot leg of the net capability sweep
format: text

requests:
  - label: links
    source: net.iface
    target: system
    mode: snapshot
    emit: [raw, summary]
    keys: [iface]

  - label: accept-queue
    source: net.backlog
    target: system
    mode: snapshot
    emit: [raw, summary]

  - label: nic-clocks
    source: net.hwts
    target: system
    mode: snapshot
    emit: [raw, summary]
    keys: [iface]
