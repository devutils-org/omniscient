# The four `proc` sources this build does not implement yet.
#
#   omn -f examples/proc-not-built.yml          # exit 3, and why
#   omn -f examples/proc-not-built.yml --dump-request
#
# This session is valid. It validates, it resolves, it names a backend -- and
# then it stops, because no collector is written for `bpf:tp`. That is a third
# answer, distinct from the other two, and it has an exit code of its own:
#
#   2   the request cannot mean anything          docs/scenarios/proc.md
#   3   this build does not implement it          this file
#   1   this machine cannot serve it              not reachable for this family
#
# The distinction is the whole point. A caller that cannot tell "you asked for
# something impossible" from "this is not written yet" cannot decide whether to
# fix the request or wait for a release, and `--dump-request` on this file
# prints exactly how these would be obtained on a build that has them.
#
# All four wait on one piece of work: `src/bpf/` attaches exactly one way,
# `BPF_RAW_TRACEPOINT_OPEN`, and these four entries ask for `bpf:tp` -- a
# numeric id out of tracefs and `PERF_EVENT_IOC_SET_BPF`. The tracepoints
# themselves are present on this machine; `omn list proc` says so with `yes` in
# its HERE column and `none` in its COLLECTOR column, which are two different
# questions and are deliberately kept apart.
#
# Only the first request is reached: the run stops at the first source it
# cannot serve. The other three are here so that the file is the list, and so
# that the day `bpf:tp` lands this becomes a session rather than an epitaph.
name: valid, and not written yet
duration: 500ms
format: text

requests:
  # Every process that started while the run was open, with its filename.
  - label: what-ran
    source: proc.exec
    target: system
    mode: trace
    keys: [task, cgroup]
    emit: [timeline, topk, summary]

  # And what became of each of them: the exit code is the field that matters.
  - label: what-ended
    source: proc.exit
    target: system
    mode: trace
    keys: [task, cgroup]
    emit: [timeline, topk, summary]

  # Which signals were delivered to whom, ranked. `count` would be the cheaper
  # mode, but `count` cannot produce a `topk` -- a mode that never sees an
  # individual event cannot rank who produced them -- and the validator says so
  # by name. That refusal is correct; the ones worth recording are the refusals
  # that name the wrong thing, and docs/scenarios/proc.md has them.
  - label: signals
    source: proc.signals
    target: system
    mode: trace
    keys: [task]
    emit: [topk, rate, summary]

  # The expensive one, and the reason its caveat exists: `raw_syscalls` fires
  # on everything, so this has to aggregate in the kernel or filter by syscall
  # number inside the eBPF program. A raw trace of it on a syscall-heavy
  # workload is a load test, not a measurement.
  - label: syscall-latency
    source: proc.syscall
    target: system
    mode: trace
    keys: [task, req]
    emit: [hist, topk, summary]
