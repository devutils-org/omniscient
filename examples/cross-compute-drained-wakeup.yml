# What a wakeup join onto a drained total attributes, and why the first session
# does not use it.
#
#   omn -f examples/cross-compute-drained-wakeup.yml
#
# `sched.wakeup -> sched.offcpu` reads like "what released each block", and it
# is the join `BRIEF_NEXT.md` names for this crossing. It is not that, and this
# session shows why with the half-blocked workload's 600 round trips.
#
# `sched.offcpu` keeps its totals in the kernel and drains them every 100 ms: one
# event is one `(task, state, stack)` over one interval, and it stands for as
# many blocks as its `blocks` attribute says -- 159, 171, 169 and 101 for the
# pipe read here. A wakeup join credits each `to` event to the wakeup that most
# recently released that task, so each drained total, all of its blocks, goes to
# whichever wakeup came last before the drain. The engine then reports
# `15 of 15 events attributed` at evidence WAKEUP, for 612 blocks.
#
# Measured on this machine: the responder released the driver 602 times, and
# the last drain's pipe blocks -- a hundred of them, every one released by the
# responder -- were credited to one of the short-lived children the driver
# waits for after its loop, which woke it once. The level printed beside that
# is WAKEUP; what it rests on is two things happening close together in time,
# which is TEMPORAL.
#
# The per-switch join in `cross-compute-where-the-time-went.yml` does not have
# this problem: one `sched.switches` event is one switch.
#
# THE JOIN IS NOW REFUSED, before anything is attached. The catalog marks every
# `sched.offcpu` backend `drained`, and the validator refuses a `wakeup` join
# onto a source whose events stand for many occurrences, naming the source to
# use instead:
#
#   error: rule `what-released-the-block` matches by `wakeup` onto
#   `sched.offcpu`, whose events are totals drained from the kernel: each
#   stands for many occurrences, and a wakeup can release only one. [...] Join
#   onto a source with one event per occurrence, such as `sched.switches`
#   exit 2
#
# So the rule is below as a comment, and what this session still measures is
# the reason for the refusal: how many blocks each drained event holds, against
# the kernel's count of the task's voluntary switches.
name: a wakeup join onto a drained total
format: text

requests:
  - label: blocked
    source: sched.offcpu
    target: &halves
      launch:
        - /bin/sh
        - -c
        - |
          D=$(mktemp -d); mkfifo "$D/a" "$D/b"
          { exec 4<"$D/a" 5>"$D/b"
            while read -r _ <&4; do
              j=0; while [ $j -lt 100 ]; do j=$((j + 1)); done
              echo y >&5
            done; } &
          exec 3>"$D/a" 6<"$D/b"
          i=0
          while [ $i -lt 600 ]; do
            j=0; while [ $j -lt 100 ]; do j=$((j + 1)); done
            echo x >&3; read -r _ <&6
            i=$((i + 1))
          done
          exec 3>&- 6<&-; rm -rf "$D"
          V=$(grep '^voluntary_ctxt' /proc/$$/status); V=${V##*[!0-9]}
          echo "omn-truth tid=$$ voluntary=$V" >&2
    mode: trace
    emit: [raw]
    keys: [task]

  - label: released-by
    source: sched.wakeup
    target: *halves
    mode: trace
    emit: [topk:3]
    keys: [task]

# The rule the validator refuses, kept so that `tests/cross_compute.rs` can ask
# for it and check that the refusal still happens:
#
# joins:
#   - id: what-released-the-block
#     from: sched.wakeup
#     to: sched.offcpu
#     via: task
#     match: wakeup
#     waker: waker_tid
#     window: 10s
#     top: 5
