# A request that is valid, that this machine can serve, and that this build
# cannot collect.
#
#   omn validate -f examples/mem-refused-not-built.yml  # says it is valid
#   omn -f examples/mem-refused-not-built.yml           # refuses, exit 3
#
# Allocations can be watched three ways, and the catalog names all three for
# `mem.heap.alloc`: a preloaded shim, a USDT probe in the allocator, and a
# uprobe on `malloc` itself. Only the shim is written. The uprobe is attached
# through eBPF, which this build does for thirty other sources and which this
# machine serves -- so pinning it asks for something the machine could do and
# nobody has written.
#
# The code is 3 and not 1, and the difference is the difference between "your
# machine cannot do this" and "we have not written it". Reading the wrong one of
# those two answers sends a reader to look at their kernel config for an
# afternoon over a mechanism nobody has written.
#
# The session has asked for three different things, and why it stopped each time
# is the history of this answer. First `mem.reclaim`: the `tracepoint:` probe
# became honest, the machine could not serve it, and the answer became exit 1;
# a raw tracepoint put it back at exit 3, and then the sixth wave wrote the
# collector. Then `mem.latency`, "an illustration that will last" because PEBS
# and IBS were written for nobody -- until the ninth wave wrote IBS, and it now
# exits 0 and measures load latency (`examples/mem-load-latency.yml`). A source
# stops being an illustration of this answer the day someone writes it, which is
# the point of the answer, so the session now pins one backend of a source that
# has a collector for another: that illustration lasts as long as the uprobe is
# unwritten, and says so the day it is not.
name: an allocation uprobe, which nothing here collects
format: text

requests:
  - label: allocations by uprobe
    source: mem.heap.alloc
    backend: force:bpf:uprobe
    target: {launch: ["/bin/sh", "-c", "sleep 0.05"]}
    mode: trace
    emit: [summary]
