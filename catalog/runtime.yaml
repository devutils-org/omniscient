# Family `runtime` (late phase) — see docs/CATALOG.md section 10.
# The layer above the kernel: GC, JIT, allocator, interpreter. Without it, a GC
# pause or a JIT deoptimization gets attributed to the wrong resource.
# Not a closed family: it is the extension point where users declare their probes.

- id: runtime.gc
  family: runtime
  summary: "Garbage collection pauses"
  unit: ns
  backends:
    # What the machine must provide is a uprobe and a loaded program. Whether
    # the runtime carries the probes is a fact about the target, read from its
    # ELF notes at attach and refused there by name -- the same reason
    # `runtime.jit` requires `/tmp` rather than the map.
    - {id: "bpf:usdt", requires: ["uprobe", "bpf", "btf"], cost: low}
  modes: [trace]
  emits: [hist, timeline, raw, topk, summary]
  targets: {pid: native, launch: native}
  keys: [task]
  filter_fields: [comm, generation, provider, phase]
  determinism: low
  caveats:
    - "A runtime built without its probes reports no probe, which is not the same
       as a runtime that did not pause. Absence is the normal case: the python3
       of most distributions is built without --with-dtrace, and a Java runtime
       needs +ExtendedDTraceProbes. The refusal names the probes it looked for
       and lists what each object the target maps actually carries."
    - "A pause is the time between the runtime's own begin and end probes on one
       thread: python gc__start/gc__done, node gc__start/gc__done, hotspot
       gc__begin/gc__end, ruby's mark and sweep pairs as two phases. It is the
       runtime's account of its collector, not a measurement of how long the
       program's other threads were stopped."
    - "Each probe hit is a uprobe trap into the kernel, measured at about 740 ns
       against about 70 ns for a preload shim writing the same event into its
       shared ring (finding 47). Two per pause is
       nothing; it is the per-hit price every USDT source pays."

- id: runtime.jit
  family: runtime
  summary: "JIT compilation and deoptimization events"
  unit: count
  backends:
    - {id: "bpf:usdt", requires: ["usdt:jit"], cost: low}
    - {id: "fs:jit-map", requires: ["/tmp"], cost: low,
       degraded: "symbol map only: it names the code that was compiled and when it was
         first seen, it does not time the compilation, and it carries no deoptimizations"}
  modes: [trace]
  emits: [raw, rate, topk, timeline, summary]
  targets: {pid: native, launch: native}
  keys: [task]
  filter_fields: [comm, method, code_kind, bytes]
  determinism: low
  caveats:
    - "The map exists only if the runtime was started so that it writes one:
       node --perf-basic-prof, or a JVM with an agent that maintains
       /tmp/perf-<pid>.map. A run that reads no map reports that it read none;
       it does not report that nothing was compiled."
    - "The file records that code exists, never when it was created, so an entry
       is only known to have appeared between two reads and every event carries
       that gap as ts_err_ns. Entries already present at the first read are older
       than the run by an amount nothing records, and carry the largest error the
       event model can express."
    - "A runtime publishes its own precompiled builtins through the same file.
       They are not compilations this run caused; filter on code_kind to
       separate them."
    - "topk ranks series, and the only key here is task, so it ranks processes
       and not methods: a run against one program answers with one row whose
       total is the event count. The method is an attribute rather than a key,
       so which methods dominated -- the question a JIT map exists to answer --
       is not reachable through any emit. Filter on method to select one, and
       read the compilations off raw."

- id: runtime.alloc
  family: runtime
  summary: "Runtime-level allocation activity (objects, not the C heap under it)"
  unit: bytes
  backends:
    - {id: "bpf:usdt", requires: ["uprobe", "bpf", "btf"], cost: med}
  modes: [trace, poll]
  emits: [hist, topk, stack, timeline, summary]
  targets: {pid: native, launch: native}
  keys: [task]
  filter_fields: [comm, bytes, provider]
  determinism: high
  caveats:
    - "This is the runtime's own allocation -- an object, a boxed value, a
       generation -- which only the runtime can report. The C allocator beneath
       it is mem.heap.alloc, and for a managed runtime the two are unrelated:
       V8 maps its heap directly and never calls malloc for it."
    - "Only a runtime that publishes an allocation's size can serve a source
       whose unit is bytes: hotspot's object__alloc, under
       -XX:+ExtendedDTraceProbes. Ruby's object__create names a class and no
       size, and CPython and node publish no allocation probe at all."
    - "One uprobe trap per object, at about 740 ns each: a runtime allocating a
       million objects a second is a different program under this source. That
       is why the band is med, and why the allocation probe is off by default in
       the runtimes that have one."

- id: runtime.custom
  family: runtime
  summary: "User-declared probe on an arbitrary symbol or USDT marker"
  unit: count
  backends:
    - {id: "bpf:usdt", requires: ["uprobe", "bpf", "btf"], cost: med,
       filter_fields: [comm, provider, probe, object]}
    - {id: "bpf:uprobe", requires: ["uprobe", "bpf", "btf"], cost: high,
       filter_fields: [comm],
       degraded: "~1-2 us per hit: only viable on low-rate call sites"}
  modes: [trace, count]
  emits: [hist, topk, stack, raw, rate, summary]
  targets: {pid: native, tid: native, launch: native}
  keys: [task]
  filter_fields: [comm, provider, probe, object]
  determinism: low
  caveats:
    - "The probe is named through the filter, by provider and probe: --filter
       \"provider == 'libc' && probe == 'setjmp'\". A request that names no probe
       is refused, and the refusal lists what the target carries. The probe
       part of the filter decides what is attached, so a probe it excludes
       costs nothing; the rest of it is evaluated on each hit."
    - "Arguments are reported as arg0, arg1, ... as the probe's descriptor
       declares them, signed where it says signed. One the build cannot read --
       a symbol-relative or indexed operand, or user memory that faulted -- is
       absent from the event rather than zero, and the run counts it."
    - "For a launched program the probes are found before it execs, in the
       executable and the libraries its dynamic section names. A library it
       loads later with dlopen is not among them, and the run lists what it
       read."
    - "A probe guarded by a semaphore only fires while its counter is raised.
       The kernel raises it through the link, in the target's image of the file,
       from before a launched program's first instruction. On a kernel older
       than 6.6 the sites go through the uprobe PMU instead, which needs
       CAP_SYS_ADMIN and maintains no semaphore: without that privilege
       `uprobe` is missing there, and with it the run says it fell back."
    - "Each hit is a uprobe trap into the kernel, measured at about 740 ns
       against about 70 ns for a preload shim writing the same event into its
       shared ring (finding 47). USDT is how a
       program you did not launch is reached, not a cheap way to reach one you
       did."

# The family's default: none. See docs/lazy.md.
- default:
    family: runtime
    none: "each runtime source answers for one language runtime -- a garbage
      collector, a JIT, an allocator, a probe the program itself declares --
      and which one a program runs is not known before it runs: name the source
      for that runtime"
