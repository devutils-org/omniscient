# Family `gpu` — see CATALOG.md section 8.
# NVIDIA is proprietary: no DRM scheduler tracepoints, no exposed kernel PMU.
# Everything goes through vendor:*. AMD and Intel have the full kernel stack.
# The catalog reflects that asymmetry rather than hiding it.
#
# The sysfs backends name the driver they read through -- `/sys/bus/pci/drivers/
# amdgpu` and friends -- rather than `/sys/class/drm`, which exists on every
# machine with a display, the NVIDIA ones included. A requirement that is
# satisfied on hardware the backend cannot read is worse than no requirement at
# all: it makes the resolver pick a backend that will find nothing.

- id: gpu.job
  family: gpu
  summary: "DRM job latency, submit -> fence"
  unit: ns
  backends:
    - id: "bpf:tp"
      requires: ["tracepoint:gpu_scheduler:drm_run_job", "tracepoint:gpu_scheduler:drm_sched_process_job", "bpf"]
      join: {key: "gpu:fence_ctx+seqno", match: eq, ttl: 30s}
      cost: low
      drained: true
  modes: [trace]
  emits: [hist, topk, raw, timeline, summary]
  targets: {system: native, pid: bpf_only}
  keys: [gpu, task]
  filter_fields: [ring, comm]
  determinism: low
  caveats:
    - "Unavailable on the NVIDIA proprietary driver: no DRM scheduler tracepoints."
    - "Measures a command buffer, not a kernel, IRQ included. It cannot tell you
       whether the GPU is saturating its SMs or waiting on VRAM."
    - "Tracepoint fields are volatile across kernel versions: discover the format
       at runtime and prefer (fence_context, seqno) over the pointer."

- id: gpu.engine_busy
  family: gpu
  summary: "Per-engine occupancy"
  unit: ratio
  backends:
    - {id: "pmu:i915", requires: ["/sys/bus/event_source/devices/i915"], cost: free}
    - {id: "pmu:xe", requires: ["/sys/bus/event_source/devices/xe"], cost: free, equivalent: true}
    - {id: "pmu:amdgpu", requires: ["/sys/bus/event_source/devices/amdgpu"], cost: free, equivalent: true}
    - {id: "vendor:nvml", requires: ["nvml"], cost: med,
       degraded: "one whole-device figure instead of a per-engine breakdown, sampled by the driver over a window it chooses"}
  modes: [count, poll]
  emits: [timeline, raw, summary]
  targets: {system: native, launch: native}
  keys: []
  filter_fields: [engine, device]
  determinism: low
  caveats:
    - "NVML's utilization is the fraction of a driver-chosen window during which
       at least one kernel was resident. It is not SM occupancy: a kernel using
       one of 68 SMs and one using all of them both read 100 %."
    - "A launch target sets the window, not the scope. The figure is the whole
       device's, shared with everything else that was using it."
    - "Occupancy is a ratio and ratios do not add up: two readings of 0.03 are
       not 0.06 of anything, so this source declares no rate. The mean and the
       maximum over a window are the aggregates that mean something, which is
       what summary and timeline carry."
    - "Through NVML the driver refreshes the occupancy about once a second: the
       timestamps of its own sample buffer are 1.0 to 1.13 s apart on the
       board this was measured on, so even the one-second default poll reads
       one sample twice now and then. A repeat is told by that timestamp, never
       by the value: a steadily idle or busy board reads the same figure from
       new samples. The run counts the readings whose driver sample had not
       moved, marks each event `driver_sample: repeat` or `new`, and says how
       often the figure moved. A read costs 0.6 to 1.4 ms of the tool's cpu,
       and the sample timestamp beside it 0.7 to 2.4 ms more, spent spinning in
       the driver rather than waiting."

- id: gpu.freq
  family: gpu
  summary: "GPU clock frequency"
  unit: hz
  backends:
    - {id: "fs:sys:amdgpu", requires: ["/sys/bus/pci/drivers/amdgpu"], cost: free}
    - {id: "fs:sys:i915", requires: ["/sys/bus/pci/drivers/i915"], cost: free, equivalent: true}
    - {id: "vendor:nvml", requires: ["nvml"], cost: high, equivalent: true}
  modes: [poll, snapshot]
  emits: [timeline, raw, summary]
  targets: {system: native, launch: native}
  keys: []
  filter_fields: [device]
  determinism: low
  caveats:
    - "A clock read through NVML costs 0.8 to 2.1 ms of the tool's cpu per
       domain on this driver, spent spinning in the driver rather than waiting,
       and a reading takes three domains (shader, graphics, memory): 2.5 to 6
       ms a reading, measured per call. Poll it slower when that matters; the
       bench's per-run figure is in `docs/bench.md`."
    - "Every run of an NVML source states the device's clock state in its
       notes, read before the run and again after it and never changed:
       whether the shader clock is held at one frequency, the application
       clocks, persistence mode and the driver's clock event reasons. NVML has
       no reader for clocks locked with `nvidia-smi -lgc`; the verdict comes
       from the driver's performance levels, and a lock is claimed only where
       every level runs the shader clock at one frequency."
    - "The reported clock is the one the device is running at when it is asked,
       and a GPU idles at a fraction of its boost clock. A frequency series says
       what the device did, never what it was allowed to do."
    - "A launch target sets the window, not the scope. The figure is the whole
       device's, shared with everything else that was using it."

- id: gpu.power
  family: gpu
  summary: "GPU energy drawn over the run"
  unit: joules
  backends:
    - {id: "fs:sys:amdgpu", requires: ["/sys/bus/pci/drivers/amdgpu", "hwmon:amdgpu"], cost: free,
       degraded: "instantaneous draw sampled by the poller, not an energy counter: short spikes between two reads are invisible"}
    - {id: "vendor:nvml", requires: ["nvml"], cost: high, equivalent: true}
  modes: [count, poll, snapshot]
  emits: [timeline, raw, summary, rate]
  targets: {system: native, launch: native}
  keys: []
  filter_fields: [device]
  determinism: low
  caveats:
    - "The draw in watts is `--mode count --emit rate`: the energy counter's
       difference over the time between its two reads, one at each end of the
       window. It is a mean over the window, not a peak; the instantaneous draw
       NVML samples travels beside every reading as `watts`, under a name that
       cannot be added up."
    - "A power reading through NVML is two calls, the energy counter (2.8 to
       4.4 ms of the tool's cpu on this driver) and the instantaneous draw (2.8
       to 7 ms), spent spinning in the driver rather than waiting, measured per
       call: at a 100 ms poll that is 6 to 11 % of a core. The bench's 34 ms is
       per run, not per read."
    - "Reading the energy counter or the draw often makes the counter
       under-count, for every reader of the board. Idle, read only at its two
       ends, the counter gave 23 W; read every 100 ms beside the draw, 9 to 14
       W; every 10 ms, about 3 W, below anything the board can draw, while the
       draw read beside it rose to 36 W. A poll whose counter falls below half
       the draw read beside it says so; another program polling the board does
       the same to this run and cannot be seen. Energy is `--mode count`, which
       reads the counter twice."
    - "The driver refreshes the energy counter and the draw every 100 ms. A
       faster poll reads the same sample again; the run counts the readings
       that found the counter unmoved, marks each event `driver_sample: repeat`
       or `new`, and says how often the counter moved."
    - "Energy is read from the device's own counter, not integrated from sampled
       power. Integrating a 100 ms poll across a workload that swings between 50
       and 300 W is a number with no error bar."
    - "The NVML energy counter needs Volta or later. Before that the driver
       reports instantaneous draw only, and this source refuses rather than
       presenting a sampled integral as energy."
    - "A launch target sets the window, not the scope. The energy is the whole
       device's, shared with everything else that was using it."

- id: gpu.temp
  family: gpu
  summary: "GPU temperature"
  unit: celsius
  backends:
    - {id: "fs:sys:amdgpu", requires: ["/sys/bus/pci/drivers/amdgpu", "hwmon:amdgpu"], cost: free}
    - {id: "vendor:nvml", requires: ["nvml"], cost: low, equivalent: true}
  modes: [poll, snapshot]
  emits: [timeline, raw, summary]
  targets: {system: native, launch: native}
  keys: []
  filter_fields: [device]
  determinism: low
  caveats:
    - "Temperature is a confounder, not a result: a GPU at its thermal limit is
       a different machine from the same GPU cold, and a run that crossed the
       limit is not a slower run, it is another run."
    - "A launch target sets the window, not the scope. The figure is the whole
       device's, shared with everything else that was using it."

- id: gpu.mem
  family: gpu
  summary: "VRAM held, by device or by process"
  unit: bytes
  backends:
    - {id: "fs:sys:amdgpu", requires: ["/sys/bus/pci/drivers/amdgpu"], cost: free}
    - {id: "vendor:nvml", requires: ["nvml"], cost: med, equivalent: true}
  modes: [poll, snapshot]
  emits: [timeline, raw, summary]
  targets: {system: native, pid: native, launch: native}
  keys: [task]
  filter_fields: [device, scope]
  determinism: medium
  caveats:
    - "With a process target the figure is that process's own VRAM, from the
       driver's process list, and the device totals ride along as separate
       attributes. The two are never mixed into one series."
    - "VRAM held is not VRAM used. A CUDA context reserves an arena the way an
       allocator does, and what the kernels touch inside it is invisible here."
    - "A process that holds no VRAM reports zero rather than nothing: an absent
       series and an empty one say different things about a run."

- id: gpu.kernel
  family: gpu
  summary: "GPU time per compute kernel"
  unit: ns
  backends:
    # The band is the worst regime's (docs/bench.md, "The GPU tracers,
    # nineteenth wave", record gpu-1791099533): +67 % of the time and +83 %
    # of the process's cpu on a launch-bound program, against the library
    # loaded and disarmed, and under 1 % on a compute- or memory-bound one.
    # The caveat on cost says so where a reader of `--budget` looks.
    - {id: "vendor:cupti", requires: ["cupti"], cost: extreme}
    # Unmeasured, and no cheaper than what they stand in for.
    - {id: "vendor:rocprof", requires: ["rocprofiler"], cost: extreme, equivalent: true}
    - {id: "vendor:l0", requires: ["level-zero"], cost: extreme, equivalent: true}
  modes: [trace]
  emits: [hist, topk, raw, timeline, summary]
  # A launch only. CUPTI records the activity of the process it is loaded
  # in, and the CUDA driver loads it at `cuInit` from CUDA_INJECTION64_PATH:
  # a running process initialised CUDA long ago and cannot be given a library
  # at exec. The first caveat says so where a refused `--pid` sends a reader.
  targets: {launch: native}
  # The process that launched the work. An activity record names its device,
  # context and stream, never its thread, so `task` is the process's main
  # thread and the device is an attribute: a `gpu` key is a fence, which a
  # kernel record does not carry.
  keys: [task, proc]
  filter_fields: [kernel, op, device, stream, context, bytes, copy, pid]
  determinism: medium
  caveats:
    - "A launched program only: CUPTI works inside the process that owns the
       CUDA context, and is loaded there by the driver at `cuInit` through
       CUDA_INJECTION64_PATH. A `--pid` target is refused for that reason, not
       for want of a backend."
    - "One event per kernel, memcpy and memset the device ran (`op`), named
       by `kernel` -- the demangled kernel name, or `[memcpy HtoD]` and the
       like -- with its time on the device as `duration_ns`. Rank them with
       `topk:10@kernel`; count only kernels with `--filter \"op == 'kernel'\"`."
    - "Vendor timestamps live in another clock domain: CUPTI's clock is
       bracketed between two CLOCK_MONOTONIC reads at the start, at every
       flush and at the end, and every event carries the measured error as a
       non-zero ts_err_ns, widened for a record past the last bracket. It is
       the error of that conversion only: where CUPTI put the device's work on
       its own clock is not in it, and a kernel's duration includes its block
       dispatch and drain (about a microsecond here, against tens of
       nanoseconds of ts_err_ns)."
    - "CUPTI drops activity records under a launch-bound workload and reports
       how many. An overhead measured on an incomplete trace describes a tracer
       that gave up, so the drop count belongs beside the numbers: it is the
       run's `dropped`, and a run that lost records says so."
    - "Records arrive a buffer at a time: CUPTI hands a buffer back when it is
       full (about a thousand kernels) or when the program exits, never sooner,
       because forcing it hands back kernels still running, with no time. A
       program that is killed rather than exiting loses its last buffer, and
       the run says so."
    - "What it costs depends on the program's regime, by two orders of
       magnitude. CUPTI does its work inside every kernel launch, on the
       launching thread: about 1.3 us a launch here, so a launch-bound
       program (a kernel every 2 us) ran 67 % longer than with the library
       loaded and disarmed, and its other threads spent a further 17 % of
       that time on other cpus; a compute- or memory-bound one (a kernel
       every millisecond or more) under 1 %. The band, `extreme`, is the
       launch-bound case; on a program of long kernels the run's own cost
       line is the figure to read. Loading the library disarmed was inside
       what the bench resolves on every regime (0.14 to 0.73 %)."

- id: gpu.api
  family: gpu
  summary: "Host-side submission latency (CUDA / Vulkan)"
  unit: ns
  backends:
    # The worst regime's band: +11.3 % on a launch-bound program, +3.2 % on a
    # compute-bound one, nothing on a memory-bound one (docs/bench.md, "The
    # GPU tracers, nineteenth wave", record gpu-1791099533).
    - {id: "preload", requires: ["dynamic-linking"], cost: high}
  modes: [trace]
  emits: [hist, topk, raw, summary]
  targets: {launch: native}
  # The thread is what the shim knows. The device a call went to is its
  # context's, and asking the driver inside every call would cost more than
  # the call, so no event carries a `gpu` key and the entry does not claim one.
  keys: [task]
  filter_fields: [api, family, result, comm]
  determinism: low
  caveats:
    - "This is the host's view: how long the submitting thread spent inside the
       call. An asynchronous launch returns long before the GPU runs anything,
       so this is not GPU time and cannot be read as such."
    - "Only calls bound through the dynamic linker are seen: a program linked
       with `-lcuda` or `-lvulkan`. A program that fetched its own function
       pointers -- `dlopen` and `dlsym` (Python's ctypes), `cuGetProcAddress`
       (the CUDA runtime, for every driver call it makes), `vkGetDeviceProcAddr`
       (most Vulkan engines) -- reports nothing, and the run says so rather than
       reporting an idle GPU."
    - "The entry points interposed are the CUDA driver's launch, copy,
       synchronize and allocation calls and Vulkan's submit, present and wait
       calls; `api` names them without their ABI suffix. OpenGL is not among
       them."
    - "Its cost is a price per call, paid by the calling thread: a
       launch-bound program (a launch every 2 us) ran 11.3 % longer here, a
       program of millisecond kernels 3 % or less. The band, `high`, is the
       launch-bound case."

- id: gpu.counters
  family: gpu
  summary: "Counters inside a kernel, per launch: instructions, memory, cache"
  unit: count
  backends:
    - {id: "vendor:cupti", requires: ["cupti"], cost: extreme}
    - {id: "vendor:rocprof", requires: ["rocprofv3"], cost: extreme, equivalent: true}
  modes: [trace]
  emits: [raw, topk]
  # A launch only, for gpu.kernel's reason: the range profiler runs inside
  # the process that owns the context, loaded by the driver at `cuInit`.
  targets: {launch: native}
  keys: [task, proc]
  filter_fields: [kernel, counter, verdict, device, pid]
  # Per counter, measured in the run: the verdict on each event is the
  # determinism, and a fixed level here would claim it for every counter.
  determinism: medium
  caveats:
    - "A launched program only: CUPTI's range profiler works inside the
       process that owns the CUDA context, and is loaded there by the driver at
       `cuInit` through CUDA_INJECTION64_PATH. A `--pid` target is refused for
       that reason, not for want of a backend."
    - "One event per kernel and counter, at the end of the run: `value` is the
       median over the kernel's launches, beside its `min`, `max`, `spread`
       (the middle half's range over the median), `outliers` (launches more
       than 10 % from the median) and a `verdict` -- `reproducible here`
       within 10 %, `not dominated by this workload` past it, `measured once`
       for a kernel launched once, `disturbed on every launch` when no launch
       was the kernel's alone. The verdict is measured per run, never
       declared: the DRAM bytes of a 64 MiB copy spread under 5 % here, those
       of a compute-bound kernel over 100 %. The counters are
       smsp__inst_executed.sum, dram__bytes_read.sum, dram__bytes_write.sum,
       lts__t_bytes.sum and l1tex__t_bytes.sum; OMN_CUPTI_METRICS names
       others."
    - "Does NOT measure time: kernel replay runs every launch as many times as
       the counters need passes, serialised, with CUPTI's save and restore
       between them. A run asking for this and for gpu.kernel is refused. The
       clocks are left as they are -- CUPTI locks them only when asked, and
       omn never asks -- and their state is in the facts."
    - "The device counts what its SMs and memory do, whoever's work it is: a
       copy kernel's instruction count went from 3.2 million to 286 million on
       every launch of a run here while another process ran its own kernels,
       the same wrong count each time. So every launch is checked: the blocks
       the SMs launched in its window (sm__ctas_launched.sum, always
       collected) against its grid, and a launch with more is `disturbed`,
       counted and left out of every counter. Work that launched no block in
       the window escapes that check and shows as `outliers` or a spread. The
       compute processes NVML lists on the device, once a second, are in the
       facts."
    - "Ranges pair with launches by order, and only when a batch's counts
       agree and no range launched fewer blocks than its launch's grid; a
       batch that holds a launch the library does not follow (a CUDA graph's
       kernel nodes) is not reported at all and counted as unpaired, rather
       than credited to its neighbours. Each event is stamped at its kernel's
       first launch call, its ts_err_ns reaching to the arrival of the last
       launch's counters (saturating at 4.29 s, the field's width)."

- id: gpu.profile
  family: gpu
  summary: "Where time goes inside a kernel: sampled program counters and stall reasons"
  unit: count
  backends:
    - {id: "vendor:cupti", requires: ["cupti"], cost: med}
  modes: [trace]
  emits: [stack, topk, raw]
  targets: {launch: native}
  keys: [task, proc]
  filter_fields: [kernel, source, file, line, stall, pc, device, pid]
  determinism: low
  caveats:
    - "A launched program only: CUPTI's PC sampling works inside the process
       that owns the CUDA context, and is loaded there by the driver at
       `cuInit` through CUDA_INJECTION64_PATH. A `--pid` target is refused for
       that reason, not for want of a backend."
    - "One event per program counter and stall reason, weighed by `samples`
       and stacked as kernel;file:line;stall, so `-e stack` is a flame of the
       device's cycles and `topk:10@source` ranks the lines. A kernel built
       without line information (`-lineinfo`) is placed by offset, +0x<pc>,
       and the facts name it."
    - "A sample is taken every 2^12 cycles of each SM (OMN_CUPTI_PC_PERIOD sets
       the exponent, 5 to 31), continuously: the program's kernels are not
       serialised. A share of samples is a share of SM cycles, at whatever
       clock the device ran; the clocks' state is in the facts."
    - "CUPTI reports each stall reason twice, once restricted to the samples
       where no instruction issued (`_not_issued`); that subset is left out,
       so every sample counts once."
    - "CUPTI accepts some configurations it does not apply. What it applied is
       read back and a difference said (a period setting outside 5 to 31 is
       said and the default used), and a run whose kernels took no sample at
       all is a lost read, not an empty profile. One kernel without a sample
       among others is not a loss: shorter than the period, it takes none.
       CUPTI's own sample count over the program's kernels is held to the
       samples reported; a shortfall past what it said it dropped is counted
       as lost."
