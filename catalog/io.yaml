# Family `io` (block + filesystem) — see docs/CATALOG.md section 4.
# Three layers must never be conflated: syscall latency (what the application
# suffers), block latency (what the device does), FS latency (journal, locks,
# allocation). The gap between them is the diagnosis.

- id: io.latency
  family: io
  summary: "Block request latency, submit -> completion"
  unit: ns
  backends:
    # The two events this family is built on, attached by name against the
    # kernel's own BTF. The classic path below reads the same two out of
    # tracefs, which is mounted and unreadable on a stock machine.
    - id: "bpf:raw_tp"
      requires: ["bpf", "btf", "raw_tracepoint:block_rq_issue(request *)", "raw_tracepoint:block_rq_complete(request *, blk_status_t, unsigned int)|(request *, int, unsigned int)", "bpf_map:ringbuf"]
      join: {key: "blk:rq@open_ts", match: scoped_eq, ttl: 30s}
      cost: med
    - id: "bpf:tp"
      requires: ["tracepoint:block:block_rq_issue", "tracepoint:block:block_rq_complete", "bpf"]
      join: {key: "blk:rq@open_ts", match: scoped_eq, ttl: 30s}
      cost: med
      equivalent: true
    - {id: "fs:tracefs", requires: ["tracefs"], cost: med, targets: {system: native},
       degraded: "no per-task attribution, no pushed-down filter"}
    # The block layer's own account, read around the window: the mean time
    # the requests it completed were outstanding, per device -- iostat's
    # await -- for a machine where no program can be loaded.
    - {id: "fs:proc", requires: ["/proc/diskstats"], cost: free, modes: [count],
       emits: [summary, raw], targets: {system: native}, filter_fields: [dev], keys: [dev],
       degraded: "per device and per window, not per request: the mean time the requests
                  completed in the window were outstanding, counted from the block layer's
                  accounting rather than from the issue, in milliseconds; no distribution and
                  no submitter"}
  modes: [trace, count]
  emits: [hist, raw, rate, topk, summary]
  targets: {system: native, cgroup: native, pid: bpf_only, tid: bpf_only, launch: bpf_only, container: bpf_only}
  keys: [blk, task, file, req, dev, dir]
  filter_fields: [dev, rwbs, bytes, comm]
  determinism: low
  caveats:
    - "Reads are attributable to the submitter (IDENTITY); writes are not, they
       leave through writeback in a kworker and fall back to file:dev+ino (KEY)."
    - "Request pointers get recycled: the key is (ptr, open_ts), not the pointer."
    - "A request held in a scheduler queue or a plug is issued by kblockd's
       kworker, not by the task that submitted it: the task that inserted it
       is stamped at block_rq_insert and is the one charged at the issue, so a
       dispatched request stays the program's. One issued straight to the
       device was never inserted, and its issuer is its submitter."
    - "A cold run and a warm run differ by an order of magnitude. Declare which
       one the protocol wants and enforce it."
    - "`--emit hist` alone, in `trace`, with no filter and no key but `dev`, is
       built in the kernel: one row per device and log2 bucket, read at the end,
       and no record per request. Its rows carry no `blk`, `task` or `req` key,
       so a join or a per-task answer needs another emit beside it, which
       streams every completion instead."
    - "A bio-based device issues no request, so none of its I/O is here: a swap
       on `zram` is read I/O that `/proc/<pid>/io` charges the process (its
       `read_bytes` counts swap-ins) and that no `block_rq_*` tracepoint sees.
       `mem.swap` or the cgroup's `pswpin` is where those reads are."
    - "On a filesystem over several devices (btrfs RAID or a second device),
       one file's requests land on more than one partition, so a filter on the
       mount's source device (`dev == ...`) undercounts it. Leave `dev` out or
       name every device the filesystem holds."
    - "Keyed on `dir` (`--keys dev,dir`), the tracepoint backends give one
       series per device and operation -- `read`, `write`, `discard`, `flush`
       -- from the request's own operation, so a read/write split needs no
       filter on `rwbs`. A driver-private or zone operation carries no `dir`
       and is in no such series."

- id: io.queue
  family: io
  summary: "Software queueing time, insert -> issue"
  unit: ns
  backends:
    - id: "bpf:raw_tp"
      requires: ["bpf", "btf", "raw_tracepoint:block_rq_insert(request *)", "raw_tracepoint:block_rq_issue(request *)", "bpf_map:ringbuf"]
      join: {key: "blk:rq@open_ts", match: scoped_eq, ttl: 30s}
      cost: med
    - id: "bpf:tp"
      requires: ["tracepoint:block:block_rq_insert", "tracepoint:block:block_rq_issue", "tracepoint:task:task_newtask",
        "tracepoint:sched:sched_process_free", "bpf"]
      cost: med
      degraded: "the record carries no request pointer: an insert is paired with its issue by device and
        first sector, as `biosnoop` pairs them without BTF, and no event has the `blk:rq` key, so it joins
        nothing"
  modes: [trace]
  emits: [hist, raw, topk, summary]
  targets: {system: native, cgroup: bpf_only}
  keys: [blk, task, dev, dir]
  filter_fields: [dev, rwbs, bytes, comm]
  determinism: low

- id: io.bytes
  family: io
  summary: "I/O volume"
  unit: bytes
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:block_rq_issue", "bpf_map:ringbuf"], cost: low}
    - {id: "bpf:tp", requires: ["tracepoint:block:block_rq_issue", "bpf"], cost: low, equivalent: true}
    # `io.stat` attributes to a cgroup and nothing else, `diskstats` to the
    # machine and nothing else. Neither may stand in for the other: answering a
    # --cgroup request from diskstats reports the whole machine's I/O under one
    # cgroup's name, which is the worst thing this tool could do.
    - {id: "fs:cgroup", requires: ["cgroup2:io.stat"], cost: free,
       targets: {cgroup: native, container: native}, filter_fields: [dev],
       keys: [dev, cgroup], degraded: "per cgroup and device only"}
    - {id: "fs:proc", requires: ["/proc/diskstats"], cost: free,
       targets: {system: native}, filter_fields: [dev], keys: [dev, dir],
       degraded: "system-wide, per device"}
  modes: [count, trace, poll]
  emits: [rate, summary, timeline, topk, raw]
  targets: {system: native, cgroup: native, pid: bpf_only, container: native}
  keys: [blk, task, cgroup, dev, dir]
  filter_fields: [dev, rwbs, bytes, comm]
  determinism: low
  caveats:
    - "These are the bytes the device moved, not the bytes the application
       asked for. Readahead, filesystem metadata and journal writes are in the
       number, page cache hits never reach it, and the gap between this and
       io.syscall is the diagnosis rather than an error."
    - "`fs:proc` reports one series per device, and only the devices nothing is
       stacked on. A partition's I/O is counted again on the disk holding it
       and a dm or md device's on its members, so the derived ones are left out
       -- summing every line of /proc/diskstats reports the same bytes two or
       three times."
    - "Keyed on `dir` (`--keys dev,dir`), `fs:proc` gives one series per
       device and direction -- `read`, `write`, and `discard` where the kernel
       writes that column -- in place of one per device carrying both. The same
       key splits `io.iops` (with `flush`) and `io.merges`."
    - "A swap on `zram` is I/O on `zram0`, not on the disk: `fs:proc` counts it
       under its own device, and the tracepoint backends not at all (a
       bio-based device issues no request), while `/proc/<pid>/io` charges it
       to the process as reads. On a filesystem over several devices, one
       file's I/O lands on more than one of them, so a filter on the mount's
       source device undercounts it."
    - "/proc/diskstats counts 512-byte sectors whatever the device's logical
       block size is; the kernel normalizes before writing the file."
    - "Reads and writes are measured apart and carried on the event as
       read_bytes and write_bytes, with sector_bytes and, where the kernel
       reports them, discarded_bytes beside them. The aggregating emits answer
       with the total; raw is the one that shows which half it was."
    - "The chain carries blk, task, cgroup and dev, and no single backend
       carries all four: fs:proc attaches dev alone and fs:cgroup dev and
       cgroup, and each says so in its `keys`. A request keyed on task that
       resolves onto either of them is refused there, naming the backend
       that attaches it, rather than answered with events no join over that
       key could match. Only the tracepoint backends carry task."

- id: io.iops
  family: io
  summary: "I/O operation rate"
  unit: count
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:block_rq_issue", "bpf_map:ringbuf"], cost: low,
       keys: [blk, cgroup, dev]}
    - {id: "bpf:tp", requires: ["tracepoint:block:block_rq_issue", "bpf"], cost: low, equivalent: true,
       keys: [blk, cgroup, dev]}
    - {id: "fs:proc", requires: ["/proc/diskstats"], cost: free,
       targets: {system: native}, filter_fields: [dev], keys: [dev, dir],
       degraded: "system-wide, per device"}
  modes: [count, poll]
  emits: [rate, summary, timeline, raw]
  targets: {system: native, cgroup: native, pid: bpf_only, container: native}
  keys: [blk, cgroup, dev, dir]
  filter_fields: [dev, rwbs]
  determinism: low
  caveats:
    - "These are the operations the device completed, after the block layer
       merged what it could. An application issuing many adjacent requests and
       a device completing few large ones is the normal case, not a discrepancy:
       io.merges is what accounts for the difference."
    - "Discards and flushes are counted in their own columns and left out of
       the operation count, because a discard costs the device nothing like a
       read does."
    - "The operation count is a total, and reads, writes, discards and flushes
       are carried apart on the event. The aggregating emits answer with the
       total; raw is the one that shows the split."

- id: io.size
  family: io
  summary: "Request size distribution"
  unit: bytes
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:block_rq_issue(request *)", "bpf_map:ringbuf"], cost: high}
    - {id: "bpf:tp", requires: ["tracepoint:block:block_rq_issue", "tracepoint:task:task_newtask",
         "tracepoint:sched:sched_process_free", "bpf"], cost: high,
       degraded: "the record carries no request pointer and no request identity: no event has the
         `blk:rq` key or `req`"}
  modes: [trace]
  emits: [hist, topk, raw, summary]
  targets: {system: native, cgroup: bpf_only, pid: bpf_only}
  keys: [blk, task, dev, dir]
  filter_fields: [dev, rwbs, bytes, comm]
  determinism: medium

- id: io.merges
  family: io
  summary: "Request merges performed by the block layer"
  unit: count
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:block_rq_merge", "bpf_map:ringbuf"], cost: low,
       keys: [blk, dev]}
    - {id: "bpf:tp", requires: ["tracepoint:block:block_rq_merge", "bpf"], cost: low, equivalent: true,
       keys: [blk, dev]}
    - {id: "fs:proc", requires: ["/proc/diskstats"], cost: free,
       targets: {system: native}, filter_fields: [dev], keys: [blk, dev, dir],
       degraded: "counters only, no per-request detail"}
  modes: [count]
  emits: [rate, summary, raw]
  targets: {system: native}
  keys: [blk, dev, dir]
  filter_fields: [dev, rwbs]
  determinism: medium
  caveats:
    - "A merge means the block layer combined two adjacent requests into one.
       A high count is a sign of sequential access being coalesced, not of
       anything going wrong."
    - "Read merges and write merges are counted apart on the event and summed
       into the value the aggregating emits answer with; raw is the one that
       shows which of the two the block layer was coalescing."

- id: io.inflight
  family: io
  summary: "Device queue depth"
  unit: count
  backends:
    # Two kernel accounts per device: /proc/diskstats' ninth column and
    # /sys/block/<dev>/inflight. Only the first is required: the second is
    # read beside it when it is there, and a device whose file cannot be read
    # is named in the run's notes and reported from the first alone.
    - {id: "fs:proc", requires: ["/proc/diskstats"], cost: low}
  modes: [poll, snapshot]
  emits: [timeline, raw, summary]
  targets: {system: native}
  keys: [blk, dev]
  filter_fields: [dev]
  determinism: low
  caveats:
    - "Queue depth is read at an instant, not accumulated. A queue that fills
       and drains between two polls leaves no trace, and a poll interval close
       to the device's service time aliases: the series then describes the
       sampling, not the device."
    - "The kernel counts what is outstanding twice, and the two can part: the
       I/O accounting in /proc/diskstats (scheduler queue included) and the
       requests the driver holds in /sys/block/<dev>/inflight. Before 7.2 the
       first counted a request on the partition it came through and never on
       the disk, so a 6.17 disk's line read 0 under a queue of 199
       (docs/scenarios/io.md, defect 20). `inflight`
       is the larger of the two, each a count of requests really outstanding;
       `diskstats_inflight` and `sysfs_inflight` carry each, and
       `sysfs_inflight` is absent, not zero, where the file could not be read."

- id: io.util
  family: io
  summary: "Device utilization: the share of the window a request was outstanding"
  unit: ratio
  backends:
    # The io-ticks column of /proc/diskstats, over the window: what `iostat
    # -x` prints as `%util` and `sar -d` as `%util`.
    - {id: "fs:proc", requires: ["/proc/diskstats"], cost: free,
       degraded: "per device, at the kernel's tick granularity"}
  modes: [poll, count]
  emits: [timeline, raw, summary]
  targets: {system: native}
  keys: [dev]
  filter_fields: [dev]
  determinism: low
  caveats:
    - "Busy is not saturated. A device that serves many requests at once (an
       NVMe drive, an SSD, a RAID set) is at 1.0 long before it is at its
       limit; on such a device read `queue` (iostat's `aqu-sz`) and
       `io.latency` beside it."
    - "The kernel counts the busy time in jiffies: a request outstanding at a
       tick charges the whole tick, so a window of a few ticks is coarse, and a
       short burst can read as a full tick. Poll at 100 ms or more."
    - "`util` is a share of 1, not a percentage: `iostat`'s 42.0 is 0.42 here.
       `busy_ns` carries the time itself and `queue` the average number of
       requests outstanding over the window."

- id: io.vfs
  family: io
  summary: "VFS calls by operation: reads, writes, opens, creates, syncs, of any file"
  unit: count
  backends:
    # One fentry program per VFS entry point, an atomic add each, timed never:
    # what `vfsstat` counts. `vfs_read` and `vfs_write` are required; the
    # others are counted where this kernel declares them, and the run names
    # any it does not. `high`, not measured by the bench yet: a 1-byte
    # read/write loop (6 M calls) ran 1.36 s alone and 1.95 s counted, +45 %
    # under the twenty-fourth wave's load -- a trampoline per call where the
    # call itself does nothing; a call that does work dilates less.
    - {id: "bpf:fentry", requires: ["btf", "bpf", "fentry:vfs_read", "fentry:vfs_write"], cost: high}
  modes: [count, poll]
  emits: [rate, summary, timeline, raw]
  targets: {system: native, pid: bpf_only, tid: bpf_only, launch: bpf_only, cgroup: bpf_only}
  keys: [op]
  filter_fields: [op]
  determinism: medium
  caveats:
    - "One event per interval: `calls` is every function's calls summed, and
       each function's count is beside it under its name (`vfs_read`,
       `vfs_open`, `vfs_fsync_range`, ...). The aggregating emits answer with
       the total, `--filter 'op == \"vfs_open\"'` keeps one function, and
       `raw` is the split. `--keys op` makes each function an event of its
       own instead, so `-m count -k op -e rate` is `vfsstat`'s columns as series."
    - "Any file type: a pipe's, a socket's or a terminal's read is a
       `vfs_read` too, which is what `vfsstat` counts and what `io.fs`
       (regular files only) leaves out. io_uring, sendfile, splice and a
       mapping's page faults call none of these functions."
    - "A process target and the processes it starts are followed from the
       fork, as `io.latency` follows them."
    - "One sync is one count: `fsync(2)` is counted at `do_fsync`, and a
       `vfs_fsync_range` the same thread reaches inside it -- on a kernel
       that did not inline it there -- is not counted again. `msync` and the
       in-kernel callers are counted at `vfs_fsync_range`."

- id: io.syscall
  family: io
  summary: "I/O latency as the application sees it"
  unit: ns
  backends:
    # The syscall table's own entry points, timed at both halves and counted
    # in the kernel: the one layer the compiler cannot inline into the
    # dispatcher. They read their arguments out of the saved registers, so the
    # names are the architecture's: `{arch}` is `x64` or `arm64`, and another
    # architecture reports them missing. Not
    # `ksys_read`: `ksys_pread64` and `ksys_pwrite64` are inlined into their
    # syscalls, and three hundred pwrites put no call through them. Not
    # `vfs_read` either: that is `io.fs`, and the descriptor is exactly what
    # this layer has and that one does not.
    - {id: "bpf:fentry", requires: ["btf", "bpf", "fentry:__{arch}_sys_read", "fentry:__{arch}_sys_write", "fentry:__{arch}_sys_pread64", "fentry:__{arch}_sys_pwrite64"], cost: med, drained: true}
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:sys_enter", "raw_tracepoint:sys_exit", "bpf_map:ringbuf"], cost: med,
       degraded: "raw_syscalls fires on everything: filter by syscall number in-program"}
    - {id: "bpf:tp", requires: ["tracepoint:raw_syscalls:sys_enter", "tracepoint:raw_syscalls:sys_exit", "bpf"], cost: med,
       degraded: "raw_syscalls fires on everything: filter by syscall number in-program"}
  modes: [trace, count]
  emits: [hist, topk, raw, rate, summary]
  targets: {pid: native, tid: native, cgroup: bpf_only, launch: native, container: bpf_only, system: native}
  keys: [task]
  filter_fields: [comm, fd, bytes, op, syscall]
  determinism: low
  caveats:
    - "A --pid or launched target follows the processes it starts, from
       their fork, as `io.fsync` and the sched sources do: `omn io --
       ./script.sh` counts its `dd`s' calls, and a `--pid` target's children
       already running are read from /proc when the run attaches."
    - "An event is a histogram row, not a call: `count` says how many calls it
       stands for and `lat_ns` is the low bound of their log2 bucket. The exact
       total is `total_ns`."
    - "read, write, pread64, pwrite64 and their vectored forms. sendfile,
       splice, io_uring and page faults on a mapping are I/O this does not see."
    - "The descriptor keys the row, and a descriptor names nothing outside its
       process: the file is `io.fs`'s key, not this one's."

- id: io.fs
  family: io
  summary: "VFS and filesystem latency"
  unit: ns
  backends:
    # The one place every filesystem passes, so a machine with btrfs and xfs
    # mounted gets both answers, each labelled with its own name. The
    # `tracepoint:ext4:*` backend this entry used to carry is gone: a glob is
    # not a name, and converting it would have meant choosing which filesystem
    # `io.fs` is about. `docs/families/io.md` has the decision.
    - {id: "bpf:fentry", requires: ["btf", "bpf", "fentry:vfs_read", "fentry:vfs_write"], cost: high, drained: true}
    # A kernel built without the function tracer (Alpine's) has no
    # trampoline to attach; a kprobe pair on the same two functions, the
    # file's fields read with probe reads at offsets out of the kernel's BTF.
    - {id: "bpf:kprobe", requires: ["btf", "kprobe", "bpf", "kprobe:vfs_read", "kprobe:vfs_write"], cost: high,
       degraded: "a kprobe pair rather than a trampoline: each call costs a breakpoint on entry and a return probe, and a call whose return probe the kernel had no instance left for is counted as orphaned, not timed"}
  modes: [trace, count]
  emits: [hist, topk, raw, summary]
  targets: {pid: native, tid: native, cgroup: bpf_only, launch: native, container: bpf_only, system: native}
  keys: [file, task]
  filter_fields: [comm, dev, ino, bytes, fs, op]
  determinism: low
  caveats:
    - "A --pid or launched target follows the processes it starts, from
       their fork, as `io.fsync` and the sched sources do: `omn io --
       ./script.sh` counts its `dd`s' calls, and a `--pid` target's children
       already running are read from /proc when the run attaches."
    - "Regular files only. vfs_read also serves pipes, sockets and terminals,
       and a reader blocked on an empty pipe is not filesystem latency; that
       wait is in io.syscall and not here."
    - "The file key's device is the superblock's. On btrfs that is not the
       st_dev stat(2) reports -- every subvolume has its own anonymous device --
       and inode numbers repeat across subvolumes, so there the key names the
       filesystem and the inode, not always one file."
    - "`blk_devs` names the block devices the filesystem is on, each spelled
       as io.bytes keys its series (`dev:259+0`), comma-separated: the mount
       source followed through /sys, a partition to its disk, a dm or md
       device to its members, a btrfs to every device it spans. It is the
       set the filesystem can write to, not the device a given byte reached,
       and it is absent where the filesystem is on no block device (tmpfs,
       overlay, a network filesystem)."
    - "An event is a histogram row, not a call: `count` says how many."

- id: io.pagecache
  family: io
  summary: "Page cache misses, against the pages reads looked up"
  unit: count
  backends:
    # Both sides of a read: `mm_filemap_get_pages` is what it looked up and
    # `mm_filemap_add_to_page_cache` what the cache had to fill. The fill alone
    # is a miss count with nothing to be a share of. Counted in the kernel per
    # task and file; `docs/families/io.md` has why these two and not the fault
    # tracepoints.
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:mm_filemap_get_pages(address_space *, long unsigned int, long unsigned int)", "raw_tracepoint:mm_filemap_add_to_page_cache(folio *)", "bpf_map:ringbuf"], cost: med, drained: true}
    - {id: "bpf:tp", requires: ["tracepoint:filemap:mm_filemap_get_pages", "tracepoint:filemap:mm_filemap_add_to_page_cache", "bpf"], cost: med, equivalent: true}
  modes: [trace, count]
  emits: [rate, topk, summary, raw]
  targets: {system: native, pid: bpf_only, tid: bpf_only, launch: bpf_only, cgroup: bpf_only}
  keys: [file, task]
  filter_fields: [comm, dev, ino, fs]
  determinism: low
  caveats:
    - "`blk_devs` names the block devices under the file's filesystem, as
       io.fs carries it: each as io.bytes keys its series, absent off a block
       device."
    - "A cold run and a warm run differ by an order of magnitude. Mixing them
       produces a bimodal distribution that then gets mistaken for noise."
    - "A miss is a page the cache had to fill, on demand or read ahead. A page
       read ahead is a miss when it is filled, and the lookup that later finds
       it is not one: over a whole file the two agree, inside a window they
       need not."
    - "A page a write appends is counted as `created`, not as a miss. A
       whole-page overwrite of a page that was not cached is a fill with no
       read behind it, and is a miss here."
    - "Reads through read(2), pread(2), readv(2) and sendfile(2). A page a
       fault on a mapping brings in is a miss with no lookup: faults do not
       pass through filemap_get_pages. tmpfs and shmem have no page cache
       lookups of this kind at all."
    - "Counted where the fill happened, which for readahead is the reader."
    - "Warm, `lookups` is exact. Cold it is a floor: filemap_get_pages returns
       without its tracepoint when the last folio of a batch is still locked
       under readahead, so the first batch of such a read is looked up unseen.
       Measured here, 1 to 96 pages of a 256-page read, and never over."

- id: io.readahead
  family: io
  summary: "Readahead: pages filled ahead of what reads looked up"
  unit: count
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:mm_filemap_get_pages(address_space *, long unsigned int, long unsigned int)", "raw_tracepoint:mm_filemap_add_to_page_cache(folio *)", "bpf_map:ringbuf"], cost: low, drained: true}
    - {id: "bpf:tp", requires: ["tracepoint:filemap:mm_filemap_get_pages", "tracepoint:filemap:mm_filemap_add_to_page_cache", "bpf"], cost: low, equivalent: true}
    - {id: "bpf:fentry", requires: ["btf", "bpf", "fentry:page_cache_ra_unbounded"], cost: low, equivalent: true}
  modes: [trace, count]
  # No `hist`: the value is a signed difference, and a log2 bucket has no
  # place for a negative number.
  emits: [rate, summary, raw]
  targets: {system: native, pid: bpf_only, tid: bpf_only, launch: bpf_only}
  keys: [file, task]
  filter_fields: [comm, dev, ino, fs]
  determinism: low
  caveats:
    - "`ahead` is pages filled minus pages looked up, per task and file.
       Positive is the cache filled in front of the reader, zero is a random
       reader or a whole file read to its end, and negative is a reader served
       from pages that were already cached."
    - "A difference of two counts, so it adds up: the sum over a run's windows
       is the run's. A ratio of the same two counts would not."
    - "It says how far readahead ran ahead, not whether what it read was used
       before it was evicted. A page read ahead and never read is ahead until
       the run ends."
    - "On a cold sequential read the lookups are a floor, so `ahead` can be a
       few pages high: the first batch of a read whose last folio is still
       under readahead is looked up without the tracepoint firing."

- id: io.writeback
  family: io
  summary: "Deferred writeback"
  unit: ns
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:writeback_start(bdi_writeback *, wb_writeback_work *)", "raw_tracepoint:writeback_written(bdi_writeback *, wb_writeback_work *)", "bpf_map:ringbuf"], cost: low}
    - {id: "bpf:tp", requires: ["tracepoint:writeback:writeback_start", "tracepoint:writeback:writeback_written", "bpf"], cost: low,
       degraded: "the record carries no work item: a round is paired by the flusher thread that runs it,
         and the backing device has no `bdi_id`"}
  modes: [trace, count]
  emits: [hist, rate, raw, summary, timeline]
  targets: {system: native, cgroup: bpf_only}
  keys: [file, cgroup, dev]
  filter_fields: [dev]
  determinism: low
  caveats:
    - "`pages` is the flusher's budget spent -- what the filesystem reported to
       writeback control -- not a count of pages written, and it is not all of
       writeback: a sync of one file, an fsync and a direct write never go
       through a flusher round. Measured on btrfs over 5 s: 66 953 pages of
       rounds against the 264 948 the kernel's own `nr_written` counted."
    - "Writeback runs in a kworker: the originating task context is gone.
       Evidence is KEY (file:dev+ino), never IDENTITY."

- id: io.fsync
  family: io
  summary: "Synchronization latency (fsync, fdatasync)"
  unit: ns
  backends:
    # `fsync(2)` does not reach `vfs_fsync_range`, the function this entry
    # used to name: on the development machine the compiler inlined it, and
    # `vfs_fsync`, into `do_fsync`, and twenty-five syncs put zero calls
    # through either. All three are timed, `do_fsync` where the kernel has
    # it, and a nested pair is one event.
    - {id: "bpf:fentry", requires: ["btf", "bpf", "fentry:do_fsync or vfs_fsync", "fentry:vfs_fsync_range"], cost: high}
    # A kernel that inlined both into the syscalls -- Ubuntu 22.04 and 24.04,
    # Rocky 9: no `do_fsync` in BTF, `vfs_fsync`'s copy off the path. The
    # syscalls' wrappers and `vfs_fsync_range`, a sync timed at whichever it
    # reaches first: a dispatcher that inlined a wrapper (`x64_sys_call`,
    # Ubuntu 24.04's and Rocky 9's `fsync`) still calls `vfs_fsync_range`.
    - {id: "bpf:fentry:syscall", requires: ["btf", "bpf", "fentry:__{arch}_sys_fsync", "fentry:__{arch}_sys_fdatasync", "fentry:vfs_fsync_range"], cost: high,
       degraded: "timed at the fsync and fdatasync syscalls' wrappers, or at vfs_fsync_range where the syscall dispatcher inlined a wrapper: a sync the kernel makes for itself (nfsd) is in only when it reaches vfs_fsync_range, and a wrapper's time includes the descriptor lookup"}
    # A kernel built without the function tracer (Alpine's): the same
    # functions through kprobe pairs, the record filled at the entry, the
    # fields read with probe reads at offsets out of the kernel's BTF.
    - {id: "bpf:kprobe", requires: ["btf", "kprobe", "bpf", "kprobe:do_fsync or vfs_fsync", "kprobe:vfs_fsync_range"], cost: high,
       degraded: "kprobe pairs rather than trampolines: each call costs a breakpoint on entry and a return probe, and a call whose return probe the kernel had no instance left for is counted as orphaned, not timed"}
  modes: [trace]
  emits: [hist, topk, raw, summary]
  targets: {pid: native, tid: native, launch: native, cgroup: bpf_only, system: native}
  keys: [file, task]
  filter_fields: [comm, dev, ino, call, fs]
  determinism: low
  caveats:
    - "`blk_devs` names the block devices under the file's filesystem, as
       io.fs carries it: each as io.bytes keys its series, absent off a block
       device."
    - "Attaching the trampolines costs about 65 ms, paid once per run whatever
       the run sees, and on a short run it is most of what the run cost: the
       bench measured 64 ms with no event."
    - "fsync, fdatasync and msync(MS_SYNC). sync(2), syncfs(2) and
       sync_file_range(2) take other paths and are not here."
    - "A sync that returned an error made nothing durable; its event carries
       the errno, and its duration is not a commit's."

- id: io.pressure
  family: io
  summary: "PSI: I/O stall time"
  unit: ratio
  backends:
    - {id: "fs:proc", requires: ["/proc/pressure/io"], cost: low, targets: {system: native}}
    - {id: "fs:cgroup", requires: ["cgroup2:io.pressure"], cost: free, equivalent: true,
       targets: {cgroup: native, container: native}}
  modes: [poll, snapshot]
  emits: [timeline, raw, summary]
  targets: {system: native, cgroup: native, container: native}
  keys: [cgroup]
  filter_fields: []
  determinism: low
  caveats:
    - "`some` is time during which at least one task was stalled on I/O and
       `full` time during which every runnable task was. A non-zero `some` on an
       otherwise idle machine is ordinary; it is `full` that means nothing else
       could proceed."
    - "A poll reports the share of its own window, computed from the stall
       counter. A snapshot has no window, so it reports the kernel's decayed
       ten-second average instead, under its own name: the two are different
       measurements and are never given the same one."
    - "Pressure says time was lost waiting, not which device or which file lost
       it. It is where an investigation starts, not where it ends."

# The family's default: what `omn trace io -- PROGRAM` composes, per cost
# band. No `low`: every source that follows a program's I/O traces it, and
# tracing declares `med` at best. See docs/lazy.md.
- default:
    family: io
    question: "How long does the program wait on its reads and writes?"
    med:
      - {source: io.syscall, mode: trace, emit: [hist, summary], label: "read and write latency"}
    high:
      - {source: io.syscall, mode: trace, emit: [hist, summary], label: "read and write latency"}
      - {source: io.latency, mode: trace, emit: [hist, summary], label: "device latency"}
