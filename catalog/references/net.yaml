# Reference pairs for the `net` family of tools: each entry runs omn and an
# established tool over the same run of a workload and holds them to a
# declared tolerance. Read by tests/reference.rs, never by omn itself.
# Schema: catalog/references/README.md.
#
# Every net source compared here is system-wide or per interface, and omn
# refuses a program to launch beside `--system` or `--iface`. So every pair
# runs `alongside`: omn for its `--duration`, and the tool through a wrapper
# in tests/reference/workloads/net/ over the same number of seconds, both
# started together; the runner starts the workload `settle_ms` later. The
# wrappers turn each tool into a measure of that window: `around.py` reads a
# counter tool at its start and its end, `sample.py` runs a snapshot tool
# every interval, `bracket.py` interrupts a tool that tallies on SIGINT.
#
# omn's summary of a counter keeps a series' mean and count per poll, so a
# counter's whole increase is the mean times the count: `omn_ip_link` and
# `omn_total` (tests/reference/net.rs) read it.

- id: ip-link-rx-bytes
  source: net.bytes
  tool: ip -s link
  use: "ip -s link show dev lo, before and after: bytes received"
  workload: [python3, tests/reference/workloads/net/push.py, "64", "1"]
  omn: [trace, net.bytes, --iface, lo, -m, count, -e, summary, --keys, "iface,dir", --format, json, --duration, 4s]
  run: alongside
  settle_ms: 1000
  reference:
    command: [python3, tests/reference/workloads/net/around.py, "4", ip, -s, link, show, dev, lo]
    parse: ip_s_link_delta
    requires: [ip, python3]
  compare:
    key: rx_bytes
    omn_parse: omn_ip_link
    tolerance: {rel: 0.03}
    why: "both read the kernel's rtnl_link_stats64 for lo (omn through /proc/net/dev) over the same four seconds; the two windows open and close tens of milliseconds apart, so other loopback traffic on a loaded machine in that slack lands on one side only, diluted by 64 MiB"

- id: ip-link-tx-bytes
  source: net.bytes
  tool: ip -s link
  use: "ip -s link show dev lo, before and after: bytes sent"
  workload: [python3, tests/reference/workloads/net/push.py, "64", "1"]
  omn: [trace, net.bytes, --iface, lo, -m, count, -e, summary, --keys, "iface,dir", --format, json, --duration, 4s]
  run: alongside
  settle_ms: 1000
  reference:
    command: [python3, tests/reference/workloads/net/around.py, "4", ip, -s, link, show, dev, lo]
    parse: ip_s_link_delta
    requires: [ip, python3]
  compare:
    key: tx_bytes
    omn_parse: omn_ip_link
    tolerance: {rel: 0.03}
    why: "the same counters as rx_bytes, the other direction; on lo the two are equal by construction"

- id: ip-link-packets
  source: net.packets
  tool: ip -s link
  use: "ip -s link show dev lo, before and after: packets"
  workload: [python3, tests/reference/workloads/net/pingpong.py, "47313", "2"]
  omn: [trace, net.packets, --iface, lo, -m, count, -e, summary, --format, json, --duration, 4s]
  run: alongside
  settle_ms: 1000
  reference:
    command: [python3, tests/reference/workloads/net/around.py, "4", ip, -s, link, show, dev, lo]
    parse: ip_s_link_delta
    requires: [ip, python3]
  compare:
    key: packets
    omn_parse: omn_ip_link
    tolerance: {rel: 0.05}
    why: "net.packets has no `dir` key and counts received plus sent, so it is compared with ip's rx + tx. The workload is small round trips, thousands of packets, against which other loopback traffic in the tens of milliseconds the two windows differ by stays small"

- id: ip-link-errors
  source: net.iface
  tool: ip -s link
  use: "ip -s link show dev lo, before and after: errors, dropped, carrier, collisions"
  workload: [python3, tests/reference/workloads/net/push.py, "64", "1"]
  omn: [trace, net.iface, --iface, lo, -m, count, -e, summary, --format, json, --duration, 4s]
  run: alongside
  settle_ms: 1000
  reference:
    command: [python3, tests/reference/workloads/net/around.py, "4", ip, -s, link, show, dev, lo]
    parse: ip_s_link_delta
    requires: [ip, python3]
  compare:
    - key: errors
      omn_parse: omn_ip_link
      tolerance: {abs: 0}
      why: "net.iface's `<iface>/errors` is /proc/net/dev's rx + tx errs, ip's RX and TX errors; lo never errs, so this shows the series is there and agrees at zero, not that a non-zero count would"
    - key: drops
      omn_parse: omn_ip_link
      tolerance: {abs: 0}
      why: "rx + tx drop, ip's RX and TX dropped; zero on lo"
    - key: carrier
      omn_parse: omn_ip_link
      tolerance: {abs: 0}
      why: "tx carrier, ip's TX carrier; zero on lo"
    - key: collisions
      omn_parse: omn_ip_link
      tolerance: {abs: 0}
      why: "tx colls, ip's TX collsns; zero on lo"

- id: nstat-listen-overflows
  source: net.backlog
  tool: nstat
  use: "nstat -saz TcpExtListenOverflows TcpExtListenDrops, before and after"
  workload: [python3, tests/reference/workloads/net/backlog.py, "64", "1"]
  omn: [trace, net.backlog, --system, -m, count, -e, raw, --format, json, --duration, 4s]
  run: alongside
  settle_ms: 1000
  reference:
    command: [python3, tests/reference/workloads/net/around.py, "4", nstat, -saz, TcpExtListenOverflows, TcpExtListenDrops, TcpRetransSegs]
    parse: nstat_delta
    requires: [nstat, python3]
  compare:
    - key: TcpExtListenOverflows
      omn: "results.0.outputs[emit=raw].events.*.attrs[name=overflows].value"
      tolerance: {abs: 2}
      why: "both read /proc/net/netstat's ListenOverflows over the same four seconds; each raw event is one poll's increment, so their sum is the run's. Another listener overflowing in the milliseconds the windows differ by lands on one side only"
    - key: TcpExtListenDrops
      omn: "results.0.outputs[emit=raw].events.*.attrs[name=drops].value"
      tolerance: {abs: 2}
      why: "the same file's ListenDrops, the same run"

- id: nstat-retrans-segs
  source: net.tcp.retransmit
  tool: nstat
  use: "nstat -saz TcpRetransSegs, before and after"
  workload: [python3, tests/reference/workloads/net/backlog.py, "64", "2.5"]
  omn: [trace, net.tcp.retransmit, --system, -m, count, -e, summary, --format, json, --duration, 5s]
  run: alongside
  settle_ms: 1000
  reference:
    command: [python3, tests/reference/workloads/net/around.py, "5", nstat, -saz, TcpRetransSegs]
    parse: nstat_delta
    requires: [nstat, python3]
  compare:
    key: TcpRetransSegs
    omn_parse: omn_total
    tolerance: {abs: 8}
    why: "the SYNs the full queue dropped are retransmitted after a second; nstat reads the MIB counter, omn counts the tcp_retransmit_skb tracepoint system-wide (one series per socket, summed), which also takes any real network's retransmits on this machine in the milliseconds the windows differ by"

- id: ss-ti-rtt
  source: net.tcp.rtt
  tool: ss -ti
  use: "ss -tin sport = :47311, every 200 ms: the connection's rtt"
  workload: [python3, tests/reference/workloads/net/pingpong.py, "47311", "2.5"]
  omn: [trace, net.tcp.rtt, --system, -m, "poll@200ms", -e, summary, --filter, "sport == 47311", --format, json, --duration, 5s]
  run: alongside
  settle_ms: 1000
  reference:
    command: [python3, tests/reference/workloads/net/sample.py, "0.2", "5", ss, -tinH, sport, "=", ":47311"]
    parse: ss_ti_rtt
    requires: [ss, python3]
  compare:
    key: rtt_ns_mean
    omn_parse: omn_rtt
    tolerance: {rel: 0.15}
    why: "both read tcp_info's srtt of the same connection through sock_diag, at different instants of one run, both every 200 ms (ss through sample.py, omn by its poll); the estimate drifts by a few percent over the run and one reading of an outlier moves either mean (11 % apart once with ss every 500 ms, five readings against thirteen). omn's side is the mean over every poll, weighted by each series' count"

- id: tcpdump-captured
  source: net.capture
  tool: tcpdump
  use: "tcpdump -i lo 'tcp dst port 47312': the packets captured"
  workload: [python3, tests/reference/workloads/net/pingpong.py, "47312", "2"]
  omn: [trace, net.capture, --iface, lo, -m, trace, -e, raw, --filter, "dport == 47312", --format, json, --duration, 5s]
  run: alongside
  settle_ms: 1000
  reference:
    command: [python3, tests/reference/workloads/net/bracket.py, "5", tcpdump, -i, lo, -w, /dev/null, tcp dst port 47312]
    parse: tcpdump_count
    requires: [tcpdump, python3]
    privileged: true
    sudo: tcpdump
  compare:
    key: captured
    omn_parse: omn_captured
    tolerance: {rel: 0.01}
    why: "both are AF_PACKET sockets on lo with a filter on the destination port, open over the same five seconds, the workload inside both. lo hands a packet socket every frame twice, `outgoing` and `host`; omn keeps both and libpcap drops the outgoing copy on a loopback device, so omn_captured counts each frame on lo once (by hand, 2026-10-04: 3562 omn events against 1781 tcpdump packets, 3608 against 1804, exactly twice)"

- id: nstat-active-opens
  source: net.snmp
  tool: nstat
  use: "nstat -saz TcpActiveOpens, before and after (net.snmp keyed on counter)"
  workload: [python3, tests/reference/workloads/net/backlog.py, "64", "1"]
  omn: [trace, net.snmp, --system, -m, count, -k, counter, -e, summary, --filter, "counter == \"TcpActiveOpens\"", --format, json, --duration, 4s]
  run: alongside
  settle_ms: 1000
  reference:
    command: [python3, tests/reference/workloads/net/around.py, "4", nstat, -saz, TcpActiveOpens]
    parse: nstat_delta
    requires: [nstat, python3]
  compare:
    key: TcpActiveOpens
    omn: results.0.outputs[emit=summary].series.*.total
    tolerance: {abs: 3}
    why: "both read /proc/snmp's Tcp ActiveOpens over the same four seconds, omn as one counted window keyed on the counter, nstat before and after; the workload opens 64 connections, and another program's connect in the milliseconds the windows differ by lands on one side only"

- id: ss-s-transports
  source: net.sockstat
  tool: ss -s
  use: "ss -s (the transport table's Total column)"
  workload: []
  omn: [trace, net.sockstat, --system, -m, snapshot, -e, raw, --format, json, -o, "{out}"]
  run: separate
  reference:
    command: [ss, -s]
    parse: ss_s_transport
    requires: [ss]
  compare:
    - key: TCP
      omn_parse: omn_sockstat
      tolerance: {abs: 4}
      why: "ss -s sums /proc/net/sockstat's and sockstat6's TCP inuse, the two numbers net.sockstat reads and adds up; the two snapshots are moments apart, and a connection opened or closed between them is on one side only"
    - key: UDP
      omn_parse: omn_sockstat
      tolerance: {abs: 2}
      why: "the same files' UDP inuse, IPv4 and IPv6 added up"
    - key: RAW
      omn_parse: omn_sockstat
      tolerance: {abs: 1}
      why: "the same files' RAW inuse, IPv4 and IPv6 added up"

- id: ss-tuan-sockets
  source: net.sockets
  tool: ss -tuan
  use: "ss -tuan (every TCP and UDP socket, one line each)"
  workload: []
  omn: [trace, net.sockets, --system, -m, snapshot, -e, raw, --format, json, -o, "{out}"]
  run: separate
  reference:
    command: [ss, -tuan]
    parse: ss_tuan_count
    requires: [ss]
  compare:
    key: sockets
    omn: results.0.events_seen
    tolerance: {abs: 4}
    why: "both ask sock_diag for every TCP and UDP socket, IPv4 and IPv6, in every state, and print one row each; two snapshots moments apart, and a connection opened or closed between them is on one side only"

