    privileged: false
  compare:
    key: utilization.gpu.mean
    omn: "summary[*].mean"
    omn_jq: '.results[0].outputs[0].series[0].mean'
    tolerance: {abs: 0.10}
    why: "the same run: 0.771 against 0.799, 0.851 against 0.867, 0.876
