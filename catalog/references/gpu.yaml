# Reference pairs for the `gpu` family of tools: each entry runs omn and an
# established tool on the same workload and holds them to a declared
# tolerance. Read by tests/reference.rs, never by omn itself. Schema:
# BRIEF.md, "Decided before this wave", plus the fields below, which the gpu
# pairs need and the runner may not know yet (docs/fixes/w22-gpu.md, "Needs
# from another stream"):
#
#   same_run: omn_launches_tool
#       as io.yaml defines it: `omn <omn...> --program-stderr <file> --
#       <reference.command...> <workload...>`, and the parser is handed
#       <file> (as stderr; the gpu parsers read stdout and stderr alike).
#       Used for nvidia-smi, which launches nothing: the wrapper
#       tests/reference/workloads/gpu/smi_during.sh runs the workload and
#       samples nvidia-smi beside it, its samples on standard error.
#   same_run: alternate
#       omn and the tool each launch the workload, one after the other. nsys
#       and ncu inject into the CUDA process through the same driver hook
#       omn's CUPTI library uses (CUDA_INJECTION64_PATH), so the two cannot
#       share a process. The workloads decide their kernels, launches and
#       grids, so a count is the same on every run and is held exactly;
#       durations carry the run-to-run spread measured here.
#   compare.omn: "<emit>[<key glob>].<field>"
#       as io.yaml defines it. `compare.omn_jq` is the same value as a jq
#       expression over omn's JSON document, for a runner that prefers it.
#
# Every value a parser returns is already in omn's unit (ns, Hz, W, bytes,
# a fraction of one) and omn's spelling of names (tests/reference/gpu.rs).

# --- nsys: kernel and memory-operation counts and device durations --------

- source: gpu.kernel
  tool: nsys
  use: "nsys profile + nsys stats -r cuda_gpu_kern_sum: how many times each kernel ran"
  workload: [python3, tests/gpu_workload.py, launches, "5000"]
  omn: [trace, gpu.kernel, -e, "topk:20@kernel", --format, json]
  same_run: alternate
  reference:
    command: [sh, -c, 'd=$(mktemp -d) && nsys profile -t cuda --force-overwrite=true -o "$d/r" -- "$@" >"$d/log" 2>&1 && nsys stats -q --report cuda_gpu_kern_sum --report cuda_gpu_mem_time_sum --format csv "$d/r.nsys-rep"; s=$?; rm -rf "$d"; exit $s', sh]
    parse: nsys_gpu_sum
    requires: [nsys, nvidia-smi]
    privileged: false
  compare:
    key: tiny/count
    omn: "topk[kernel=tiny].events"
    omn_jq: '.results[0].outputs[0].series[] | select(.key == "kernel=tiny") | .events'
    tolerance: {abs: 0}
    why: "alternate runs: the workload launches `tiny` exactly 5000 times;
      CUPTI's activity records and nsys's agree on every launch (5000 and
      5000, omn dropping none under the launch-bound regime)"

- source: gpu.kernel
  tool: nsys
  use: "nsys stats -r cuda_gpu_kern_sum: total device time of a launch-bound kernel"
  workload: [python3, tests/gpu_workload.py, launches, "5000"]
  omn: [trace, gpu.kernel, -e, "topk:20@kernel", --format, json]
  same_run: alternate
  reference:
    command: [sh, -c, 'd=$(mktemp -d) && nsys profile -t cuda --force-overwrite=true -o "$d/r" -- "$@" >"$d/log" 2>&1 && nsys stats -q --report cuda_gpu_kern_sum --report cuda_gpu_mem_time_sum --format csv "$d/r.nsys-rep"; s=$?; rm -rf "$d"; exit $s', sh]
    parse: nsys_gpu_sum
    requires: [nsys, nvidia-smi]
    privileged: false
  compare:
    key: tiny/total_ns
    omn: "topk[kernel=tiny].total"
    omn_jq: '.results[0].outputs[0].series[] | select(.key == "kernel=tiny") | .total'
    tolerance: {rel: 0.05}
    why: "alternate runs, both reading CUPTI's kernel activity timestamps:
      6 221 828 ns against 6 223 302 (0.02 %). 5 % covers a clock the
      driver moved between the two runs (the clocks are not locked, and
      omn never locks them)"

- source: gpu.kernel
  tool: nsys
  use: "nsys stats -r cuda_gpu_kern_sum: total device time of a memory-bound kernel"
  workload: [python3, tests/gpu_workload.py, memory, "5", "16"]
  omn: [trace, gpu.kernel, -e, "topk:20@kernel", --format, json]
  same_run: alternate
  reference:
    command: [sh, -c, 'd=$(mktemp -d) && nsys profile -t cuda --force-overwrite=true -o "$d/r" -- "$@" >"$d/log" 2>&1 && nsys stats -q --report cuda_gpu_kern_sum --report cuda_gpu_mem_time_sum --format csv "$d/r.nsys-rep"; s=$?; rm -rf "$d"; exit $s', sh]
    parse: nsys_gpu_sum
    requires: [nsys, nvidia-smi]
    privileged: false
  compare:
    key: copy/total_ns
    omn: "topk[kernel=copy].total"
    omn_jq: '.results[0].outputs[0].series[] | select(.key == "kernel=copy") | .total'
    tolerance: {rel: 0.10}
    why: "alternate runs: five 16 MiB grid-stride copies, 310 495 ns
      against 309 599 and 310 335 (0.3 %), 309 918 against 309 600, a
      duration set by DRAM bandwidth rather than by the shader clock. One
      run in four was 7.1 % apart (336 224 against 313 920) under the
      wave's load, five launches being too few to average a disturbed one
      out; hence 10 %"

- source: gpu.kernel
  tool: nsys
  use: "nsys stats -r cuda_gpu_mem_time_sum: how many host-to-device copies ran"
  workload: [python3, tests/gpu_workload.py, memory, "5", "16"]
  omn: [trace, gpu.kernel, -e, "topk:20@kernel", --format, json]
  same_run: alternate
  reference:
    command: [sh, -c, 'd=$(mktemp -d) && nsys profile -t cuda --force-overwrite=true -o "$d/r" -- "$@" >"$d/log" 2>&1 && nsys stats -q --report cuda_gpu_kern_sum --report cuda_gpu_mem_time_sum --format csv "$d/r.nsys-rep"; s=$?; rm -rf "$d"; exit $s', sh]
    parse: nsys_gpu_sum
    requires: [nsys, nvidia-smi]
    privileged: false
  compare:
    key: "[memcpy HtoD]/count"
    omn: "topk[kernel=\\[memcpy HtoD\\]].events"
    omn_jq: '.results[0].outputs[0].series[] | select(.key == "kernel=[memcpy HtoD]") | .events'
    tolerance: {abs: 0}
    why: "alternate runs: one copy in, one copy out and one memset, decided
      by the workload; nsys's `[CUDA memcpy Host-to-Device]` is omn's
      `[memcpy HtoD]` (the parser renames)"

- source: gpu.kernel
  tool: nsys
  use: "nsys stats -r cuda_gpu_mem_time_sum: device time of a host-to-device copy"
  workload: [python3, tests/gpu_workload.py, memory, "5", "16"]
  omn: [trace, gpu.kernel, -e, "topk:20@kernel", --format, json]
  same_run: alternate
  reference:
    command: [sh, -c, 'd=$(mktemp -d) && nsys profile -t cuda --force-overwrite=true -o "$d/r" -- "$@" >"$d/log" 2>&1 && nsys stats -q --report cuda_gpu_kern_sum --report cuda_gpu_mem_time_sum --format csv "$d/r.nsys-rep"; s=$?; rm -rf "$d"; exit $s', sh]
    parse: nsys_gpu_sum
    requires: [nsys, nvidia-smi]
    privileged: false
  compare:
    key: "[memcpy HtoD]/total_ns"
    omn: "topk[kernel=\\[memcpy HtoD\\]].total"
    omn_jq: '.results[0].outputs[0].series[] | select(.key == "kernel=[memcpy HtoD]") | .total'
    tolerance: {rel: 0.25}
    why: "alternate runs: a 16 MiB copy from pageable host memory, staged
      by the driver through a pinned buffer, so its time follows the host's
      memory as much as the device's: 1 522 330 and 1 513 794 ns under omn
      against 1 321 595 to 1 560 666 under nsys, a 15 % spread between
      runs of the same tool"

