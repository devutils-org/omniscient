# --- ncu: counters inside a kernel -----------------------------------------

- source: gpu.counters
  tool: ncu
  use: "ncu --metrics smsp__inst_executed.sum: instructions a kernel executed"
  workload: [python3, tests/gpu_workload.py, memory, "5", "16"]
  omn: [trace, gpu.counters, -e, raw, --format, json]
  same_run: alternate
  reference:
    command: [ncu, --csv, --metrics, "smsp__inst_executed.sum,sm__ctas_launched.sum,dram__bytes_read.sum,l1tex__t_bytes.sum", --]
    parse: ncu_metrics_csv
    requires: [ncu, nvidia-smi]
    privileged: false
  compare:
    key: copy/smsp__inst_executed.sum
    omn: "raw[kernel=copy,counter=smsp__inst_executed.sum].value"
    omn_jq: '.results[0].outputs[0].events[] | select(any(.attrs[]; .name == "kernel" and .value == "copy") and any(.attrs[]; .name == "counter" and .value == "smsp__inst_executed.sum")) | .attrs[] | select(.name == "value") | .value'
    tolerance: {abs: 0}
    why: "alternate runs, both kernel replay through the same range
      profiler: 808 192 instructions on every launch under both. Exact
      unless another process runs kernels meanwhile, which omn flags as
      `disturbed` and ncu does not"

