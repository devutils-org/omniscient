# Reference pairs for the `power` family of tools: each entry runs omn and an
# established tool over the same seconds and holds them to a declared
# tolerance. Read by tests/reference.rs, never by omn itself. Schema:
# catalog/references/README.md.
#
# Every `power.*` source is system- or cpu-scoped, and omn refuses to launch a
# program for one (`--system` cannot be used with `-- PROGRAM`; without it,
# "cannot be measured per launch"). So every pair runs `alongside`: omn
# measures a fixed window (`-d 2s`) and the tool wraps `sleep 2`, the way a
# person bounds `perf stat -a`, `turbostat` or `cpupower monitor`; both start
# together, and after `settle_ms` the runner launches the load both watch the
# machine through. The two windows are each 2 s, offset by omn's start-up
# (~60 ms before its window opens) against the tool's fork of `sleep`.
#
# The unprivileged `perf stat -a` and `turbostat --no-msr` pairs open cpu-wide
# perf events, which the kernel refuses an unprivileged user above
# perf_event_paranoid 0 (`omn` carries CAP_PERFMON; the tools do not): they
# skip there, naming the setting.

- id: energy-perf-stat
  source: power.energy
  tool: perf stat
  use: "perf stat -a -e power/energy-pkg/ -- sleep 2"
  workload: [python3, tests/reference/workloads/power/spin.py, "3", "4"]
  run: alongside
  settle_ms: 100
  omn: [trace, power.energy, --system, -m, count, -e, summary, --format, json, -d, 2s]
  reference:
    command: [perf, stat, -x, ",", -a, -e, power/energy-pkg/, --, sleep, "2"]
    parse: power_perf_stat_energy
    requires: [perf]
    requires_setting: [{file: /proc/sys/kernel/perf_event_paranoid, at_most: 0}]
  compare:
    key: ""
    omn: results.0.outputs[emit=summary].series[key=system].mean
    tolerance: {rel: 0.05}
    why: "both read the package RAPL counter through the same perf PMU, each over 2 s of
          the same load; the windows are offset by omn's start-up (~60 ms of 2 s, 3 %),
          over which the draw is the load's on both sides"

- id: energy-turbostat
  source: power.energy
  tool: turbostat
  use: "turbostat --Joules --show Pkg_J -- sleep 2"
  workload: [python3, tests/reference/workloads/power/spin.py, "3", "4"]
  run: alongside
  settle_ms: 100
  omn: [trace, power.energy, --system, -m, count, -e, summary, --format, json, -d, 2s]
  reference:
    command: [turbostat, --quiet, --no-msr, --Summary, --Joules, --show, "Pkg_J", sleep, "2"]
    parse: power_turbostat_summary
    requires: [turbostat]
    requires_setting: [{file: /proc/sys/kernel/perf_event_paranoid, at_most: 0}]
  compare:
    key: Pkg_J
    omn: results.0.outputs[emit=summary].series[key=system].mean
    tolerance: {rel: 0.05}
    why: "turbostat --no-msr reads the same RAPL perf event, unprivileged; each side
          counts 2 s of the same load, offset by omn's start-up (~60 ms, 3 %) and
          turbostat's own fork of sleep"

- id: energy-rapl-files
  source: power.energy
  tool: the RAPL files
  use: "cat /sys/class/powercap/intel-rapl:0/energy_uj before and after sleep 2"
  workload: [python3, tests/reference/workloads/power/spin.py, "3", "4"]
  run: alongside
  settle_ms: 100
  omn: [trace, power.energy, --system, -m, count, -e, summary, --format, json, -d, 2s]
  reference:
    command: [sh, tests/reference/workloads/power/rapl_window.sh, sleep, "2"]
    parse: power_rapl_window
    requires: [sh, /sys/class/powercap/intel-rapl:0/energy_uj]
    privileged: true
  compare:
    key: ""
    omn: results.0.outputs[emit=summary].series[key=system].mean
    tolerance: {rel: 0.05}
    why: "energy_uj is the powercap view of the same package counter omn opens through
          perf, read on each side of the same 2 s of load; root-only, so through sudo -n"

- id: freq-turbostat
  source: power.freq
  tool: turbostat
  use: "turbostat -c 1 --show Bzy_MHz -- sleep 2"
  workload: [python3, tests/reference/workloads/power/spin.py, "3", "24"]
  run: alongside
  settle_ms: 100
  omn: [trace, power.freq, --cpu, "1", -m, poll@2s, -e, summary, --format, json, -d, 2s]
  reference:
    command: [turbostat, --quiet, --no-msr, --Summary, -c, "1", --show, "Avg_MHz,Busy%,Bzy_MHz", sleep, "2"]
    parse: power_turbostat_summary
    requires: [turbostat, /sys/devices/system/cpu/cpu1/cpufreq/cpuinfo_avg_freq]
    requires_setting: [{file: /proc/sys/kernel/perf_event_paranoid, at_most: 0}]
  compare:
    key: Bzy_Hz
    omn: results.0.outputs[emit=summary].series[key=cpu:1].last
    tolerance: {rel: 0.03}
    why: "both are APERF/MPERF over the cpu's busy time: turbostat's Bzy_MHz over the
          window through perf, omn's cpuinfo_avg_freq over the last scheduler tick. Every
          cpu is kept busy across the window, so the frequency is one plateau; omn's
          `last` is its reading at the window's end, because the one at its start comes
          before the load (and on an idle cpu cpuinfo_avg_freq is neither figure:
          docs/replaces/power.md)"

- id: freq-cpupower-mperf
  source: power.freq
  tool: cpupower monitor
  use: "cpupower monitor -m Mperf -- sleep 2"
  workload: [python3, tests/reference/workloads/power/spin.py, "3", "24"]
  run: alongside
  settle_ms: 100
  omn: [trace, power.freq, --cpu, "1", -m, poll@2s, -e, summary, --format, json, -d, 2s]
  reference:
    command: [cpupower, monitor, -m, Mperf, sleep, "2"]
    parse: power_cpupower_monitor
    requires: [cpupower]
    privileged: true
  compare:
    key: cpu1/Freq_Hz
    omn: results.0.outputs[emit=summary].series[key=cpu:1].last
    tolerance: {rel: 0.03}
    why: "Mperf is APERF/MPERF read from /dev/cpu/*/msr, which needs root; the same ratio
          cpuinfo_avg_freq exposes, every cpu held busy as in freq-turbostat"

- id: cstate-cpupower-idle-stats
  source: power.cstate
  tool: cpupower monitor
  use: "cpupower monitor -m Idle_Stats -- sleep 2"
  workload: []
  run: alongside
  omn: [trace, power.cstate, --system, -m, poll@2s, -e, summary, --format, json, -d, 2s]
  reference:
    command: [sh, tests/reference/workloads/power/cpu1_ticks.sh, cpupower, monitor, -m, Idle_Stats, sleep, "2"]
    parse: power_cpupower_monitor
    requires: [sh, cpupower, python3, /sys/devices/system/cpu/cpu1/cpuidle]
  compare:
    key: "cpu:1"
    omn: results.0.outputs[emit=summary].series[key=cpu:1].mean
    tolerance: {abs: 100000000}
    why: "both read the cpuidle sysfs residency files over 2 s side by side; the parser
          turns cpupower's percentages back into nanoseconds over the command's
          duration. Residency is credited only when a cpu wakes (catalog caveat), so
          cpu 1 is woken every millisecond from before either side's first read to
          after both last ones (workloads/power/cpu1_ticks.sh): each read is within
          about 1 ms of the true residency. What is left is the windows' offset, the
          same at both ends (omn's opens ~0.06 s in, cpupower's 0.1 s in): the
          difference is at most the idle time in one end's gap, under 0.1 s while
          omn's start-up stays under 0.2 s. Without the ticks one uncredited NOHZ
          idle period could exceed 0.1 s (+0.123 s, shown under the wave's load)"

- id: temp-sensors
  source: power.temp
  tool: sensors
  use: "sensors (the processor's Tctl / Package id 0)"
  workload: []
  run: alongside
  settle_ms: 0
  omn: [trace, power.temp, --system, -m, snapshot, -e, summary, --format, json]
  reference:
    command: [sensors, -j]
    parse: power_sensors_json
    requires: [sensors]
  compare:
    key: max_cpu
    omn: results.0.outputs[emit=summary].series[key=system].mean
    tolerance: {abs: 3.0}
    why: "both read hwmon; omn reports the hottest processor sensor, the parser takes the
          same maximum. Two reads tens of milliseconds apart, so 3 degrees for what moves
          between them"
