# Reference pairs for the `perfrecord` family of tools: `perf record` /
# `perf report`, `perf top`, `perf mem` and `perf c2c` against `cpu.profile`,
# `mem.latency` and `mem.sharing`. Schema: catalog/references/README.md.
#
# None of omn's values here sits at one JSON path: a function's self share is
# its stacks' leaves summed over the stack table, a mean latency is a
# histogram's sum over its count, a cache line's share is a top-k row over the
# total. So omn's side is read by a parser of tests/reference/perfrecord.rs
# (`omn_parse`), unit-tested on omn's captured output like the tools'.
#
# The profiles run once, both observers attached to the same process
# (`run: attach`): `perf record -p` / `perf top -p` and `omn --pid`. `perf mem`
# and `perf c2c` cannot attach to a pid on this machine (IBS op sampling
# refuses a per-task event opened on an existing pid: "Failed to collect
# 'ibs_op//' ... No such file or directory"), so those pairs launch the
# workload on each side and compare the medians of alternating runs.
# Shares and means are compared, never counts.
#
# Under `attach` both observers get 2 s to start before the workload is let
# go (`settle_ms`): omn's debug build takes more than the default 500 ms to
# load its programs, and `split.py`'s shares are fixed by phase, so an
# observer that misses the first phase reads another split (seen: libcrypto
# 0.515 for omn against 0.577 for perf at 500 ms). omn's `-d` covers the
# settle and the run.
#
# The C workloads are built by `build.sh --build NAME` in `setup`, so the pid
# the observers follow is the program from its first instruction, never cc.

- id: hot-functions
  source: cpu.profile
  tool: perf record
  use: "perf record -F 997 -- prog; perf report --no-children --sort dso,sym (the top functions, self)"
  run: attach
  settle_ms: 2000
  setup: [sh, tests/reference/workloads/perfrecord/build.sh, --build, hot]
  workload: [sh, tests/reference/workloads/perfrecord/build.sh, hot, "2"]
  omn: [trace, cpu.profile, -m, sample@997hz, -e, stack, --pid, "{pid}", -d, 5s, --format, json, -o, "{out}"]
  reference:
    command: [perf, record, -q, -F, "997", -p, "{pid}", -o, "{tmp}/perf.data"]
    report: [perf, report, -i, "{tmp}/perf.data", --stdio, --no-children, -g, none, --sort, "dso,sym"]
    parse: perf_report_self
    requires: [perf, cc]
  compare:
    - key: hot_beta
      omn_parse: omn_profile_self
      tolerance: {abs: 0.05}
      why: "hot_beta does half the work of every round by construction; one run both observers see, but each samples on its own clock -- perf cycles (period-weighted, frequency mode), omn cpu-clock -- so each estimate moves by about 2 points around the true share (six runs of each by hand, after hot.c's rounds stopped phase-locking with a 997 Hz sampler: 0.48-0.52)"
    - key: hot_alpha
      omn_parse: omn_profile_self
      tolerance: {abs: 0.05}
      why: "hot_alpha does a fifth of every round by construction, the smallest share, where a misattributed leaf shows first; cycles against cpu-clock as above"
    - key: hot_gamma
      omn_parse: omn_profile_self
      tolerance: {abs: 0.05}
      why: "hot_gamma does the remaining three tenths; cycles against cpu-clock as above"

- id: stripped-library
  source: cpu.profile
  tool: perf record
  use: "perf record -- python3 prog; perf report --sort dso on stripped libraries"
  run: attach
  settle_ms: 2000
  workload: [python3, tests/reference/workloads/perfrecord/split.py, "2"]
  omn: [trace, cpu.profile, -m, sample@997hz, -k, object, -e, topk, --pid, "{pid}", -d, 5s, --format, json, -o, "{out}"]
  reference:
    command: [perf, record, -q, -F, "997", -p, "{pid}", -o, "{tmp}/perf.data"]
    report: [perf, report, -i, "{tmp}/perf.data", --stdio, --no-children, -g, none, --sort, dso]
    parse: perf_report_dso
    requires: [perf, python3]
  compare:
    key: libcrypto.so.3
    omn_parse: omn_topk_share
    tolerance: {abs: 0.05}
    why: "60 % of the wall time hashes in libcrypto: the share is the object's on both sides, perf's by dso and omn's keyed by each sample's object, so a library whose functions are named (Fedora keeps libcrypto's symbols, found with distroproof) and one stripped (Arch) are compared alike; one run, cycles against cpu-clock"

- id: live-top
  source: cpu.profile
  tool: perf top
  use: "perf top -p PID (the live top functions)"
  run: attach
  settle_ms: 2000
  setup: [sh, tests/reference/workloads/perfrecord/build.sh, --build, hot]
  workload: [sh, tests/reference/workloads/perfrecord/build.sh, hot, "4"]
  omn: [trace, cpu.profile, -m, sample@997hz, -e, stack, --pid, "{pid}", -d, 7s, --format, json, -o, "{out}"]
  reference:
    # perf top --stdio reads its keys from stdin: a pipe that stays open keeps
    # it from stopping at its menu. It starts with omn, 2 s before the program
    # is let go, and is stopped with SIGINT 3 s into the program's 4: its
    # last screen is the profile of that window. Stopped by `timeout`, it
    # exits 124; any other status is perf's own, with its stderr kept, so
    # Ubuntu's perf_event_paranoid 4 is a refusal, not an empty screen.
    command: [sh, -c, 'sleep 8 | timeout -s INT 5 perf top --stdio -p {pid} -F 997 -d 2 -E 10 -s dso,sym --no-children; r=$?; [ $r -ne 124 ] || r=0; exit $r']
    parse: perf_top_self
    requires: [perf, cc, timeout]
  compare:
    key: hot_beta
    omn_parse: omn_profile_self
    tolerance: {abs: 0.05}
    why: "perf top's last screen is a profile of the window it ran, omn's the whole run, both attached to the same process: the shares are the same by construction, the counts are not; cycles against cpu-clock"

- id: load-latency
  source: mem.latency
  tool: perf mem
  use: "perf mem record -- prog; perf mem report (the loads' latency, in cycles)"
  runs: 5
  setup: [sh, tests/reference/workloads/perfrecord/build.sh, --build, chase]
  workload: [sh, tests/reference/workloads/perfrecord/build.sh, chase, "2"]
  omn: [trace, mem.latency, -m, sample@4000hz, -e, hist, --format, json, -o, "{out}"]
  reference:
    # perf mem report prints the total weight and the sample count, not the
    # mean over the timed loads; perf script prints each sample's weight.
    command: [perf, mem, record, -q, -o, "{tmp}/perf.data", --]
    report: [perf, script, -i, "{tmp}/perf.data", -F, weight]
    parse: perf_script_weight_mean
    requires: [perf, cc]
    # AMD's op sampler (IBS) records a whole machine only: per thread,
    # `perf mem record` says "Invalid event (ibs_op//u) in per-thread mode,
    # enable system wide", which is this cpu refusing the pair's shape.
    refused_when: ["in per-thread mode, enable system wide"]
  compare:
    key: ""
    omn_parse: omn_hist_mean
    tolerance: {rel: 0.10}
    why: "both program the IBS op unit at a nominal 4000 Hz over a pointer chase through 64 MiB, but they do not time the same loads. The rate: the unit with `cnt_ctl` and `swfilt` settles at about 66-74 % of 4000 Hz in frequency mode, perf alone with the same format terms 2 640 a second, and omn's results state the delivered rate in their first note (docs/fixes/w24-mem.md, D17). The mix: `peer` is what perf script decodes as 'core, same node Any cache hit', and its share of timed loads moves from 3.5 % to 16 % from run to run under both tools with what else holds the L3; perf mem counts cycles between tags and omn counts ops, so the two means are over different mixes of L3 and RAM hits. On a quiet machine the mixes land within 10 %: medians of five separate runs (perf mem cannot attach here) read 272-317 against 279-337 cycles. Under load the mix moves and omn read 10-12 % below perf mem in 3 of 3 busy runs. If this pair goes red on a quiet run it becomes a known_defect naming that finding, not a wider tolerance"

- id: false-sharing
  source: mem.sharing
  tool: perf c2c
  use: "perf c2c record -- prog; perf c2c report (the cache lines with the most HITMs)"
  runs: 3
  setup: [sh, tests/reference/workloads/perfrecord/build.sh, --build, share]
  workload: [sh, tests/reference/workloads/perfrecord/build.sh, share, "2"]
  omn: [trace, mem.sharing, -m, sample@4000hz, -e, topk, --format, json, -o, "{out}"]
  reference:
    command: [perf, c2c, record, -q, -o, "{tmp}/perf.data", --]
    report: [perf, c2c, report, -i, "{tmp}/perf.data", --stdio]
    parse: perf_c2c_hitm_share
    requires: [perf, cc]
  compare:
    - key: top
      omn_parse: omn_topk_share
      tolerance: {abs: 0.02}
      why: "two threads write two counters in one static line: both rank that line first and give it nearly every HITM; separate runs, medians of three. `top` is whichever line each side ranks first, so this compare checks the share; the next checks that both name the same line"
    - key: "0x4040c0"
      omn_parse: omn_topk_share
      tolerance: {abs: 0.02}
      why: "the false-shared line's start address, fixed because the workload is built without PIE: 0x4040c0 with this toolchain (gcc 16, x86_64). A side that does not name that line has no value for the key and the pair fails with that reason; another toolchain may place the counters elsewhere, which is the expected way for this compare to fail"
