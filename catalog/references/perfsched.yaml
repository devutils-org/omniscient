# Reference pairs for the `perfsched` family of tools: each entry runs omn and an
# established tool on the same workload and holds them to a declared
# tolerance. Read by tests/reference.rs, never by omn itself. Schema:
# catalog/references/README.md.
#
# omn's side is read from `{out}/results.json` by a path: the source's
# result, its emit, then `series.*.<field>`, which sums the field over every
# series (one series a task: a process with several threads splits a count,
# and a single-threaded workload has one series, so a mean is that task's).
#
# The workloads make system calls nothing else in the interpreter makes
# (`getppid`, `clock_nanosleep`), so a count is exact on both sides and a
# sleep's latency is fixed by the kernel from below.

# --- strace -c ----------------------------------------------------------------

- id: strace-c-count
  source: proc.syscall
  tool: strace -c
  use: "strace -c -f -- prog  (how many calls of each syscall)"
  workload: [python3, tests/reference/workloads/perfsched/syscalls.py, "5000", "20", "10"]
  omn: [trace, proc.syscall, -m, count, -e, summary, --filter, "syscall == getppid", --format, json, -o, "{out}"]
  reference:
    command: [strace, -c, -f, --]
    parse: strace_c
    requires: [strace]
    privileged: false
  compare:
    key: getppid.calls
    omn: results[source=proc.syscall].outputs[emit=summary].series.*.count
    tolerance: {abs: 0}
    why: "alternate runs of a deterministic workload: ptrace and the omn
      launcher cannot both own the child. 5000 getppid calls are 5000 on both
      sides, every run; the in-kernel count is exact, so any difference is a
      defect"

- id: strace-c-latency
  source: proc.syscall
  tool: strace -c
  use: "strace -c -w -f -- prog  (wall time spent in each syscall)"
  workload: [python3, tests/reference/workloads/perfsched/syscalls.py, "200", "20", "10"]
  omn: [trace, proc.syscall, -m, count, -e, summary, --filter, "syscall == clock_nanosleep", --format, json, -o, "{out}"]
  runs: 5
  reference:
    command: [strace, -c, -w, -f, --]
    parse: strace_c
    requires: [strace]
    privileged: false
  compare:
    key: clock_nanosleep.usecs_per_call
    reference_scale: 1000       # strace prints microseconds, omn nanoseconds
    omn: results[source=proc.syscall].outputs[emit=summary].series.*.mean
    tolerance: {rel: 0.02}
    why: "alternate runs, five of each side, medians compared: a 10 ms
      sleep is 10.05-10.07 ms on both sides on a quiet machine (three runs
      each, 2026-10-04: omn 10.054-10.067 ms, strace 10.056 ms), but a loaded
      one wakes the sleeper late by up to a millisecond on either side, and
      five runs keep one late run out of the median. This pair wants a quiet
      machine.
      `-w` is required: without it strace reports the system cpu time of the
      call, 18 us for a 10 ms sleep. Short calls are not compared: strace's
      own stop doubles as the call's latency (getppid 16 us under strace,
      0.25 us under omn)"

# --- strace -T ----------------------------------------------------------------

- id: strace-t-latency
  source: proc.syscall
  tool: strace -T
  use: "strace -f -T -e trace=clock_nanosleep -- prog  (each call's duration)"
  workload: [python3, tests/reference/workloads/perfsched/syscalls.py, "0", "20", "10"]
  omn: [trace, proc.syscall, -m, count, -e, summary, --filter, "syscall == clock_nanosleep", --format, json, -o, "{out}"]
  runs: 5
  reference:
    command: [strace, -f, -T, -e, trace=clock_nanosleep, --]
    parse: strace_t
    requires: [strace]
    privileged: false
  compare:
    key: clock_nanosleep.mean_ns
    omn: results[source=proc.syscall].outputs[emit=summary].series.*.mean
    tolerance: {rel: 0.02}
    why: "alternate runs, five of each side, medians compared (a loaded
      machine wakes the sleeper late by up to a millisecond, on one run or
      the other: with three runs at a load average of 16-22 omn's median was
      10.49 ms against strace's 10.05; alone it holds, 10.06-10.07 against
      10.09-10.11 ms, 2026-10-04). strace -T's per-call times averaged
      against omn's exact sum over its count. omn keeps the
      distribution as log2 buckets and the sum, not each call: `-e raw`
      gives one row a bucket, so strace -T's per-call line has no omn
      equivalent"

# --- perf trace -s ------------------------------------------------------------

- id: perf-trace-count
  source: proc.syscall
  tool: perf trace -s
  use: "perf trace -s -- prog  (per-syscall counts)"
  workload: [python3, tests/reference/workloads/perfsched/syscalls.py, "5000", "20", "10"]
  omn: [trace, proc.syscall, -m, count, -e, summary, --filter, "syscall == getppid", --format, json, -o, "{out}"]
  reference:
    command: [perf, trace, -s, --]
    parse: perf_trace_summary
    requires: [perf]
    privileged: true
  compare:
    key: getppid.calls
    omn: results[source=proc.syscall].outputs[emit=summary].series.*.count
    tolerance: {rel: 0.1, side: above}
    why: "both read raw_syscalls in the kernel over a workload making exactly
      5000 getppid calls; omn counts 5000 on every run, as strace -c does
      (pair strace-c-count, exact), while perf trace -s drops calls, with or
      without its LOST line: 4634 to 4999 over a dozen runs, still short with
      --mmap-pages 16384. Its count is a lower bound, so this pair holds omn
      above it, never below; the exact count is strace-c-count's to show"

- id: perf-trace-latency
  source: proc.syscall
  tool: perf trace -s
  use: "perf trace -s -- prog  (per-syscall latency)"
  workload: [python3, tests/reference/workloads/perfsched/syscalls.py, "200", "20", "10"]
  omn: [trace, proc.syscall, -m, count, -e, summary, --filter, "syscall == clock_nanosleep", --format, json, -o, "{out}"]
  reference:
    command: [perf, trace, -s, --]
    parse: perf_trace_summary
    requires: [perf]
    privileged: true
  compare:
    key: clock_nanosleep.mean_ns
    omn: results[source=proc.syscall].outputs[emit=summary].series.*.mean
    tolerance: {rel: 0.02}
    why: "alternate runs; the sleep's latency is the kernel's, and both
      timestamp sys_enter and sys_exit in the kernel"

# --- perf sched latency -------------------------------------------------------

- id: perf-sched-latency-switches
  source: sched.switches
  tool: perf sched latency
  use: "perf sched record -- prog; perf sched latency  (switches per task)"
  workload: [python3, tests/reference/workloads/perfsched/sleeper.py, "100", "2"]
  omn: [trace, sched.switches, -m, count, -e, topk, --format, json, -o, "{out}"]
  reference:
    command: [sh, -c, 'd=$(mktemp -d) && $SUDO perf sched record -q -o "$d/perf.data" -- "$@" >/dev/null 2>&1 && $SUDO perf sched latency -f -i "$d/perf.data"; r=$?; rm -rf "$d"; exit $r', sh]
    parse: perf_sched_latency
    requires: [perf, sh]
    privileged: true
    sudo: perf
  compare:
    key: omnref-sleep.switches
    omn: results[source=sched.switches].outputs[emit=topk].series.*.total
    tolerance: {rel: 0.15}
    why: "alternate runs: perf sched records the whole machine and is read
      by the workload's own command name. 100 sleeps gave omn 105 to 117
      switches over three runs here (2026-10-04); perf counts a task's
      sched-in events under the name it ends with, so the few before the
      rename fall under `python3`"

# No pair for `perf sched latency`'s average delay against `sched.runqlat`:
# omn's `summary.mean` is the kernel's `run_delay`, perf's average is wakeup
# to sched-in (omn's `wake_to_run_ns`, which no emit summarises), and the two
# alternate runs it would take put the mean anywhere from 2 to 178 us on this
# machine (three runs, 2026-10-04). docs/replaces/perfsched.md says what a
# pair would need.

# --- perf sched timehist ------------------------------------------------------

- id: perf-sched-timehist-migrations
  source: sched.migrations
  tool: perf sched timehist
  use: "perf sched timehist -s  (per-task migrations)"
  workload: [python3, tests/reference/workloads/perfsched/migrate.py, "200"]
  omn: [trace, sched.migrations, -m, count, -e, topk, --format, json, -o, "{out}"]
  reference:
    command: [sh, -c, 'd=$(mktemp -d) && $SUDO perf sched record -q -o "$d/perf.data" -- "$@" >/dev/null 2>&1 && $SUDO perf sched timehist -M -f -i "$d/perf.data"; r=$?; rm -rf "$d"; exit $r', sh]
    parse: perf_sched_timehist_rows
    requires: [perf, sh]
    privileged: true
    sudo: perf
  compare:
    key: omnref-migrate.migrations
    omn: results[source=sched.migrations].outputs[emit=topk].series.*.total
    tolerance: {rel: 0.1}
    why: "alternate runs of a workload that sets its own count: 200
      sched_setaffinity calls alternating two cpus, each one a migration the
      kernel makes before the call returns, whatever the load. omn counted
      203, 205 and 209 over three runs here (2026-10-04), 1005 for 1000;
      the few beyond the moves are the scheduler's at start and exit, and
      perf files those before the rename under `python3`. An omn that
      counts nothing, or is not attached, prints no series and fails the
      pair: no series is not read as zero"

- id: perf-sched-timehist-sched-in
  source: sched.switches
  tool: perf sched timehist
  use: "perf sched timehist -s  (per-task sched-in count)"
  workload: [python3, tests/reference/workloads/perfsched/sleeper.py, "100", "2"]
  omn: [trace, sched.switches, -m, count, -e, topk, --format, json, -o, "{out}"]
  reference:
    command: [sh, -c, 'd=$(mktemp -d) && $SUDO perf sched record -q -o "$d/perf.data" -- "$@" >/dev/null 2>&1 && $SUDO perf sched timehist -M -f -i "$d/perf.data"; r=$?; rm -rf "$d"; exit $r', sh]
    parse: perf_sched_timehist_rows
    requires: [perf, sh]
    privileged: true
    sudo: perf
  compare:
    key: omnref-sleep.sched_in
    omn: results[source=sched.switches].outputs[emit=topk].series.*.total
    tolerance: {rel: 0.15}
    why: "as perf sched latency's switches: a task sched in once for every
      time it was switched out, the last excepted"

- id: perf-sched-timehist-delay
  source: sched.slices
  tool: perf sched timehist
  use: "perf sched timehist  (sch delay: from a task's wakeup to its switch in)"
  workload: [python3, tests/reference/workloads/perfsched/sleeper.py, "100", "2"]
  omn: [trace, sched.slices, -m, trace, -k, comm, -e, summary, --value, wake_ns, --format, json, -o, "{out}"]
  reference:
    command: [sh, -c, 'd=$(mktemp -d) && $SUDO perf sched record -q -o "$d/perf.data" -- "$@" >/dev/null 2>&1 && $SUDO perf sched timehist -M -f -i "$d/perf.data"; r=$?; rm -rf "$d"; exit $r', sh]
    parse: perf_sched_timehist_rows
    requires: [perf, sh]
    privileged: true
    sudo: perf
  compare:
    key: omnref-sleep.delay_mean_ns
    omn: results[source=sched.slices].outputs[emit=summary].series[key=comm:omnref-sleep].mean
    tolerance: {abs: 20000}
    why: "both time each wait from the tracepoints: perf sched timehist from sched_wakeup (or a preemption) to the sched_switch that runs the task, sched.slices' wake_ns from the same two events in its programs; separate runs of a sleeper woken 100 times a second, whose waits are a few microseconds on a quiet machine (sched.slices' kernel-clock queue_ns reads 0 for the same wake from idle, which is why this pair is wake_ns's). 20 us is the runs' spread under another program's load"

# --- perf lock contention -----------------------------------------------------

- id: perf-lock-contention
  source: sched.lock
  tool: perf lock contention
  use: "perf lock contention -b -- prog  (kernel lock contentions)"
  workload: [python3, tests/reference/workloads/perfsched/contend.py, "8", "2"]
  omn: [trace, sched.lock, -e, summary, --format, json, -o, "{out}"]
  run: tool_wraps_omn
  reference:
    # `-- prog` does not limit `-b` to the program: it counts the machine
    # (958303 spinlock waits of a software-rendering compositor beside the
    # program's 7953, in one run). `-t` gives one row per thread and the
    # workload names every thread `omnref-lock`.
    command: [perf, lock, contention, -b, -t, --]
    parse: perf_lock_contention
    requires: [perf]
    privileged: true
  compare:
    key: comm:omnref-lock.contended
    omn: results[source=sched.lock].outputs[emit=summary].series.*.count
    tolerance: {rel: 0.02}
    why: "one run: perf wraps omn, which launches the workload, and both count
      contention_begin for the workload's threads alone (perf by their name,
      omn by following the launched process); omn's losses
      (losses.reasons, 61 to 122 a run, about 1 %) are the waits it saw begin
      and could not time, so omn reads a little under: 0.4 to 0.6 % over three
      runs"
