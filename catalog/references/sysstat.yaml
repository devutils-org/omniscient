# Reference pairs for the `sysstat` family of tools: each entry runs omn and an
# established tool on the same workload and holds them to a declared
# tolerance. Read by tests/reference.rs, never by omn itself. Schema:
# catalog/references/README.md.
#
# Two shapes here. A launch pair (`run: separate`) watches one process: omn
# launches the workload, then the tool does. A system pair (`run: alongside`)
# watches the machine: omn (`--system -d 4s`) and the tool (a count of its own)
# start together, and the workload, when there is one, is let go `settle_ms`
# later, so both see the same seconds. A system source is read with `-e raw`
# and an `omn_parse` parser of tests/reference/sysstat.rs: the mean of the
# one-second shares, a few-ms leading event left out (defect 2 of
# docs/fixes/w22-sysstat.md, held by `poll_leading_event_is_held_as_a_known_defect`).

# --- launch pairs: one process, its footprint -------------------------------

- id: numastat-p
  source: mem.numa
  tool: numastat
  use: "numastat -p PID (a process's memory per NUMA node)"
  workload: [python3, tests/reference/workloads/sysstat/touch.py, "128", "3"]
  omn: [mem.numa, -m, poll@250ms, -e, summary, --format, json]
  reference:
    # numastat reads a pid once: the shell starts the workload, lets it touch
    # its memory, reads, and waits for it. Under `separate` the workload is
    # appended to this command.
    command: [sh, -c, '"$@" & p=$!; sleep 1.5; numastat -p "$p"; wait "$p"', sh]
    parse: numastat_p
    requires: [numastat, sh]
  compare:
    key: "node:0"
    omn: "results.0.outputs[emit=summary].series[key=node:0].max"
    tolerance: {rel: 0.03}
    why: "both read /proc/<pid>/numa_maps of a process holding 128 MiB it
          touched; numastat sums MB per node, omn counts pages, and the parser
          converts MB to 4 KiB pages. Two separate runs of a deterministic
          footprint; a THP-promoted region would count in 2 MiB pages on omn's
          side (mem.numa's caveat) and break the conversion."

- id: pidstat-r
  source: mem.rss
  tool: pidstat
  use: "pidstat -r (a process's resident set over time)"
  workload: [python3, tests/reference/workloads/sysstat/touch.py, "128", "3"]
  omn: [mem.rss, -m, poll@250ms, -e, summary, --format, json]
  reference:
    command: [env, LC_ALL=C, pidstat, -r, "1", -e]
    parse: pidstat_r
    requires: [pidstat, env]
  compare:
    key: python3
    omn: "results.0.outputs[emit=summary].series.0.max"
    tolerance: {rel: 0.03}
    why: "the peak resident set of a process holding 128 MiB it touched:
          pidstat reads /proc/<pid>/stat's rss, omn smaps_rollup's Rss; the
          kernel's per-cpu rss counters can lag the page tables by a few
          pages. Two separate runs of a deterministic footprint."

- id: pidstat-w
  source: sched.switches
  tool: pidstat
  use: "pidstat -w (a process's context switches per second)"
  workload: [python3, tests/reference/workloads/sysstat/switch.py, "1000"]
  omn: [sched.switches, -m, count, -e, rate, --format, json]
  reference:
    command: [env, LC_ALL=C, pidstat, -w, "1", -e]
    parse: pidstat_w
    requires: [pidstat, env]
  compare:
    key: python3
    omn: "results.0.outputs[emit=rate].series.0.per_second"
    tolerance: {rel: 0.15}
    why: "a thread that sleeps 1 ms a thousand times switches about a thousand
          times a second; pidstat reads nvcsw and nivcsw, omn a perf software
          counter. Two separate runs of a deterministic count; 0.15 for the
          sleep's overshoot, which differs between the runs."

- id: pidstat-w-wakeups
  source: power.wakeups
  tool: pidstat
  use: "pidstat -w: cswch/s, a process's voluntary switches per second (powertop's wakeups)"
  workload: [python3, tests/reference/workloads/sysstat/switch.py, "1000"]
  omn: [power.wakeups, -m, poll@1s, -e, summary, --value, per_second, --format, json]
  reference:
    command: [env, LC_ALL=C, pidstat, -w, "1", -e]
    parse: pidstat_w
    requires: [pidstat, env]
  compare:
    key: python3.cswch/s
    omn: "results.0.outputs[emit=summary].series.0.mean"
    tolerance: {rel: 0.15}
    why: "a thread that sleeps 1 ms a thousand times wakes about a thousand times a second; pidstat reads the voluntary switches of /proc/<pid>/status, power.wakeups the same counter of every thread, each poll's rate over its own interval (930/s here, against pidstat's 913 switches of both kinds in its capture). Two separate runs of a deterministic count; 0.15 for the sleep's overshoot, which differs between the runs"

# --- system pairs: the machine, observed in the same seconds ----------------

- id: vmstat-busy
  source: cpu.util
  tool: vmstat
  use: "vmstat 1 (us + sy: the share of the machine's cpu time spent busy)"
  run: alongside
  settle_ms: 200
  workload: [python3, tests/reference/workloads/sysstat/spin.py, "5"]
  omn: [cpu.util, --system, -m, poll@1s, -e, raw, -d, 4s, --format, json]
  reference:
    command: [vmstat, -n, "1", "5"]
    parse: vmstat
    requires: [vmstat]
  compare:
    key: busy
    omn_parse: omn_cpu_util
    tolerance: {abs: 0.03}
    why: "the same four seconds of /proc/stat read by both: vmstat folds
          user+nice into us and system+irq+softirq into sy, omn's busy is the
          same sum plus steal. vmstat's first row (since boot) and omn's
          few-ms leading window are left out. The two pollers' seconds start a
          few ms apart, which on a loaded machine is the 0.03."

- id: vmstat-in
  source: sched.interrupts
  tool: vmstat
  use: "vmstat 1 (in: interrupts per second, the machine's)"
  run: alongside
  settle_ms: 200
  workload: [python3, tests/reference/workloads/sysstat/spin.py, "5"]
  omn: [sched.interrupts, --system, -m, poll@1s, -e, summary, --filter, "kind == \"hard\"", -d, 4s, --format, json]
  reference:
    command: [vmstat, -n, "1", "5"]
    parse: vmstat
    requires: [vmstat]
  compare:
    key: in
    omn_parse: omn_interrupts_per_second
    tolerance: {rel: 0.15}
    why: "the same seconds of the machine's hardware interrupts: vmstat reads /proc/stat's intr total, sched.interrupts /proc/interrupts per cpu and line (softirqs left out by the filter, which vmstat never counts: 17 % more with them, the first run), added up over the time it observed. The two files count the same interrupts, the architecture's own lines included (4498 against 4498 over one second here); the pollers' seconds start a few ms apart and the rate moves with the machine, which is the band"

- id: vmstat-r
  source: sched.runqueue
  tool: vmstat
  use: "vmstat 1 (r: runnable tasks)"
  run: alongside
  settle_ms: 200
  workload: [python3, tests/reference/workloads/sysstat/spin.py, "5"]
  omn: [sched.runqueue, --system, -m, poll@1s, -e, summary, -d, 4s, --format, json]
  reference:
    command: [vmstat, -n, "1", "5"]
    parse: vmstat
    requires: [vmstat]
  compare:
    key: r
    omn: "results.0.outputs[emit=summary].series.0.mean"
    tolerance: {abs: 2}
    why: "both read /proc/stat's procs_running once a second over the same seconds of a machine running one spinning program: a level sampled at instants a few ms apart, each sample counting its own reader, so two tasks either way"

- id: vmstat-si
  source: mem.swap
  tool: vmstat
  use: "vmstat 1 (si: swapped in, kB/s)"
  run: alongside
  omn: [mem.swap, --system, -m, poll@1s, -e, raw, -d, 4s, --format, json]
  reference:
    command: [vmstat, -n, "1", "5"]
    parse: vmstat
    requires: [vmstat]
  compare:
    key: si_bytes
    omn_parse: omn_mem_swap
    tolerance: {abs: 262144}
    why: "both read pswpin from /proc/vmstat over the same four one-second
          windows; vmstat in kB/s, omn in bytes per tick, which is per second
          at poll@1s. 256 KiB/s absolute: a machine that is not swapping
          agrees at zero, one that is drifts by the few ms between the two
          pollers' seconds."

- id: vmstat-so
  source: mem.swap
  tool: vmstat
  use: "vmstat 1 (so: swapped out, kB/s)"
  run: alongside
  omn: [mem.swap, --system, -m, poll@1s, -e, raw, -d, 4s, --format, json]
  reference:
    command: [vmstat, -n, "1", "5"]
    parse: vmstat
    requires: [vmstat]
  compare:
    key: so_bytes
    omn_parse: omn_mem_swap
    tolerance: {abs: 262144}
    why: "pswpout, as for si."

- id: psi-cpu-some
  source: cpu.pressure
  tool: /proc/pressure/cpu
  use: "cat /proc/pressure/cpu twice (the share of a window some task waited for a cpu)"
  run: alongside
  settle_ms: 200
  workload: [python3, tests/reference/workloads/sysstat/spin.py, "5"]
  omn: [cpu.pressure, --system, -m, poll@1s, -e, raw, -d, 4s, --format, json]
  reference:
    command: [sh, -c, "date +%s%N; cat /proc/pressure/cpu; sleep 4; date +%s%N; cat /proc/pressure/cpu"]
    parse: psi_window
    requires: [sh, date, cat]
  compare:
    key: some
    omn_parse: omn_psi
    tolerance: {abs: 0.02}
    why: "the `some` total's increase over the same four seconds, divided by
          the window; omn's four one-second shares averaged. Equal windows make
          the mean of the shares the share of the whole; the two windows start
          a few ms apart."

- id: psi-memory-some
  source: mem.pressure
  tool: /proc/pressure/memory
  use: "cat /proc/pressure/memory twice (the share of a window some task stalled on memory)"
  run: alongside
  omn: [mem.pressure, --system, -m, poll@1s, -e, raw, -d, 4s, --format, json]
  reference:
    command: [sh, -c, "date +%s%N; cat /proc/pressure/memory; sleep 4; date +%s%N; cat /proc/pressure/memory"]
    parse: psi_window
    requires: [sh, date, cat]
  compare:
    key: some
    omn_parse: omn_psi
    tolerance: {abs: 0.02}
    why: "as for cpu: the same counter over the same four seconds."

- id: psi-io-some
  source: io.pressure
  tool: /proc/pressure/io
  use: "cat /proc/pressure/io twice (the share of a window some task stalled on I/O)"
  run: alongside
  omn: [io.pressure, --system, -m, poll@1s, -e, raw, -d, 4s, --format, json]
  reference:
    command: [sh, -c, "date +%s%N; cat /proc/pressure/io; sleep 4; date +%s%N; cat /proc/pressure/io"]
    parse: psi_window
    requires: [sh, date, cat]
  compare:
    key: some
    omn_parse: omn_psi
    tolerance: {abs: 0.02}
    why: "as for cpu: the same counter over the same four seconds."

- id: psi-io-full
  source: io.pressure
  tool: /proc/pressure/io
  use: "cat /proc/pressure/io twice (the share of a window every task stalled on I/O)"
  run: alongside
  omn: [io.pressure, --system, -m, poll@1s, -e, raw, -d, 4s, --format, json]
  reference:
    command: [sh, -c, "date +%s%N; cat /proc/pressure/io; sleep 4; date +%s%N; cat /proc/pressure/io"]
    parse: psi_window
    requires: [sh, date, cat]
  compare:
    key: full
    omn_parse: omn_psi
    tolerance: {abs: 0.02}
    why: "the `full` line's total, as for `some`."

- id: mpstat-all
  source: cpu.util
  tool: mpstat
  use: "mpstat 1 (the machine's busy share, all cpus)"
  run: alongside
  settle_ms: 200
  workload: [python3, tests/reference/workloads/sysstat/spin.py, "5"]
  omn: [cpu.util, --system, -m, poll@1s, -e, raw, -d, 4s, --format, json]
  reference:
    command: [env, LC_ALL=C, mpstat, "1", "4"]
    parse: mpstat
    requires: [mpstat, env]
  compare:
    key: all
    omn_parse: omn_cpu_util
    tolerance: {abs: 0.03}
    why: "the same four seconds of /proc/stat; mpstat's busy is 100 minus
          %idle and %iowait, omn's the sum of the busy states: the same
          partition. The two pollers' seconds start a few ms apart."

- id: iostat-c
  source: cpu.util
  tool: iostat
  use: "iostat -c 1 (avg-cpu: the machine's busy share)"
  run: alongside
  settle_ms: 200
  workload: [python3, tests/reference/workloads/sysstat/spin.py, "5"]
  omn: [cpu.util, --system, -m, poll@1s, -e, raw, -d, 4s, --format, json]
  reference:
    command: [env, LC_ALL=C, iostat, -c, "1", "5"]
    parse: iostat_cpu
    requires: [iostat, env]
  compare:
    key: all
    omn_parse: omn_cpu_util
    tolerance: {abs: 0.03}
    why: "as mpstat; iostat's first block is since boot and is left out.
          iostat's device columns are the io family's pairs."

- id: sar-u
  source: cpu.util
  tool: sar
  use: "sar -u 1 (the machine's busy share, live)"
  run: alongside
  settle_ms: 200
  workload: [python3, tests/reference/workloads/sysstat/spin.py, "5"]
  omn: [cpu.util, --system, -m, poll@1s, -e, raw, -d, 4s, --format, json]
  reference:
    command: [env, LC_ALL=C, sar, -u, "1", "4"]
    parse: sar_u
    requires: [sar, env]
  compare:
    key: all
    omn_parse: omn_cpu_util
    tolerance: {abs: 0.03}
    why: "as mpstat: sar -u reads /proc/stat the same way when run live."
