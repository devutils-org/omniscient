# Reference pairs for the `perfstat` family: `perf stat` against
# `omn trace <source> -m count -e summary`. Read by tests/reference.rs, never
# by omn itself; the schema is catalog/references/README.md.
#
# Per process, the two sides launch the workload on separate runs
# (`run: separate`, three or five runs each, alternating, medians compared),
# except where a value follows the clock or the load (cycles, cpu time):
# there omn launches perf stat, which launches the workload
# (`run: omn_launches_tool`), and omn counts perf's own share besides, so
# those tolerances are one-sided. The
# workloads are sized by an iteration count, not by time, and PYTHONHASHSEED
# is fixed, so what they count depends on the argument; the tolerances cover
# the run-to-run spread measured on the development machine under a loaded
# wave (docs/replaces/perfstat.md).
#
# omn's value is the sum of its summary's series' `last`
# (`results.0.outputs[emit=summary].series.*.last`): one series for a
# launched or attached process, one per cpu with --system, one per cgroup
# with --cgroup. Every omn run writes to `-o {out}`, so a workload's or a
# wrapping tool's stdout never lands inside omn's JSON.
#
# System-wide, omn launches `perf stat -a` through `sudo -n` (`run:
# omn_launches_tool`): unprivileged at perf_event_paranoid 2, perf may not
# count every cpu, and wrapping omn through sudo would run omn itself as root.
# perf's window is inside omn's, so omn reads perf's start and exit besides,
# and those tolerances are one-sided, above. By pid and per cgroup, both
# observers start first and the workload runs inside both windows
# (`attach`, `alongside`), so both count the whole of it.

- id: cpu.instructions
  source: cpu.instructions
  tool: perf stat
  use: "perf stat -e instructions -- prog"
  workload: [env, PYTHONHASHSEED=0, python3, -S, tests/reference/workloads/perfstat/spin.py, "3000000"]
  omn: [trace, cpu.instructions, -m, count, -e, summary, --format, json, -o, "{out}"]
  run: separate
  runs: 3
  reference:
    command: [perf, stat, -x, ",", -e, instructions, --]
    parse: perf_stat_csv
    requires: [perf]
  compare:
    key: instructions
    omn: results.0.outputs[emit=summary].series.*.last
    tolerance: {rel: 0.01}
    why: "both read PERF_COUNT_HW_INSTRUCTIONS over the launched process and its children, multiplexing off; separate runs of a count-sized workload, measured spread 0.003 %"

- id: cpu.cycles
  source: cpu.cycles
  tool: perf stat
  use: "perf stat -e cycles -- prog"
  workload: [env, PYTHONHASHSEED=0, python3, -S, tests/reference/workloads/perfstat/spin.py, "3000000"]
  omn: [trace, cpu.cycles, -m, count, -e, summary, --format, json, -o, "{out}"]
  run: omn_launches_tool
  reference:
    command: [perf, stat, -x, ",", -e, cycles, --]
    parse: perf_stat_csv
    requires: [perf]
  compare:
    key: cycles
    omn: results.0.outputs[emit=summary].series.*.last
    tolerance: {rel: 0.08, side: above}
    why: "one run: omn launches perf stat, which launches the workload, so both count the same cycles at the same clock, and omn also counts perf's own, never fewer (3 % more measured). Separate runs differed by 9 % under a loaded wave: cycles follow the clock"

- id: cpu.ipc
  source: cpu.ipc
  tool: perf stat
  use: "perf stat -e cycles,instructions -- prog (the insn per cycle column)"
  workload: [env, PYTHONHASHSEED=0, python3, -S, tests/reference/workloads/perfstat/spin.py, "3000000"]
  omn: [trace, cpu.ipc, -m, count, -e, summary, --format, json, -o, "{out}"]
  run: separate
  runs: 3
  reference:
    command: [perf, stat, -x, ",", -e, "cycles,instructions", --]
    parse: perf_stat_csv
    requires: [perf]
  compare:
    key: ipc
    omn: results.0.outputs[emit=summary].series.*.last
    tolerance: {rel: 0.08}
    why: "both divide instructions by cycles read in one group; the cycles' frequency spread across separate runs is the whole tolerance"

- id: cpu.branch_misses
  source: cpu.branch_misses
  tool: perf stat
  use: "perf stat -e branch-misses -- prog"
  workload: [env, PYTHONHASHSEED=0, python3, -S, tests/reference/workloads/perfstat/branchy.py, "2000000"]
  omn: [trace, cpu.branch_misses, -m, count, -e, summary, --format, json, -o, "{out}"]
  run: separate
  runs: 5
  reference:
    # As root, so that perf counts the kernel's part as omn (CAP_PERFMON)
    # does: unprivileged, at perf_event_paranoid 2, it counts user mode only,
    # and read 0 switches and 0 migrations where omn read 2003 and 503.
    command: [sh, -c, '$SUDO perf stat -x , -e branch-misses -- "$@"', sh]
    parse: perf_stat_csv
    requires: [perf, sh]
    privileged: true
    sudo: perf
  compare:
    key: branch-misses
    omn: results.0.outputs[emit=summary].series.*.last
    tolerance: {rel: 0.04}
    why: "the same PMU counter over a seeded random branch stream; separate runs, measured spread under 2.5 % on most runs, but the predictor's state is shared with whatever else ran on the core, and one median of three moved 5 % under a loaded wave, so five runs' medians. One run with omn launching perf is no cure: perf's own misses add 18 %"

- id: cpu.cache_misses
  source: cpu.cache_misses
  tool: perf stat
  use: "perf stat -e cache-misses -- prog"
  workload: [env, PYTHONHASHSEED=0, python3, -S, tests/reference/workloads/perfstat/touch.py, "256", "4"]
  omn: [trace, cpu.cache_misses, -m, count, -e, summary, --format, json, -o, "{out}"]
  run: separate
  runs: 5
  reference:
    # As root, so that perf counts the kernel's part as omn (CAP_PERFMON)
    # does: unprivileged, at perf_event_paranoid 2, it counts user mode only,
    # and read 0 switches and 0 migrations where omn read 2003 and 503.
    command: [sh, -c, '$SUDO perf stat -x , -e cache-misses -- "$@"', sh]
    parse: perf_stat_csv
    requires: [perf, sh]
    privileged: true
    sudo: perf
  compare:
    key: cache-misses
    omn: results.0.outputs[emit=summary].series.*.last
    tolerance: {rel: 0.10}
    why: "the same architectural counter, but the last-level cache is shared with every other process on the machine: separate runs of either tool alone spread 7 % under a loaded wave, and a load spike during one tool's runs moved its median 70 % once, so five runs' medians, and the verdict is a quiet machine's. One run with omn launching perf is no cure: perf's own misses add 40 % to omn's count"

- id: mem.faults
  source: mem.faults
  tool: perf stat
  use: "perf stat -e page-faults -- prog"
  workload: [env, PYTHONHASHSEED=0, python3, -S, tests/reference/workloads/perfstat/touch.py, "256", "1"]
  omn: [trace, mem.faults, -m, count, -e, summary, --format, json, -o, "{out}"]
  run: separate
  runs: 3
  reference:
    command: [perf, stat, -x, ",", -e, page-faults, --]
    parse: perf_stat_csv
    requires: [perf]
  compare:
    key: page-faults
    omn: results.0.outputs[emit=summary].series.*.last
    tolerance: {rel: 0.03}
    why: "both count PERF_COUNT_SW_PAGE_FAULTS; omn reads a few more than perf on every run (about 0.5 %), where each opens the counter around the exec, plus separate runs' spread"

- id: cpu.context_switches
  source: cpu.context_switches
  tool: perf stat
  use: "perf stat -e context-switches -- prog"
  workload: [env, PYTHONHASHSEED=0, python3, -S, tests/reference/workloads/perfstat/yield.py, "2000"]
  omn: [trace, cpu.context_switches, -m, count, -e, summary, --format, json, -o, "{out}"]
  run: separate
  runs: 3
  reference:
    # As root, so that perf counts the kernel's part as omn (CAP_PERFMON)
    # does: unprivileged, at perf_event_paranoid 2, it counts user mode only,
    # and read 0 switches and 0 migrations where omn read 2003 and 503.
    command: [sh, -c, '$SUDO perf stat -x , -e context-switches -- "$@"', sh]
    parse: perf_stat_csv
    requires: [perf, sh]
    privileged: true
    sudo: perf
  compare:
    key: context-switches
    omn: results.0.outputs[emit=summary].series.*.last
    tolerance: {rel: 0.03}
    why: "one voluntary switch per sleep, so the count follows the argument; involuntary switches from the machine's load add a handful on separate runs, measured within 0.3 %"

- id: cpu.migrations
  source: cpu.migrations
  tool: perf stat
  use: "perf stat -e cpu-migrations -- prog"
  workload: [env, PYTHONHASHSEED=0, python3, -S, tests/reference/workloads/perfstat/hop.py, "500"]
  omn: [trace, cpu.migrations, -m, count, -e, summary, --format, json, -o, "{out}"]
  run: separate
  runs: 3
  reference:
    # As root, so that perf counts the kernel's part as omn (CAP_PERFMON)
    # does: unprivileged, at perf_event_paranoid 2, it counts user mode only,
    # and read 0 switches and 0 migrations where omn read 2003 and 503.
    command: [sh, -c, '$SUDO perf stat -x , -e cpu-migrations -- "$@"', sh]
    parse: perf_stat_csv
    requires: [perf, sh]
    privileged: true
    sudo: perf
  compare:
    key: cpu-migrations
    omn: results.0.outputs[emit=summary].series.*.last
    tolerance: {rel: 0.05}
    why: "one forced migration per affinity change; the scheduler's own balancing adds a few on separate runs, measured within 1.4 %"

- id: task-clock
  source: cpu.instructions
  tool: perf stat
  use: "perf stat -e task-clock -- prog (the msec task-clock line)"
  workload: [env, PYTHONHASHSEED=0, python3, -S, tests/reference/workloads/perfstat/spin.py, "3000000"]
  omn: [trace, cpu.instructions, -m, count, -e, summary, --format, json, -o, "{out}"]
  run: omn_launches_tool
  reference:
    command: [perf, stat, -x, ",", -e, task-clock, --]
    parse: perf_stat_csv
    requires: [perf]
  compare:
    key: task-clock
    omn: results.0.lifetime.cpu_ns
    omn_scale: 0.000001
    tolerance: {rel: 0.05, abs: 30, side: above}
    why: "no source counts task-clock; every launched run carries the program's cpu time from the reap (wait4), in ns, which perf prints in msec. One run: omn launches perf stat, which launches the workload, so omn's cpu time is the workload's plus perf's own, never less (2.3 % more measured, three runs). perf's own is a cost of its start, not a share of the workload: 6.7 to 11.1 ms here, 16.2 ms on distroproof's Fedora 44 guest, whose perf loads more at start -- hence 30 ms beside the 5 %. Separate runs differed by 9 % under a loaded wave"

- id: cpu.cycles.system
  source: cpu.cycles
  tool: perf stat
  use: "perf stat -a -e cycles -- prog (system-wide)"
  # Eight spinning interpreters: the machine's cycles over the window are
  # theirs, so perf's and sudo's start and exit inside omn's window are a
  # fixed share of a known load rather than of whatever the machine idled at.
  workload: [sh, -c, "for i in 1 2 3 4 5 6 7 8; do env PYTHONHASHSEED=0 python3 -S tests/reference/workloads/perfstat/spin.py 3000000 & done; wait"]
  run: omn_launches_tool
  omn: [trace, cpu.cycles, --system, -m, count, -e, summary, --format, json, -o, "{out}"]
  reference:
    command: [sh, -c, '$SUDO perf stat -a -x , -e cycles -- "$@"', sh]
    parse: perf_stat_csv
    requires: [perf, sh]
    privileged: true
    sudo: perf
  compare:
    key: cycles
    omn: results.0.outputs[emit=summary].series.*.last
    tolerance: {rel: 0.08, side: above}
    why: "one run: omn counts every cpu for as long as the program it launched lives, which is sudo, then perf counting every cpu over the workload, so perf's window is inside omn's and omn can only read more, by sudo's and perf's start and exit; over eight spinners that is a fixed share of tens of billions of cycles, which the 8 % band holds whatever the machine idles at (+3.3, +3.2, +3.7 % over three runs). Wrapped by perf instead, omn ran as root through sudo, and unwrapped perf -a is refused at paranoid 2"

- id: cpu.context_switches.system
  source: cpu.context_switches
  tool: perf stat
  use: "perf stat -a -e context-switches -- sleep N (system-wide)"
  # 40000 sleeps of 50 us: about as many switches of the workload's own,
  # so sudo's and perf's start and exit, a thousand switches on a quiet
  # machine, are a few percent of the count rather than a fifth of an idle
  # machine's 5600 (2026-10-19).
  workload: [python3, tests/reference/workloads/perfsched/sleeper.py, "40000", "0.05"]
  run: omn_launches_tool
  omn: [trace, cpu.context_switches, --system, -m, count, -e, summary, --format, json, -o, "{out}"]
  reference:
    command: [sh, -c, '$SUDO perf stat -a -x , -e context-switches -- "$@"', sh]
    parse: perf_stat_csv
    requires: [perf, sh]
    privileged: true
    sudo: perf
  compare:
    key: context-switches
    omn: results.0.outputs[emit=summary].series.*.last
    tolerance: {rel: 0.15, abs: 500, side: above}
    why: "one run, as for cycles: perf's window is inside omn's, so omn can only read more; switches are bursty, and sudo's and perf's start and exit switch a lot, so the time outside perf's window weighs more than for a steady counter (+886 to +1013 of 111 000 to 191 000 with the sleeper, +0.5 to +0.8 %, three runs here). Those switches are a count of their own, not a share: on distroproof's quiet two-cpu Fedora 44 guest the machine made 1715 in the window and omn read 328 more, hence 500 beside the 15 %"

- id: cpu.instructions.cgroup
  source: cpu.instructions
  tool: perf stat
  use: "perf stat -a -G cgroup -e instructions -- sleep N (per cgroup)"
  # setup makes a child cgroup of the test's own (user-owned under systemd's
  # delegation, no privilege) and links it from the run's scratch directory;
  # the workload moves itself into it by the same fixed name, then spins.
  # perf -G takes a path relative to /sys/fs/cgroup, hence `../../..` up to the root, and omn
  # takes the same spelling. teardown removes the cgroup once the run is
  # over, the workload long gone from it.
  setup: [sh, -c, "c=/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)/omn-reference-perfstat; rmdir \"$c\" 2>/dev/null; mkdir \"$c\" && ln -sfn \"$c\" {tmp}/cg"]
  teardown: [sh, -c, "c=/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)/omn-reference-perfstat; ! test -d \"$c\" || rmdir \"$c\""]
  workload: [sh, -c, "echo $$ > /sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)/omn-reference-perfstat/cgroup.procs && exec env PYTHONHASHSEED=0 python3 -S tests/reference/workloads/perfstat/spin.py 3000000"]
  run: alongside
  settle_ms: 700
  omn: [trace, cpu.instructions, --cgroup, "../../..{tmp}/cg", -d, 3s, -m, count, -e, summary, --format, json, -o, "{out}"]
  reference:
    # As root: a count over every cpu is refused to an unprivileged perf at
    # perf_event_paranoid 2, where omn holds CAP_PERFMON.
    command: [sh, -c, '$SUDO perf stat -a -x , -e instructions -G "../../..{tmp}/cg" -- sleep 3', sh]
    parse: perf_stat_csv
    requires: [perf, sh]
    privileged: true
    sudo: perf
  compare:
    key: instructions
    omn: results.0.outputs[emit=summary].series.*.last
    tolerance: {rel: 0.01}
    why: "one run: both count the cgroup on every cpu for 3 s, and the workload (under half a second) starts after both have opened their counters and ends before either window closes, so both count all of it"

- id: cpu.instructions.pid
  source: cpu.instructions
  tool: perf stat
  use: "perf stat -p PID -e instructions (attach to a running process)"
  workload: [env, PYTHONHASHSEED=0, python3, -S, tests/reference/workloads/perfstat/spin.py, "3000000"]
  run: attach
  settle_ms: 700
  omn: [trace, cpu.instructions, --pid, "{pid}", -d, 2s, -m, count, -e, summary, --format, json, -o, "{out}"]
  reference:
    command: [perf, stat, -p, "{pid}", -x, ",", -e, instructions]
    parse: perf_stat_csv
    requires: [perf]
  compare:
    key: instructions
    omn: results.0.outputs[emit=summary].series.*.last
    tolerance: {rel: 0.01}
    why: "one run: the workload is held stopped until both have attached to its pid, and both follow it to its exit, so both count its whole life"
