# Reference pairs for the `io` family of tools: each entry runs omn and an
# established tool on the same workload and holds them to a declared
# tolerance. Read by tests/reference.rs, never by omn itself. The schema is
# catalog/references/README.md.
#
# Three shapes:
#   - fio's own counts and latency: `run: omn_launches_tool`, omn launching
#     fio, so both read the one execution. The job file is in the command,
#     not the workload: the runner runs a pair's workload alone before
#     granting a skip, and a job file alone is not a program.
#   - fio's bytes and operations: `run: alongside`. io.bytes and io.iops
#     have one collector here, fs:proc, which answers for the machine only;
#     omn watches the machine for 4 s and fio starts with `--startdelay=1`,
#     so its whole run falls inside omn's window once omn has attached.
#   - iostat's columns: `run: alongside`, omn watching the machine for 4 s
#     and iostat printing one report over 4 s (`-y 4 1`), with fio's 2 s job
#     as the workload started a second in (`settle_ms: 1000`). Both windows
#     hold the whole job, so both rates are the same reads over about the
#     same four seconds, however the job's own rate moved within its run.
#
# Every pair's `setup` lays the job's file out first (`--create_only=1`),
# so no window holds the layout's writes or btrfs' checksum reads of a new
# file, and every run reads a warm file. The file lives under target/,
# because /tmp is tmpfs here and a direct read of a tmpfs file never becomes
# a block request.

- id: fio-reads
  source: io.latency
  tool: fio
  use: "fio --rw=randread --direct=1: how many reads the job completed"
  workload: []
  omn: [trace, io.latency, -m, trace, -e, summary, --format, json, -o, "{out}"]
  run: omn_launches_tool
  setup: [fio, --create_only=1, --output=/dev/null, tests/reference/workloads/io/randread.fio]
  reference:
    command: [fio, --output-format=json, tests/reference/workloads/io/randread.fio]
    parse: fio_json
    requires: [fio]
  compare:
    key: read.total_ios
    omn: results.0.outputs[emit=summary].series.*.count
    tolerance: {rel: 0.01}
    why: "the same run: fio counts the reads it completed, omn the block
      requests the launched process (fio, exec'd, with `thread`) issued,
      summed over the devices. 4 KiB random direct reads leave nothing to
      merge, so the two are one-to-one -- equal on a warm file (23707/23707,
      26893/26893, 27297/27297). The band is the btrfs metadata a read may
      still pull in fio's context (1.9 % on a file being laid out, which the
      setup now does before the run)"

- id: fio-clat
  source: io.latency
  tool: fio
  use: "fio --rw=randread --direct=1: clat, the mean completion latency"
  workload: []
  omn: [trace, io.latency, -m, trace, -e, summary, --format, json, -o, "{out}"]
  run: omn_launches_tool
  runs: 3
  setup: [fio, --create_only=1, --output=/dev/null, tests/reference/workloads/io/randread.fio]
  reference:
    command: [fio, --output-format=json, tests/reference/workloads/io/randread.fio]
    parse: fio_json
    requires: [fio]
  compare:
    key: read.clat_mean_ns
    omn_parse: omn_summary_as_fio
    tolerance: {rel: 0.5, side: below}
    why: "the same run, two spans of each read, one inside the other: fio's
      clat for a synchronous engine times the pread from submission to
      return, omn's io.latency the request from issue to completion at the
      device, so omn can only be below. The difference is the share above
      the block layer -- the syscall, btrfs verifying the checksum after the
      device completes, and fio being woken and scheduled back -- 18 % of
      fio's on a quiet machine (55.9 us against 68.0 us) and up to 29 %
      with a run queue (56.1 us against 74.0, 59.6 against 83.8 at a load
      of 35) and 36 % with eleven streams testing at once (56.9 us against
      88.5), because the wake-up waits for a cpu and the device does not:
      the share grows with the run queue and has no bound of its own, so the
      band is half of fio's. Medians of three; omn's mean is weighted by
      each device's requests"

- id: fio-bytes
  source: io.bytes
  tool: fio
  use: "fio --rw=randread: io_bytes, what the job read"
  workload: []
  omn: [trace, io.bytes, --system, -m, count, -e, rate, -k, dir, -d, 4s, --format, json, -o, "{out}"]
  run: alongside
  setup: [fio, --create_only=1, --output=/dev/null, tests/reference/workloads/io/randread.fio]
  reference:
    command: [fio, --output-format=json, --startdelay=1, tests/reference/workloads/io/randread.fio]
    parse: fio_json
    requires: [fio]
  compare:
    key: read.io_bytes
    omn: results.0.outputs[emit=rate].series[key=dir:read].total
    tolerance: {rel: 0.05, side: above}
    why: "alongside, not the same process: fs:proc is the only io.bytes
      collector here and it answers for the machine, so omn's 4 s window
      holds fio's run whole (one second's delay, two of reading) and
      whatever else read a block device meanwhile, which only adds. Equal
      on a quiet disk (109711360/109711360); the band is the other readers
      of a busy machine, and omn short of fio would be lost reads"

- id: fio-ios
  source: io.iops
  tool: fio
  use: "fio --rw=randread: total_ios and iops"
  workload: []
  omn: [trace, io.iops, --system, -m, count, -e, rate, -k, dir, -d, 4s, --format, json, -o, "{out}"]
  run: alongside
  setup: [fio, --create_only=1, --output=/dev/null, tests/reference/workloads/io/randread.fio]
  reference:
    command: [fio, --output-format=json, --startdelay=1, tests/reference/workloads/io/randread.fio]
    parse: fio_json
    requires: [fio]
  compare:
    key: read.total_ios
    omn: results.0.outputs[emit=rate].series[key=dir:read].total
    tolerance: {rel: 0.05, side: above}
    why: "alongside, for the reason fio-bytes is: fs:proc counts every
      completed read on the machine's devices over the window. Equal on a
      quiet disk (28036/28036); the band is the other readers, which only
      add. fio's iops is total_ios over its runtime, so the count is the
      number to hold, not two rates over windows that differ"

- id: iostat-r-per-s
  source: io.iops
  tool: iostat
  use: "iostat -dx 4: r/s, the reads a device completed per second"
  workload: [fio, --output=/dev/null, tests/reference/workloads/io/randread.fio]
  omn: [trace, io.iops, --system, -m, count, -e, rate, -k, dir, -d, 4s, --format, json, -o, "{out}"]
  run: alongside
  settle_ms: 1000
  setup: [fio, --create_only=1, --output=/dev/null, tests/reference/workloads/io/randread.fio]
  reference:
    command: [iostat, -d, -x, -y, -o, JSON, "4", "1"]
    parse: iostat_json
    requires: [iostat, fio]
  compare:
    key: all.r/s
    omn: results.0.outputs[emit=rate].series[key=dir:read].per_second
    tolerance: {rel: 0.02}
    why: "alongside: both read /proc/diskstats' completed-reads column over
      four seconds holding the whole job, iostat per whole disk (summed into
      `all`), fs:proc per device nothing is stacked on. The windows start
      omn's start-up apart and last four seconds each, so they hold the same
      reads (another reader's too, which both see) and divide them by about
      the same time. Seen within 0.01 % (5879.17/5879.25, 6348.90/6349.00,
      5197.54/5197.75); the band is the windows' ends, where a reader other
      than the job may fall inside one window and not the other"

- id: iostat-rkb-per-s
  source: io.bytes
  tool: iostat
  use: "iostat -dx 4: rkB/s, what a device read per second"
  workload: [fio, --output=/dev/null, tests/reference/workloads/io/randread.fio]
  omn: [trace, io.bytes, --system, -m, count, -e, rate, -k, dir, -d, 4s, --format, json, -o, "{out}"]
  run: alongside
  settle_ms: 1000
  setup: [fio, --create_only=1, --output=/dev/null, tests/reference/workloads/io/randread.fio]
  reference:
    command: [iostat, -d, -x, -y, -o, JSON, "4", "1"]
    parse: iostat_json
    requires: [iostat, fio]
  compare:
    key: all.rB/s
    omn: results.0.outputs[emit=rate].series[key=dir:read].per_second
    tolerance: {rel: 0.02}
    why: "alongside, the same column (sectors read) of the same file over
      the windows iostat-r-per-s has, for the same reason; the parser turns
      iostat's kB/s into bytes"

- id: iostat-r-await
  source: io.latency
  tool: iostat
  use: "iostat -dx 4: r_await, the mean time a read spent queued and served"
  workload: [fio, --output=/dev/null, tests/reference/workloads/io/randread.fio]
  omn: [trace, io.latency, --system, -m, trace, -e, summary, --filter, "rwbs =~ 'R'", -d, 4s, --format, json, -o, "{out}"]
  run: alongside
  settle_ms: 1000
  setup: [fio, --create_only=1, --output=/dev/null, tests/reference/workloads/io/randread.fio]
  reference:
    command: [iostat, -d, -x, -y, -o, JSON, "4", "1"]
    parse: iostat_json
    requires: [iostat, fio]
  compare:
    key: all.r_await_ns
    omn_parse: omn_summary_as_iostat
    tolerance: {abs: 10000}
    why: "alongside, two measures of one span over reads alone (omn filtered
      on rwbs): r_await is /proc/diskstats' read ticks over the reads
      completed, from the request's start in the block layer to
      completion; io.latency times issue to completion, which leaves the
      software queue out, near empty at depth one. iostat prints r_await to
      two decimals of a millisecond, so its 0.06 is anything from 55 to
      65 us: the band is that rounding (5 us) and the queue time omn leaves
      out (up to 5 us more). Seen through the runner: 56.9 and 56.0 us
      against 0.06 ms"

- id: fio-clat-p50
  source: io.latency
  tool: fio
  use: "fio --rw=randread --direct=1: clat's 50th percentile"
  workload: []
  omn: [trace, io.latency, -m, trace, -e, hist, --format, json, -o, "{out}"]
  run: omn_launches_tool
  setup: [fio, --create_only=1, --output=/dev/null, tests/reference/workloads/io/randread.fio]
  reference:
    command: [fio, --output-format=json, tests/reference/workloads/io/randread.fio]
    parse: fio_json
    requires: [fio]
  compare:
    key: read.clat_p50_ns
    omn_parse: omn_hist_as_fio
    tolerance: {log2_buckets: 1}
    why: "the same run, the median of the two spans fio-clat compares by
      their means: omn's log2 histogram of issue to completion at the
      device, every device merged, its median read as the low edge of its
      bucket; fio's clat p50, from submission to return. omn's span is
      inside fio's, so its bucket is fio's or the one below: [32768, 65536)
      against fio's 78336 ns under the wave's load (2026-10-05), the same
      bucket on a quiet machine, where fio's mean is 68 us. Two buckets
      apart would be fio's share above the block layer doubling the
      device's, which fio-clat bounds at half"

- id: iostat-w-per-s
  source: io.iops
  tool: iostat
  use: "iostat -dx 4: w/s, the writes a device completed per second"
  workload: [fio, --output=/dev/null, tests/reference/workloads/io/randwrite.fio]
  omn: [trace, io.iops, --system, -m, count, -e, rate, -k, dir, -d, 4s, --format, json, -o, "{out}"]
  run: alongside
  settle_ms: 1000
  setup: [fio, --create_only=1, --output=/dev/null, tests/reference/workloads/io/randwrite.fio]
  reference:
    command: [iostat, -d, -x, -y, -o, JSON, "4", "1"]
    parse: iostat_json
    requires: [iostat, fio]
  compare:
    key: all.w/s
    omn: results.0.outputs[emit=rate].series[key=dir:write].per_second
    tolerance: {rel: 0.02}
    why: "iostat-r-per-s's shape over writes: both read /proc/diskstats'
      completed-writes column over four seconds holding the whole 2 s
      random direct write job, iostat per whole disk, fs:proc per device
      nothing is stacked on. The filesystem's own writes (btrfs metadata,
      its log commits) land in both windows alike, end_fsync keeping them
      inside the job; the band is the windows' ends, as for reads. Seen
      through the runner at a load of 12 to 23 (2026-10-05): six of six
      within 1.8 %, five within 0.3 %. Without end_fsync, 3.4 % below and
      7.7 % above on two runs"

- id: iostat-util
  source: io.util
  tool: iostat
  use: "iostat -dx 4: %util, the share of the window a device was busy"
  workload: [fio, --output=/dev/null, tests/reference/workloads/io/randread.fio]
  omn: [trace, io.util, --system, -m, count, -e, summary, -d, 4s, --format, json, -o, "{out}"]
  run: alongside
  settle_ms: 1000
  setup: [fio, --create_only=1, --output=/dev/null, tests/reference/workloads/io/randread.fio]
  reference:
    command: [iostat, -d, -x, -y, -o, JSON, "4", "1"]
    parse: iostat_json
    requires: [iostat, fio]
  compare:
    key: busiest.util
    omn_parse: omn_util_busiest
    tolerance: {abs: 5}
    why: "alongside: both divide /proc/diskstats' io_ticks (the milliseconds a device had a request in flight) by the window, iostat over its four seconds, omn over its counted four; the busiest device on each side, since the two name a device differently. The windows start omn's start-up apart, and a share of a few seconds moves by the milliseconds at their ends: five points"

- id: vfsstat-reads
  source: io.vfs
  tool: vfsstat
  use: "vfsstat 1 4 (vfs_read calls a second, the whole machine)"
  workload: [python3, tests/reference/workloads/bpftrace/act.py, vfsread, "300000"]
  run: alongside
  # Both counting before the workload is let go: a debug build of omn takes
  # most of a second to attach, and 300 ms let it miss a third of the reads.
  # On Ubuntu 24.04 (6.8) the release attaches its twelve fentry programs one
  # by one in about 1.7 s of wall time, and bcc's vfsstat compiles for 2 s:
  # let go at 1 s, the reads fell before omn's window (1657 counted); at 2 s
  # or later omn counted them all (2026-10-21).
  settle_ms: 3000
  omn: [trace, io.vfs, --system, -m, count, -k, op, -e, summary, -d, 4s, --format, json]
  reference:
    command: [sh, -c, '$SUDO vfsstat 1 4']
    parse: vfsstat_totals
    requires: [vfsstat, sh]
    privileged: true
    sudo: vfsstat
  compare:
    key: read
    omn: results[source=io.vfs].outputs[emit=summary].series[key=op:vfs_read].total
    tolerance: {rel: 0.03}
    why: "one run, both the whole machine over 4 s through a counting program
      on vfs_read: 300000 one-byte reads by the workload, let go once both
      count, and the machine's own few hundred a second over two windows
      offset by the tools' starts: 305466 against 307114, 304266 against
      306386, 304252 against 306083 (within 0.7 %)"
