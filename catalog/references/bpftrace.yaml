# Reference pairs for the `bpftrace` family of tools: each entry runs omn and an
# established tool on the same workload and holds them to a declared
# tolerance. Read by tests/reference.rs through the shared runner, never by
# omn itself. Schema: catalog/references/README.md.
#
# Every tool here is a script in /usr/share/bpftrace/tools/ (Arch, Fedora) or
# /usr/sbin (Debian, Ubuntu: each command looks there when the first is
# absent, found with distroproof), system-wide, and
# needs root: `privileged: true` on each, so every pair skips where `sudo -n`
# does not grant root.
#
# Two shapes:
#
# - `separate` (the default), for a tool that can launch its program:
#   `under.sh TOOL --` runs the tool with the workload as bpftrace's `-c`
#   child, so the tool sees one whole run and prints its END maps when the
#   workload exits; omn launches the workload a second time. Two runs, not one
#   (bpftrace launches its child itself, and neither observer can attach to a
#   child the other has created), which is why every compared quantity is one
#   the workload fixes -- a number of calls, signals, connections, block
#   requests -- or, for a latency, a median held to log2 buckets (below).
# - `alongside`, for a source omn serves system-wide only (proc.exec,
#   net.tcp.lifetime): omn `--system -d 6s` and the tool under `timeout -s
#   INT` (bpftrace prints its END maps on SIGINT and exits 0, which
#   coreutils' `--preserve-status` passes on, and BusyBox's timeout -- Alpine's,
#   which refuses that option -- by default) start together; after `settle_ms` (bpftrace
#   compiles and attaches in about a second) the runner launches the workload;
#   both observers end on their own clock.
#
# The workloads name themselves `omnref` (a symlink to python3, so the comm
# is set at exec), and the tool's per-comm key and omn's `comm` filter select
# the same events.
#
# omn's side is a path into its JSON where omn holds the value at one place
# (`.series.*.count` sums every series: one per task, device or socket), and
# the parser `omn_hist_usecs` for a histogram's median, which omn does not
# report. Each pair's omn output on this machine is captured under
# tests/reference/captures/bpftrace/omn/<id>.json, and
# `bpftrace::tests::every_omn_side_resolves_on_its_capture` evaluates every
# compare on it.
#
# Medians. The two grids differ: bpftrace's buckets are powers of two in
# microseconds, which bpftrace_hist_usecs multiplies by 1000, so the
# reference p50 is r = 1000 * 2^k ns and floor(log2 r) = k + 9; omn's are
# powers of two in ns (src/bpf/insn.rs, push_log2_bucket). The same latency L
# in [1000 * 2^k, 2000 * 2^k) ns lands omn's p50 in bucket k + 9 (L below
# 1024 * 2^k) or k + 10. `log2_buckets: 1` is that offset and nothing more:
# it refuses a median two buckets away on either side.

- id: syscount
  source: proc.syscall
  tool: syscount.bt
  use: "syscount.bt: system calls per process"
  workload: [tests/reference/workloads/bpftrace/omnref, tests/reference/workloads/bpftrace/act.py, getppid, "20000"]
  omn: [trace, proc.syscall, -m, count, -e, summary, --filter, 'comm == "omnref"', --format, json]
  reference:
    command: [sh, tests/reference/workloads/bpftrace/under.sh, /usr/share/bpftrace/tools/syscount.bt, --]
    parse: bpftrace_map
    requires: [bpftrace]
    privileged: true
    sudo: bpftrace
  compare:
    key: "@process[omnref]"
    omn: results.0.outputs[emit=summary].series.*.count
    tolerance: {rel: 0.05}
    why: "both count every raw_syscalls:sys_enter of the comm; two runs, so python3's startup (run as root under bpftrace) may differ by a few dozen calls against 20000 getppid"

- id: opensnoop
  source: proc.syscall
  tool: opensnoop.bt
  use: "opensnoop.bt: which process opens files, how often"
  workload: [tests/reference/workloads/bpftrace/omnref, tests/reference/workloads/bpftrace/act.py, open, "500"]
  # musl on x86_64 opens through open(2), glibc through openat(2) (Alpine
  # 3.24: 176 open, no openat, for python3's opens); opensnoop.bt traces both.
  omn: [trace, proc.syscall, -m, count, -e, summary, --filter, '(syscall == "openat" || syscall == "open") && comm == "omnref"', --format, json]
  reference:
    command: [sh, tests/reference/workloads/bpftrace/under.sh, /usr/share/bpftrace/tools/opensnoop.bt, --]
    parse: opensnoop
    requires: [bpftrace]
    privileged: true
    sudo: bpftrace
  compare:
    key: "comm:omnref"
    omn: results.0.outputs[emit=summary].series.*.count
    tolerance: {rel: 0.05}
    why: "one opensnoop line per openat returned, failures included, against omn's openat calls; python3 opens through openat, but for one open(2) on Fedora 44 (strace there: 594 openat and 1 open), inside the band; two runs, 500 opens plus about 120 at startup"

- id: killsnoop
  source: proc.signals
  tool: killsnoop.bt
  use: "killsnoop.bt: who sends which signal"
  workload: [tests/reference/workloads/bpftrace/omnref, tests/reference/workloads/bpftrace/act.py, signal, "50"]
  omn: [trace, proc.signals, -m, count, -e, summary, --filter, 'sig == 12', --format, json]
  reference:
    command: [sh, tests/reference/workloads/bpftrace/under.sh, /usr/share/bpftrace/tools/killsnoop.bt, --]
    parse: killsnoop
    requires: [bpftrace]
    privileged: true
    sudo: bpftrace
  compare:
    key: "omnref/SIGUSR2"
    omn: results.0.outputs[emit=summary].series.*.last
    tolerance: {abs: 0}
    why: "the workload sends itself exactly 50 SIGUSR2 with kill(2): killsnoop sees 50 sends, omn's count-mode counter 50 deliveries (ignored, still generated)"

- id: execsnoop
  source: proc.exec
  tool: execsnoop.bt
  use: "execsnoop.bt: every program executed"
  workload: [sh, tests/reference/workloads/bpftrace/execs.sh, "20"]
  omn: [trace, proc.exec, --system, -d, 6s, -m, trace, -e, summary, --filter, 'filename == "/bin/true"', --format, json]
  run: alongside
  settle_ms: 2000
  reference:
    command: [sh, -c, 't=$1; [ -e "$t" ] || t=/usr/sbin/$(basename "$t"); p=--preserve-status; timeout $p 1 true 2>/dev/null || p=; exec timeout $p -s INT 6 $SUDO bpftrace "$t"', sh, /usr/share/bpftrace/tools/execsnoop.bt]
    parse: execsnoop
    requires: [bpftrace, timeout]
    privileged: true
    sudo: bpftrace
  compare:
    key: "argv0:/bin/true"
    omn: results.0.outputs[emit=summary].series.*.count
    tolerance: {abs: 0}
    why: "one run, both observers system-wide over the same seconds: the workload executes /bin/true exactly 20 times, by that path: omn filters on the filename the exec was given, execsnoop keys by argv0, the same string here, so the `true` other programs run through PATH (/usr/bin/true, 171 against 93 when omn filtered on comm under the twenty-fourth wave's load) is on neither side; something else running /bin/true by that path would show on both"

- id: bitesize
  source: io.size
  tool: bitesize.bt
  use: "bitesize.bt: block I/O size histogram per process"
  workload: [tests/reference/workloads/bpftrace/omnref, tests/reference/workloads/bpftrace/act.py, read, "500"]
  omn: [trace, io.size, -m, trace, -e, "hist:log2", --filter, 'comm == "omnref"', --format, json]
  reference:
    command: [sh, tests/reference/workloads/bpftrace/under.sh, /usr/share/bpftrace/tools/bitesize.bt, --]
    parse: bpftrace_hist
    requires: [bpftrace]
    privileged: true
    sudo: bpftrace
  compare:
    key: "@[omnref]/4096"
    omn: results.0.outputs[emit=hist].series.*.buckets[low=4096].count
    tolerance: {rel: 0.05}
    why: "the [4K, 8K) bucket on both sides, in bytes: 500 O_DIRECT 4 KiB reads issue 500 requests from the workload's own task, plus the few its setup write and fsync issue; both read block_rq_issue. The other buckets (python3's own reads, which the page cache serves or not depending on the run before) are left out: two runs do not fix them"

- id: biosnoop
  source: io.latency
  tool: biosnoop.bt
  use: "biosnoop.bt: one line per block request with its latency"
  workload: [tests/reference/workloads/bpftrace/omnref, tests/reference/workloads/bpftrace/act.py, read, "500"]
  omn: [trace, io.latency, -m, trace, -e, summary, --filter, 'comm == "omnref"', --format, json]
  reference:
    command: [sh, tests/reference/workloads/bpftrace/under.sh, /usr/share/bpftrace/tools/biosnoop.bt, --]
    parse: biosnoop
    requires: [bpftrace]
    privileged: true
    sudo: bpftrace
  compare:
    key: "comm:omnref"
    omn: results.0.outputs[emit=summary].series.*.count
    tolerance: {rel: 0.05}
    why: "one biosnoop line per request the workload issued and saw complete, against omn's completed requests by the same comm; two runs, 500 O_DIRECT reads plus the setup's few"

- id: biolatency
  source: io.latency
  tool: biolatency.bt
  use: "biolatency.bt: block I/O latency histogram"
  workload: [tests/reference/workloads/bpftrace/omnref, tests/reference/workloads/bpftrace/act.py, read, "500"]
  omn: [trace, io.latency, -m, trace, -e, "hist:log2", --filter, 'comm == "omnref"', --format, json]
  # A guest's disk is a file on the host's: one run's median moved two
  # buckets either way with the host busy (Arch 16 ms against 128, Debian 13
  # 32 against 16, distroproof, 2026-10-19), so three runs' medians.
  runs: 3
  reference:
    command: [sh, tests/reference/workloads/bpftrace/under.sh, /usr/share/bpftrace/tools/biolatency.bt, --]
    parse: bpftrace_hist_usecs
    requires: [bpftrace]
    privileged: true
    sudo: bpftrace
  compare:
    key: "@usecs/p50"
    omn_parse: omn_hist_usecs
    tolerance: {log2_buckets: 1}
    why: "a median on two log2 grids a factor 1000/1024 apart (the header): one bucket is the grids' offset; biolatency is system-wide and starts at block_bio_queue where omn starts at submit, and the 500 reads dominate both distributions"

- id: runqlat
  source: sched.runqlat
  tool: runqlat.bt
  use: "runqlat.bt: run queue latency histogram"
  workload: [tests/reference/workloads/bpftrace/omnref, tests/reference/workloads/bpftrace/act.py, spin, "2"]
  # --system beside the program (twenty-fourth wave, stream run): the
  # machine's waits for as long as the program runs, as runqlat.bt -c sees.
  omn: [trace, sched.runqlat, --system, -m, trace, -e, "hist:log2", --format, json]
  runs: 3
  reference:
    command: [sh, tests/reference/workloads/bpftrace/under.sh, /usr/share/bpftrace/tools/runqlat.bt, --]
    parse: bpftrace_hist_usecs
    # The script includes the kernel's headers, and where the installed ones
    # do not match the kernel bpftrace cannot build it (Debian 12: "unknown
    # type name", found with distroproof): the witness refused, not the pair.
    refused_when: ["error: unknown type name"]
    requires: [bpftrace]
    privileged: true
    sudo: bpftrace
  compare:
    key: "@usecs/p50"
    omn_parse: omn_hist_usecs
    tolerance: {log2_buckets: 1}
    why: "both the machine's run queue waits for as long as the workload runs (two busy children per cpu for two seconds), separate runs: runqlat.bt launched by bpftrace -c, omn by --system beside the program; a median on two log2 grids a factor 1000/1024 apart (the header), one bucket being the grids' offset. Separate runs of a machine-wide histogram move with the machine's load, so the medians of three runs are compared: one run each read 16384 against 1024000 ns once under the twenty-fourth wave's load, and held twice. The twenty-third wave's gap was omn reading the program's waits alone (2097152 ns against the machine's 128000 on a quiet machine)"

- id: runqlen
  source: sched.runqlen
  tool: runqlen.bt
  use: "runqlen.bt: run queue length, sampled at 99 Hz"
  workload: [tests/reference/workloads/bpftrace/omnref, tests/reference/workloads/bpftrace/act.py, spin, "2"]
  omn: [trace, sched.runqlen, --system, -m, sample, -e, "hist:linear:1", --format, json]
  runs: 3
  reference:
    command: [sh, tests/reference/workloads/bpftrace/under.sh, /usr/share/bpftrace/tools/runqlen.bt, --]
    parse: bpftrace_hist
    requires: [bpftrace]
    privileged: true
    sudo: bpftrace
  compare:
    key: "@runqlen/p50"
    omn_parse: omn_hist_runqlen
    tolerance: {abs: 1}
    why: "both sample every cpu's cfs queue at 99 Hz while the workload keeps two busy children per cpu, runqlen.bt launched by bpftrace -c and omn by --system beside the program, separate runs; the median queue length of three runs each, a length apart at most because two samplers on two clocks catch the queue at different instants. runqlen.bt reads nr_queued as it stands where omn subtracts the task running, so the reference's median sits one above when the queue never empties; the band is that one"

- id: tcpconnect
  source: net.tcp.connect
  tool: tcpconnect.bt
  use: "tcpconnect.bt: active TCP connections"
  workload: [tests/reference/workloads/bpftrace/omnref, tests/reference/workloads/bpftrace/act.py, connect, "10"]
  omn: [trace, net.tcp.connect, -m, trace, -e, summary, --format, json]
  reference:
    command: [sh, tests/reference/workloads/bpftrace/under.sh, /usr/share/bpftrace/tools/tcpconnect.bt, --]
    parse: tcpconnect
    requires: [bpftrace]
    # A kernel whose traceable functions bpftrace cannot read (Alpine\'s
    # linux-virt without debugfs) attaches no kprobe: the machine refused.
    refused_when: ["No matches for kprobe"]
    privileged: true
    sudo: bpftrace
  compare:
    key: "comm:omnref"
    omn: results.0.outputs[emit=summary].series.*.count
    tolerance: {abs: 0}
    why: "exactly 10 connections to a local listener: tcpconnect prints one line per tcp_connect, omn one handshake per socket"

- id: tcplife
  source: net.tcp.lifetime
  tool: tcplife.bt
  use: "tcplife.bt: TCP sessions with duration and volume"
  workload: [tests/reference/workloads/bpftrace/omnref, tests/reference/workloads/bpftrace/act.py, connect, "10"]
  omn: [trace, net.tcp.lifetime, --system, -d, 6s, -m, trace, -e, summary, --filter, 'comm == "omnref"', --format, json]
  run: alongside
  settle_ms: 2000
  reference:
    command: [sh, -c, 't=$1; [ -e "$t" ] || t=/usr/sbin/$(basename "$t"); p=--preserve-status; timeout $p 1 true 2>/dev/null || p=; exec timeout $p -s INT 6 $SUDO bpftrace "$t"', sh, /usr/share/bpftrace/tools/tcplife.bt]
    parse: tcplife
    requires: [bpftrace, timeout]
    # A kernel whose traceable functions bpftrace cannot read (Alpine\'s
    # linux-virt without debugfs) attaches no kprobe: the machine refused.
    refused_when: ["No matches for kprobe"]
    privileged: true
    sudo: bpftrace
  compare:
    key: "comm:omnref"
    omn: results.0.outputs[emit=summary].series.*.count
    tolerance: {abs: 0}
    why: "one run, both observers system-wide over the same seconds: 10 local connections close 20 sockets, both ends in the workload; tcplife prints one line per socket, omn one session per socket"
