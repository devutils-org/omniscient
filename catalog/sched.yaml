# Family `sched` (scheduling and synchronization) — see CATALOG.md section 6.
# The most underrated family: it measures the time spent NOT running, which is
# invisible to every CPU profiler. sched.wakeup is the correlator's WAKEUP join
# mechanism and a dependency of every other family.

- id: sched.wakeup
  family: sched
  summary: "Wakeup chain: who unblocks whom"
  # One event per wakeup, not a duration. The nanoseconds this family is about
  # appear when these events are joined to what the woken task did next; the
  # source alone counts wakeups and says who caused them.
  unit: count
  backends:
    - id: "bpf:raw_tp"
      requires: ["bpf", "btf", "raw_tracepoint:sched_waking", "kernel>=5.8"]
      join: {key: "task:tid", match: wakeup}
      cost: med
    - id: "bpf:tp"
      requires: ["bpf", "tracefs", "tracepoint:sched:sched_waking"]
      join: {key: "task:tid", match: wakeup}
      cost: med
      equivalent: true
  modes: [trace]
  emits: [raw, topk, timeline, summary]
  targets: {system: native, pid: bpf_only, tid: bpf_only, cgroup: bpf_only, launch: bpf_only, container: bpf_only}
  keys: [task, cgroup]
  filter_fields: [comm, pid, cpu]
  determinism: low
  caveats:
    - "The only way to attribute latency across a block without instrumenting the
       application. Implement it early: the other families depend on it."
    - "Attached to `sched_waking`, not `sched_wakeup`: only the first runs in the
       waker's context, so it is the only one from which the waker can be read.
       On `sched_wakeup` the current task is whoever happened to be running on
       the woken task's cpu, which is wrong exactly on the cross-cpu wakeups
       that matter most."
    - "A wakeup is not a latency. The pair `waking -> on cpu` is the run queue
       wait and belongs to `sched.runqlat`; this source says who made a task
       runnable, and when."
    - "A wakeup issued from a hard interrupt, a served softirq or an NMI has the
       interrupt as its waker -- `waker_tid` 0 and `waker_context` naming which
       -- and a target keeps it only as its wakee. A softirq served in a task's
       own `local_bh_enable` (loopback delivery in the sender's `sendmsg`) is
       recorded as a softirq, though the sender caused it. A waker of 0 with
       `waker_context: task` is the idle task."

- id: sched.runqlat
  family: sched
  summary: "Run queue wait: wakeup -> on-CPU"
  unit: ns
  backends:
    # The same two events, attached the way this tool attaches: by name,
    # through BPF_RAW_TRACEPOINT_OPEN, against the kernel's own BTF. The
    # classic path below needs a numeric id out of tracefs and sees exactly
    # the same events, which is the ordering DECISIONS.md settled.
    #
    # Both are bucketed in the kernel and drained on a tick, so one event is a
    # `(task, bucket) -> count` row standing for every wait in it: `drained`
    # is what lets a `wakeup` join be refused before the run rather than
    # credit a hundred waits to the last wakeup before the drain.
    - id: "bpf:raw_tp"
      requires: ["bpf", "btf", "raw_tracepoint:sched_wakeup(task_struct *)", "raw_tracepoint:sched_switch(bool, task_struct *, task_struct *, unsigned int)", "kernel>=6.1"]
      join: {key: "task:tid", match: eq, ttl: 10s}
      cost: med
      drained: true
    - id: "bpf:tp"
      requires: ["tracepoint:sched:sched_wakeup", "tracepoint:sched:sched_switch", "bpf"]
      join: {key: "task:tid", match: eq, ttl: 10s}
      cost: med
      drained: true
      equivalent: true
  modes: [trace]
  emits: [hist, topk, raw, summary]
  targets: {system: native, pid: bpf_only, tid: bpf_only, cgroup: bpf_only, cpu: native, launch: bpf_only, container: bpf_only}
  keys: [task, cgroup, cpu]
  filter_fields: [comm, pid, cpu, prio]
  determinism: low
  caveats:
    - "On a contended program this source shortens what it measures: the bench
       measured the contended workload 9 % faster under it, because a program on
       the context switch changes the lock's convoy. A lock measurement describes
       the run it perturbed, and is read beside that run rather than against an
       untraced one."

- id: sched.offcpu
  family: sched
  summary: "Blocked time with the blocking stack"
  unit: ns
  backends:
    # Every backend adds the blocks up in the kernel and drains the totals on a
    # tick, which is what `drained` says: one event is a hundred blocks.
    - {id: "bpf:tp:stacks", requires: ["tracepoint:sched:sched_switch", "bpf", "callchain"], cost: high, drained: true}
    # Same events as `bpf:tp`, attached the way this tool attaches: through
    # BPF_RAW_TRACEPOINT_OPEN, which needs a name and BTF where the classic
    # path needs a numeric id out of tracefs. Ordered ahead of it for the
    # reason DECISIONS.md settled: strictly fewer requirements, same events.
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:sched_switch(bool, task_struct *, task_struct *, unsigned int)", "raw_tracepoint:sched_wakeup(task_struct *)", "kernel>=6.1"], cost: med, drained: true,
       degraded: "user stacks only: the kernel side of a block is always the scheduler, and what it was waiting for is the task state"}
    - {id: "bpf:tp", requires: ["tracepoint:sched:sched_switch", "bpf"], cost: med, drained: true,
       degraded: "no stacks: tells you how long, not where"}
  modes: [trace]
  emits: [hist, stack, topk, raw, summary]
  targets: {pid: bpf_only, tid: bpf_only, cgroup: bpf_only, launch: bpf_only, container: bpf_only, system: native}
  keys: [task, cgroup]
  filter_fields: [comm, pid, state, queued_ns, blocked_ns]
  determinism: low
  caveats:
    - "On a contended program this source shortens what it measures: the bench
       measured the contended workload 11 % faster under it, because a program on
       the context switch changes the lock's convoy. A lock measurement describes
       the run it perturbed, and is read beside that run rather than against an
       untraced one."
    - "An event is one bucket of one window, and it is stamped at the moment the
       window's first wait began rather than at the drain that read it. A join
       that *opens* on this source would otherwise open at the window's close,
       and everything that happened in the same window as the first wait would
       fall outside the state. `window_ns` beside the value says how wide the
       window was."
    - "Expensive on switch-heavy workloads, which is why the totals are kept in
       the kernel keyed by (task, state, stack-id) rather than streamed as one
       event per switch. The stack is walked once per distinct call site: what
       travels with each block is four bytes."
    - "The stack is taken where the task leaves the cpu, which is the only place
       it exists -- `sched_switch` runs in the outgoing task's context. By the
       time it is scheduled back in, what is under it is the scheduler."
    - "Blocked, not preempted. A task the scheduler took the cpu away from is
       still runnable and its wait is run queue latency, which is
       `sched.runqlat`; only a task that left because it was waiting for
       something is counted here. The two are told apart by the task state at
       the switch, and that state is on every event: `sleeping` is a program
       waiting for something to happen, `uninterruptible` is usually one
       waiting on a disk, and `idle` is a kernel worker the load average
       deliberately ignores.

       And the wait *after* the wakeup is inside the block: a block is timed
       from the switch out to the switch back in, so the run queue latency
       between the wakeup and the cpu is part of `total_ns` -- and is what
       `sched.runqlat` reports. Every event carries it as `queued_ns`, with
       `blocked_ns = total_ns - queued_ns` beside it, so a decomposition can add
       this source to `sched.runqlat` without counting the same nanoseconds
       twice. A `queued_ns` of zero on a block whose wakeup the run did not see
       means unknown rather than none, and the run says how many blocks that
       is."
    - "A task still blocked when the run ends is in no total: its block has no
       end yet. The count of them is reported with the run, because a program
       that spends its life waiting would otherwise show almost nothing."
    - "A block is credited in full to the interval in which it *ended*, because
       that is when its duration becomes known. So `total_ns` can exceed the
       `window_ns` beside it -- a 400 ms wait drained on a 100 ms tick reports
       400 ms against a 100 ms window -- and the pair is a total and the
       interval it was collected over, never a share of it."

- id: sched.switches
  family: sched
  summary: "Context switches"
  unit: count
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:sched_switch", "kernel>=6.1"], cost: low}
    - {id: "bpf:tp", requires: ["tracepoint:sched:sched_switch", "bpf"], cost: low, equivalent: true}
    - {id: "pmu:sw", requires: ["pmu:PERF_COUNT_SW_CONTEXT_SWITCHES"], cost: free,
       degraded: "one sample per switch for the observed task, with no second party:
                  it says a switch happened and when, never what ran next or why
                  the task left the cpu"}
  modes: [count, trace]
  emits: [rate, summary, topk, raw]
  targets: {system: native, cgroup: native, pid: native, tid: native, cpu: native, launch: native, container: native}
  keys: [task, cgroup, cpu]
  filter_fields: [comm, pid, cpu]
  determinism: low
  caveats:
    - "A switch count is a symptom, not a cause: a voluntary switch is a task
       blocking on something and an involuntary one is the scheduler taking the
       cpu away. Only a `sched_switch` backend can tell them apart, because only
       it sees the outgoing task's state; `pmu:sw` counts both as one."

