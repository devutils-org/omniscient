# Family `sched` (scheduling and synchronization) — see docs/CATALOG.md section 6.
# The most underrated family: it measures the time spent NOT running, which is
# invisible to every CPU profiler. sched.wakeup is the correlator's WAKEUP join
# mechanism and a dependency of every other family.

- id: sched.wakeup
  family: sched
  summary: "Wakeup chain: who unblocks whom"
  # One event per wakeup, not a duration. The nanoseconds this family is about
  # appear when these events are joined to what the woken task did next; the
  # source alone counts wakeups and says who caused them.
  unit: count
  backends:
    - id: "bpf:raw_tp"
      requires: ["bpf", "btf", "raw_tracepoint:sched_waking", "raw_tracepoint:sched_process_fork(task_struct *, task_struct *)", "raw_tracepoint:sched_process_free(task_struct *)", "bpf_map:ringbuf"]
      join: {key: "task:tid", match: wakeup}
      cost: med
    - id: "bpf:tp"
      requires: ["bpf", "tracefs", "tracepoint:sched:sched_waking", "tracepoint:irq:irq_handler_entry",
        "tracepoint:irq:irq_handler_exit", "tracepoint:irq:softirq_entry", "tracepoint:irq:softirq_exit",
        "tracepoint:task:task_newtask", "tracepoint:sched:sched_process_free"]
      join: {key: "task:tid", match: wakeup}
      cost: med
      degraded: "the record names the wakee by its thread id: its process is read from `/proc` at the
        drain unless the target is a process, and a cgroup keeps only the wakeups its tasks issued; an
        interrupt is told apart by the `irq` tracepoints, so an NMI's wakeup is credited to what it
        interrupted"
  modes: [trace]
  emits: [raw, topk, timeline, summary]
  targets: {system: native, pid: bpf_only, tid: bpf_only, cgroup: bpf_only, launch: bpf_only}
  keys: [task, cgroup]
  filter_fields: [comm, pid, ppid, cpu]
  determinism: low
  caveats:
    - "The only way to attribute latency across a block without instrumenting the
       application. Implement it early: the other families depend on it."
    - "Attached to `sched_waking`, not `sched_wakeup`: only the first runs in the
       waker's context, so it is the only one from which the waker can be read.
       On `sched_wakeup` the current task is whoever happened to be running on
       the woken task's cpu, which is wrong exactly on the cross-cpu wakeups
       that matter most."
    - "A wakeup is not a latency. The pair `waking -> on cpu` is the run queue
       wait and belongs to `sched.runqlat`; this source says who made a task
       runnable, and when."
    - "A process target is followed into every process it starts, as
       `cpu.profile` follows it, both as wakee and as waker: a program on
       `sched_process_fork` adds a child to the set before it has run."
    - "A wakeup issued from a hard interrupt, a served softirq or an NMI has the
       interrupt as its waker -- `waker_tid` 0 and `waker_context` naming which
       -- and a target keeps it only as its wakee. A softirq served in a task's
       own `local_bh_enable` (loopback delivery in the sender's `sendmsg`) is
       recorded as a softirq, though the sender caused it. A waker of 0 with
       `waker_context: task` is the idle task."
    - "Each end has its own name: `comm` and `pid` are the wakee's, because the
       event is keyed on it, and `wakee_comm` says so by name; `waker_comm` is
       the waker's, on a task's wakeup only. A launched program is named `omn`
       until it executes, because it is `omn`'s fork until then."
    - "An interrupt's wakeup carries `served_in_tid` and `served_in_comm`, the
       task the interrupt was served on -- where it landed, or the task whose
       `local_bh_enable` served the softirq, which is then the one that caused
       it -- and `irq`, the hard interrupt's number as `/proc/interrupts`
       numbers it, or `softirq`, the vector's name. A hard interrupt with no
       registered handler (the local timer, which ends most sleeps, and
       inter-processor interrupts) has no `irq`, and neither has a threaded
       handler's wakeup of its own thread, which the kernel issues after the
       handler's exit."

- id: sched.runqlat
  family: sched
  summary: "Run queue wait: wakeup -> on-CPU"
  unit: ns
  backends:
    # The same two events, attached the way this tool attaches: by name,
    # through BPF_RAW_TRACEPOINT_OPEN, against the kernel's own BTF. The
    # classic path below needs a numeric id out of tracefs and sees exactly
    # the same events, which is the ordering docs/DECISIONS.md settled.
    #
    # Both are bucketed in the kernel and drained on a tick, so one event is a
    # `(task, bucket) -> count` row standing for every wait in it: `drained`
    # is what lets a `wakeup` join be refused before the run rather than
    # credit a hundred waits to the last wakeup before the drain.
    - id: "bpf:raw_tp"
      requires: ["bpf", "btf", "raw_tracepoint:sched_wakeup(task_struct *)", "raw_tracepoint:sched_wakeup_new(task_struct *)", "raw_tracepoint:sched_switch(bool, task_struct *, task_struct *, unsigned int)", "raw_tracepoint:sched_process_fork(task_struct *, task_struct *)", "raw_tracepoint:sched_process_free(task_struct *)"]
      join: {key: "task:tid", match: eq, ttl: 10s}
      cost: med
      drained: true
    - id: "bpf:tp"
      requires: ["tracepoint:sched:sched_wakeup", "tracepoint:sched:sched_wakeup_new", "tracepoint:sched:sched_switch",
        "tracepoint:task:task_newtask", "tracepoint:sched:sched_process_free", "bpf"]
      join: {key: "task:tid", match: eq, ttl: 10s}
      cost: med
      drained: true
      degraded: "a wait is the gap between the tracepoints, as `runqlat` measures it, not the kernel's
        own `rq->clock` account, which no record carries; and a cgroup target is refused: the waiting
        task's cgroup is in no record"
  modes: [trace]
  emits: [hist, topk, raw, summary]
  targets: {system: native, pid: bpf_only, tid: bpf_only, cgroup: bpf_only, cpu: native, launch: bpf_only}
  keys: [task, cgroup, cpu]
  filter_fields: [comm, pid, ppid, cpu, prio]
  determinism: low
  caveats:
    - "On a contended program this source shortens what it measures: the bench
       measured the contended workload 9 % faster under it, because a program on
       the context switch changes the lock's convoy. A lock measurement describes
       the run it perturbed, and is read beside that run rather than against an
       untraced one."
    - "A wait is the kernel's own account of it, read from the task's
       `sched_info` at the switch that ends it: `rq->clock` less the queue
       stamp, plus what `run_delay` grew by if the task was moved between cpus
       while it waited. So the waits of a task add up to what its `schedstat`
       says, and to `sched.offcpu`'s `queued_ns`. The tracepoints' account,
       `sched_wakeup` (or the preempting switch) to the switch that ran the
       task, is beside it as `wake_to_run_ns`: about a microsecond a wait
       more, a cpu coming out of idle for the task it was woken for, which the
       kernel counts as blocked. A task's first wait, from its fork, is
       counted (`sched_wakeup_new`)."
    - "A process target is followed into every process it starts, as
       `cpu.profile` follows it: a program on `sched_process_fork` adds a
       child to the set before it has run, so a build's compilers have their
       waits here from the first one."

- id: sched.offcpu
  family: sched
  summary: "Blocked time with the blocking stack"
  unit: ns
  backends:
    # Every backend adds the blocks up in the kernel and drains the totals on a
    # tick, which is what `drained` says: one event is a hundred blocks.
    # The same events as the classic tracepoints below, attached the way this
    # tool attaches: through BPF_RAW_TRACEPOINT_OPEN, which needs a name and
    # BTF where the classic path needs a numeric id out of tracefs. Ordered
    # ahead of them for the reason docs/DECISIONS.md settled: strictly fewer
    # requirements, same events.
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:sched_switch(bool, task_struct *, task_struct *, unsigned int)", "raw_tracepoint:sched_wakeup(task_struct *)", "raw_tracepoint:sched_process_fork(task_struct *, task_struct *)", "raw_tracepoint:sched_process_free(task_struct *)"], cost: med, drained: true,
       degraded: "user stacks only: the kernel side of a block is always the scheduler, and what it was waiting for is the task state"}
    - {id: "bpf:tp:stacks", requires: ["tracepoint:sched:sched_switch", "tracepoint:sched:sched_wakeup", "tracepoint:task:task_newtask",
         "tracepoint:sched:sched_process_free", "bpf", "callchain"], cost: high, drained: true,
       degraded: "user stacks only, and no record carries the kernel's clock: `queued_ns` is the wait from
         `sched_wakeup` to the switch by the tracepoints, and a block begins at the switch"}
    - {id: "bpf:tp", requires: ["tracepoint:sched:sched_switch", "tracepoint:sched:sched_wakeup", "tracepoint:task:task_newtask",
         "tracepoint:sched:sched_process_free", "bpf"], cost: med, drained: true,
       degraded: "no stacks: tells you how long, not where; and `queued_ns` is the tracepoints' wait"}
  modes: [trace]
  emits: [hist, stack, topk, raw, summary]
  targets: {pid: bpf_only, tid: bpf_only, cgroup: bpf_only, launch: bpf_only, system: native}
  keys: [task, cgroup]
  filter_fields: [comm, pid, ppid, state, queued_ns, blocked_ns]
  determinism: low
  caveats:
    - "On a contended program this source shortens what it measures: the bench
       measured the contended workload 11 % faster under it, because a program on
       the context switch changes the lock's convoy. A lock measurement describes
       the run it perturbed, and is read beside that run rather than against an
       untraced one."
    - "An event is one row of one window, and it is stamped at the drain that
       closed the window, not at any block in it: the blocks it adds up ended in
       `(ts_ns - window_ns, ts_ns]`. A join that *opens* on this source opens
       at the window's close, so what happened earlier in the same window falls
       outside the state; `window_ns` beside the value says how far back the
       window reaches."
    - "Expensive on switch-heavy workloads, which is why the totals are kept in
       the kernel keyed by (task, state, stack-id, log2 bucket) rather than
       streamed as one event per switch. The stack is walked once per distinct
       call site: what travels with each block is four bytes. The value is the
       mean block of a row, `block_ns`, weighed by `blocks`: every block of a
       row is in its bucket, so a `hist` is of blocks, and `total_ns` beside it
       is their exact sum."
    - "The stack is taken where the task leaves the cpu, which is the only place
       it exists -- `sched_switch` runs in the outgoing task's context. By the
       time it is scheduled back in, what is under it is the scheduler."
    - "Blocked, not preempted. A task the scheduler took the cpu away from is
       still runnable and its wait is run queue latency, which is
       `sched.runqlat`; only a task that left because it was waiting for
       something is counted here. The two are told apart by the task state at
       the switch, and that state is on every event: `sleeping` is a program
       waiting for something to happen, `uninterruptible` is usually one
       waiting on a disk, and `idle` is a kernel worker the load average
       deliberately ignores.

       And the wait *after* the wakeup is inside the block: a block is timed
       from the switch out to the switch back in, so the run queue latency
       between the wakeup and the cpu is part of `total_ns` -- and is what
       `sched.runqlat` reports. Every event carries it as `queued_ns`, with
       `blocked_ns = total_ns - queued_ns` beside it, so a decomposition can add
       this source to `sched.runqlat` without counting the same nanoseconds
       twice.

       `queued_ns` is the kernel's own account of that wait, read from the
       task's `sched_info` at the switch that ends it -- `rq->clock` less the
       queue stamp, plus what `run_delay` grew by if the task was moved between
       cpus while it waited -- so it is what the task's `schedstat` says it
       waited, wait for wait. The tracepoints' account of the same wait,
       `sched_wakeup` to the switch, is beside it as `wake_to_run_ns`: the two
       part by about a microsecond a wait, a cpu coming out of idle for the
       task it was woken for, which the kernel leaves in blocked time and so
       does `blocked_ns`. A block begins where `__schedule` was entered rather
       than at the switch, after the next task was picked: that is where the
       kernel stops the task's cpu account (`sched_entry_tp`, 6.16; earlier
       kernels keep the switch and say so). A block whose wakeup the run did
       not see has a `wake_to_run_ns` of zero meaning unknown, and the run says
       how many blocks that is."
    - "A process target is followed into every process it starts, as
       `cpu.profile` follows it: a program on `sched_process_fork` adds a
       child to the set before it has run, so a compiler driver's or a build's
       children have their blocks here from the first one. A process whose
       stacks are asked for is named against its own mappings, read again on
       every drain it blocked in."
    - "A task still blocked when the run ends is in no total: its block has no
       end yet. The count of them is reported with the run, because a program
       that spends its life waiting would otherwise show almost nothing."
    - "A block is credited in full to the interval in which it *ended*, because
       that is when its duration becomes known. So `total_ns` can exceed the
       `window_ns` beside it -- a 400 ms wait drained on a 100 ms tick reports
       400 ms against a 100 ms window -- and the pair is a total and the
       interval it was collected over, never a share of it."

- id: sched.switches
  family: sched
  summary: "Context switches"
  unit: count
  backends:
    # First for every target it serves, because on the question both answer --
    # how many times a task left the cpu -- an inherited counter is exact and
    # free, and a program costs a run on every switch of the machine
    # (docs/DECISIONS.md, the fourteenth wave). It follows threads and cpus, and
    # nothing inside a cgroup.
    - {id: "pmu:sw", requires: ["pmu:PERF_COUNT_SW_CONTEXT_SWITCHES"], cost: free,
       targets: {system: native, pid: native, tid: native, cpu: native, launch: native},
       filter_fields: [comm, pid, cpu],
       degraded: "one sample per switch for the observed task, with no second party:
                  it says a switch happened and when, never what ran next or why
                  the task left the cpu"}
    # The `sched_switch` program, counting in the kernel per task and kind:
    # what serves a cgroup, and what tells a voluntary switch from an
    # involuntary one by the kernel's own rule, for anyone who forces it.
    # `count` only: `trace` is a per-switch event, which the `woke` join from
    # `sched.wakeup` needs, and `pmu:sw` records.
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:sched_switch(bool, task_struct *, task_struct *, unsigned int)", "raw_tracepoint:sched_process_fork(task_struct *, task_struct *)", "raw_tracepoint:sched_process_free(task_struct *)"], cost: low,
       modes: [count], targets: {system: native, pid: native, tid: native, launch: native, cgroup: native},
       filter_fields: [comm, pid, ppid], equivalent: true, drained: true}
    - {id: "bpf:tp", requires: ["tracepoint:sched:sched_switch", "bpf"], cost: low,
       modes: [count], targets: {system: native, pid: native, tid: native, launch: native, cgroup: native},
       filter_fields: [comm, pid, ppid], equivalent: true}
  modes: [count, trace]
  emits: [rate, summary, topk, raw]
  targets: {system: native, pid: native, tid: native, cpu: native, launch: native, cgroup: native}
  keys: [task, cgroup, cpu]
  filter_fields: [comm, pid, ppid, cpu]
  determinism: low
  caveats:
    - "A switch count is a symptom, not a cause: a voluntary switch is a task
       blocking on something and an involuntary one is the scheduler taking the
       cpu away. Only a `sched_switch` backend can tell them apart, because only
       it sees the outgoing task's state; `pmu:sw` counts both as one. A cgroup
       is served by the `sched_switch` program, whose rows carry `kind`
       (voluntary or involuntary, by the kernel's own nvcsw rule); `--backend
       force:bpf:raw_tp -m count` asks it for any other target."

- id: sched.migrations
  family: sched
  summary: "Task migrations between cores"
  unit: count
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:sched_migrate_task(task_struct *, int)", "raw_tracepoint:sched_process_fork(task_struct *, task_struct *)", "raw_tracepoint:sched_process_free(task_struct *)", "bpf_map:ringbuf"], cost: low, drained: true}
    - {id: "bpf:tp", requires: ["tracepoint:sched:sched_migrate_task", "bpf"], cost: low, equivalent: true}
    # The perf software counter `cpu.migrations` reads, where no program can
    # be loaded: how many times the target moved.
    - {id: "pmu:sw", requires: ["pmu:PERF_COUNT_SW_CPU_MIGRATIONS"], cost: low, modes: [count],
       emits: [summary, rate, raw], targets: {system: native, pid: native, cgroup: native},
       keys: [], filter_fields: [],
       degraded: "a count of the target's migrations over the window: not where each one went
                  from or to, nor which task moved"}
  modes: [trace, count]
  emits: [rate, topk, raw, summary]
  targets: {system: native, pid: bpf_only, cgroup: bpf_only}
  keys: [task, cgroup]
  filter_fields: [comm, pid, ppid, cpu]
  determinism: low

- id: sched.lock
  family: sched
  summary: "Kernel lock contention"
  unit: ns
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:contention_begin(void *, unsigned int)", "raw_tracepoint:contention_end(void *, int)", "raw_tracepoint:sched_process_fork(task_struct *, task_struct *)", "raw_tracepoint:sched_process_free(task_struct *)"], cost: med, drained: true}
    - {id: "bpf:tp", requires: ["tracepoint:lock:contention_begin", "tracepoint:lock:contention_end", "bpf"], cost: med, equivalent: true}
    # Before the contention tracepoints (5.19: Rocky 8, Ubuntu 22.04):
    # kprobe pairs on the sleeping locks' slow paths, each read as
    # `contention_begin`/`_end` would have been.
    - {id: "bpf:kprobe", requires: ["kprobe", "bpf", "btf", "kprobe:__mutex_lock_slowpath", "raw_tracepoint:sched_process_fork(task_struct *, task_struct *)", "raw_tracepoint:sched_process_free(task_struct *)"], cost: high, drained: true,
       degraded: "kprobe pairs on the sleeping locks' slow paths -- mutexes and rw-semaphores -- rather than the contention tracepoints, so a wait is the whole slow path, its optimistic spin on the owner included: where the tracepoints begin after the spin, this is far longer under a convoy (contend.py's mmap_lock, 6.3 s against 50 ms of write waits). A spinlock, an rt-mutex or a per-cpu rw-semaphore wait is not here"}
  modes: [trace]
  emits: [hist, topk, stack, raw, summary]
  targets: {system: native, pid: bpf_only, tid: bpf_only, cgroup: bpf_only, launch: bpf_only}
  keys: [task]
  filter_fields: [comm, pid, ppid, kind, addr, caller]
  determinism: low
  caveats:
    - "On a contended program this source shortens what it measures: the bench
       measured the contended workload 21 % faster under it, because a program on
       the context switch changes the lock's convoy. A lock measurement describes
       the run it perturbed, and is read beside that run rather than against an
       untraced one."
    - "An event is one bucket of one window, and it is stamped at the moment the
       window's first one began rather than at the drain that read it. A join
       that *opens* on this source would otherwise open at the window's close,
       and everything that happened in the same window as the first would fall
       outside the state. `window_ns` beside the value says how wide the window
       was."
    - "A process target is followed into every process it starts, as
       `sched.offcpu` follows it: a program on `sched_process_fork` adds a child
       to the set before it has run."
    - "Each event carries `addr`, the lock's kernel address (valid while the
       lock exists, so never a key), and `caller`, the first function of the
       wait's kernel stack past the tracing, the lock primitives and the
       scheduler -- `perf lock contention`'s caller column. The caller is named
       through /proc/kallsyms: where this user may not read its addresses it is
       an address, and `-k task -e topk:10@caller` ranks by it either way."

- id: sched.futex
  family: sched
  summary: "Userspace futex wait"
  unit: ns
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:sys_enter(pt_regs *, long int)", "raw_tracepoint:sys_exit(pt_regs *, long int)", "raw_tracepoint:sched_process_fork(task_struct *, task_struct *)", "raw_tracepoint:sched_process_free(task_struct *)", "bpf_map:ringbuf"], cost: high, drained: true}
    - {id: "bpf:tp", requires: ["tracepoint:raw_syscalls:sys_enter", "tracepoint:raw_syscalls:sys_exit",
         "tracepoint:task:task_newtask", "tracepoint:sched:sched_process_free", "bpf"], cost: high, equivalent: true}
  modes: [trace]
  emits: [hist, topk, stack, raw, summary]
  targets: {pid: native, tid: native, launch: native, cgroup: bpf_only}
  keys: [task]
  filter_fields: [comm, pid, ppid, addr]
  determinism: low
  caveats:
    - "An event is one bucket of one window, and it is stamped at the moment the
       window's first one began rather than at the drain that read it. A join
       that *opens* on this source would otherwise open at the window's close,
       and everything that happened in the same window as the first would fall
       outside the state. `window_ns` beside the value says how wide the window
       was."
    - "A process target is followed into every process it starts, as
       `sched.offcpu` follows it: a program on `sched_process_fork` adds a child
       to the set before it has run."

- id: sched.mutex
  family: sched
  summary: "pthread mutex contention"
  unit: ns
  backends:
    - {id: "preload", requires: ["dynamic-linking"], cost: extreme, targets: {launch: native}}
    # glibc's own probes: three traps per lock and unlock, and the one backend
    # that reaches a process already running. Not for a launch, which the shim
    # serves at a fraction of the cost.
    - {id: "bpf:usdt", requires: ["uprobe", "bpf", "btf"], cost: extreme,
       targets: {pid: native, tid: native, launch: "no"},
       degraded: "three uprobes per lock and unlock, about 2 us: serializes what it measures
         on hot locks, and a successful trylock is not seen"}
    - {id: "bpf:uprobe", requires: ["uprobe", "bpf", "symbols:pthread_mutex_lock"], cost: extreme,
       degraded: "~1-2 us per call: serializes what it measures on hot locks"}
  modes: [trace]
  # `stack` is the uprobe's: the shim refuses it by name, because walking a
  # stack inside every lock would cost more than the lock.
  emits: [hist, topk, stack, raw, summary]
  targets: {pid: native, tid: native, launch: native}
  keys: [task]
  filter_fields: [comm, addr, how, released_by]
  determinism: low
  caveats:
    - "Through the preload shim a record goes into a 3 MiB ring the tool maps in
       the program, so up to 3 MiB of the program's resident memory, as `mem.rss`
       reads it beside this source, is the ring."
    - "One event per acquisition, stamped when the thread asked for the mutex:
       `wait_ns` is the time until it had it, `hold_ns` the time until it let go.
       An uncontended acquisition is here too, with a wait of tens of
       nanoseconds -- it never reaches the kernel, which is why `sched.futex`
       cannot see it."
    - "Only pthread mutexes, taken through the exported symbol. Glibc's own
       internal locks, Rust's and Go's locks, and anything else that waits on a
       futex directly are invisible here and visible to `sched.futex`."
    - "A condition wait ends the hold it began in, and the reacquisition inside
       `pthread_cond_wait` is not an event: its wait for the mutex and its wait
       for the condition cannot be told apart. A failed `pthread_mutex_trylock`
       is not a wait and is not reported."
    - "A preloaded shim reaches a program only at exec, so the preload backend
       needs a program the tool launches. A running process is read through
       glibc's `libc:mutex_*` probes instead, which a glibc built without
       systemtap support does not carry."

- id: sched.irq
  family: sched
  summary: "Time spent in hard and soft interrupt handlers"
  unit: ns
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:irq_handler_entry(int, irqaction *)", "raw_tracepoint:irq_handler_exit(int, irqaction *, int)", "raw_tracepoint:softirq_entry(unsigned int)", "raw_tracepoint:softirq_exit(unsigned int)", "bpf_map:ringbuf"], cost: med, drained: true}
    - {id: "bpf:tp", requires: ["tracepoint:irq:irq_handler_entry", "tracepoint:irq:irq_handler_exit", "tracepoint:irq:softirq_entry", "tracepoint:irq:softirq_exit", "bpf"], cost: med, equivalent: true}
    # Each cpu's time in interrupt handlers as the scheduler accounts it, in
    # clock ticks: exact where the kernel accounts irq time
    # (CONFIG_IRQ_TIME_ACCOUNTING, the distributions' default), the ticks that
    # landed in a handler otherwise.
    - {id: "fs:proc", requires: ["/proc/stat"], cost: free, modes: [count], emits: [summary, rate, raw],
       targets: {system: native}, keys: [cpu], filter_fields: [cpu],
       degraded: "each cpu's time in hard and soft interrupt handlers over the window, in clock
                  ticks (10 ms): no handler, interrupt or vector, and no distribution"}
  modes: [trace, count]
  emits: [hist, topk, rate, raw, summary]
  targets: {system: native, cpu: native}
  keys: [cpu]
  filter_fields: [irq, cpu, name, kind]
  determinism: low
  caveats:
    - "A row is one half: `kind` says `hard` or `soft`. A hard row's `irq` is its
       interrupt line and its `name` the handler's, as `/proc/interrupts` shows
       them; a soft row's `irq` is its vector and its `name` the vector's, as
       `/proc/softirqs` does. The numbers overlap, so a filter on `irq` alone
       names one of each. A hard handler that lands inside a softirq is taken
       out of the softirq's time and counted as its own, so the two halves add
       up without counting any nanosecond twice."
    - "An event is one bucket of one window, and it is stamped at the moment the
       window's first one began rather than at the drain that read it. A join
       that *opens* on this source would otherwise open at the window's close,
       and everything that happened in the same window as the first would fall
       outside the state. `window_ns` beside the value says how wide the window
       was."

- id: sched.interrupts
  family: sched
  summary: "Interrupt counts per cpu, line and softirq vector"
  unit: count
  backends:
    - {id: "fs:proc", requires: ["/proc/interrupts", "/proc/softirqs"], cost: free}
  modes: [poll, count]
  emits: [rate, topk, timeline, raw, summary]
  targets: {system: native, cpu: native}
  keys: [cpu]
  filter_fields: [cpu, irq, line, name, kind]
  determinism: low
  caveats:
    - "A count, not a time: how many interrupts each cpu took between two reads
       of `/proc/interrupts` and `/proc/softirqs`, as vmstat's `in` and `mpstat
       -I` report them. `sched.irq` is how long they ran. A row carries `kind`
       (`hard` or `soft`), `line` (the label the file gives it: a number, or
       `LOC`, `RES`, `TIMER`) and `name` (the handler's, or the label); a row
       that did not move in a window is not reported. `--filter 'kind ==
       \"hard\"'` keeps the hardware interrupts alone, what vmstat's `in`
       counts (the filter reads an attribute named `kind` before the event's
       own since the twenty-fifth wave)."

- id: sched.slices
  family: sched
  summary: "One event per time slice on a cpu: its run, queue wait and time off"
  unit: ns
  backends:
    # One ring record per switch either end of which is the target's, the
    # leaving task's run and the coming task's queue wait read from the
    # kernel's own `sched_info` stamps: `perf sched timehist`'s line.
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:sched_switch(bool, task_struct *, task_struct *, unsigned int)", "raw_tracepoint:sched_wakeup(task_struct *)", "raw_tracepoint:sched_wakeup_new(task_struct *)", "raw_tracepoint:sched_process_fork(task_struct *, task_struct *)", "raw_tracepoint:sched_process_free(task_struct *)"], cost: high}
  modes: [trace]
  emits: [hist, topk, raw, summary]
  targets: {system: native, pid: bpf_only, tid: bpf_only, cgroup: bpf_only, launch: bpf_only}
  keys: [task, cpu, comm]
  filter_fields: [comm, pid, ppid, cpu, state, next_comm, run_ns, queue_ns, off_ns, wake_ns]
  determinism: low
  caveats:
    - "An event is one slice of one task on one cpu, stamped where it left the
       cpu: `run_ns` how long it ran (the kernel's `rq->clock - last_arrival`),
       `queue_ns` how long it waited on the run queue before it ran, `off_ns`
       how long it was off the cpu before it was queued, `state` how it left
       (`preempted`, `sleeping`, `uninterruptible`), and `next_comm` who took
       the cpu. `off_ns` and `queue_ns` add up to the gap between the task's
       switch out and its next switch in. A slice that began before the run
       carries no `queue_ns` or `off_ns`, and neither does one whose task came
       in with no queue stamp and whose switch out the run did not see: those
       are counted in the facts, never read as a zero wait. `queue_ns` is the
       kernel's `rq->clock - last_queued` plus what `run_delay` grew by while
       the task was away (the part of a wait spent on a cpu the balancer moved
       it from), as
       `schedstat` counts it: a task woken onto an idle cpu reads 0 there, where
       the scheduler did not move its clock between the wakeup and the switch,
       and `perf sched timehist`'s `sch delay`, timed between the tracepoints,
       reads a few microseconds. `wake_ns` is that wait timed between the
       tracepoints, as timehist does: from the task's `sched_wakeup` (or its
       preemption, a switch out still runnable) to its switch in, absent where
       the run saw neither. It costs a ring record per switch of the target, which on a
       machine-wide run is every switch of the machine."

- id: sched.runqueue
  family: sched
  summary: "Runnable and blocked tasks, and the load averages"
  unit: count
  backends:
    - {id: "fs:proc", requires: ["/proc/stat", "/proc/loadavg"], cost: free}
  modes: [poll, snapshot]
  emits: [timeline, raw, summary]
  targets: {system: native}
  keys: []
  filter_fields: []
  determinism: low
  caveats:
    - "One look at the machine's run queue per read, as vmstat's `r` and `b`
       and `uptime` report it: `running` is `procs_running` (runnable tasks,
       this tool's reading thread among them), `blocked` is `procs_blocked`
       (uninterruptible sleep), `load1`, `load5` and `load15` the kernel's
       damped averages. The machine's sum: the per-cpu queue length is not
       exported outside debugfs."

- id: sched.runqlen
  family: sched
  summary: "Each cpu's run queue length, sampled on its clock (runqlen)"
  unit: count
  backends:
    - {id: "bpf:perf_event", requires: ["bpf", "btf", "pmu:PERF_COUNT_SW_CPU_CLOCK", "bpf_map:ringbuf"], cost: low}
  modes: [sample]
  emits: [hist, topk, raw]
  targets: {system: native, cpu: native}
  keys: [cpu]
  filter_fields: [cpu, len]
  determinism: low
  caveats:
    - "A program on each cpu's 99 Hz clock reads the cfs run queue of the task
       it interrupted (`nr_running`, less the task running): one event per cpu
       and length seen in a drain, `len` the value and `ticks` its weight.
       `-e hist` is runqlen's histogram (`-k cpu -e hist` its `-C`, per cpu),
       `-k cpu -e topk` the cpus whose queues held the most waiting ticks. Sampled: a queue that filled and drained between two ticks is
       not seen. A real-time task's tick says nothing of the cfs queue and is
       not counted. `sched.runqueue` is the machine's sum from /proc/stat."

- id: sched.numa_balance
  family: sched
  summary: "Automatic NUMA balancing decisions"
  unit: count
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:sched_stick_numa(task_struct *, int, task_struct *, int)", "bpf_map:ringbuf"], cost: low, drained: true}
    - {id: "bpf:tp", requires: ["tracepoint:sched:sched_stick_numa", "bpf"], cost: low, equivalent: true}
  modes: [trace, count]
  emits: [rate, topk, raw, summary]
  targets: {system: native}
  keys: [task]
  filter_fields: [comm, pid, node]
  determinism: low

# The family's default: what `omn trace sched -- PROGRAM` composes, per cost
# band. See docs/lazy.md.
- default:
    family: sched
    question: "How often is the program switched out, and how long is it off a cpu?"
    low:
      - {source: sched.switches, mode: count, emit: [summary], label: "context switches"}
    med:
      - {source: sched.switches, mode: count, emit: [summary], label: "context switches"}
      - {source: sched.offcpu, mode: trace, emit: [hist, summary], label: "time off cpu"}
    high:
      - {source: sched.switches, mode: count, emit: [summary], label: "context switches"}
      - {source: sched.offcpu, mode: trace, emit: [hist, stack], label: "time off cpu, and where"}
