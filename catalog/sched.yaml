    - {id: "bpf:tp", requires: ["tracepoint:lock:contention_begin", "tracepoint:lock:contention_end", "bpf", "kernel>=6.1"], cost: med, equivalent: true}
    - {id: "bpf:kprobe", requires: ["kprobe", "bpf"], cost: high,
       degraded: "older kernels: futex and uprobe fallback, partial coverage"}
  modes: [trace]
  emits: [hist, topk, stack, raw, summary]
  targets: {system: native, pid: bpf_only, tid: bpf_only, cgroup: bpf_only}
  keys: [task]
  filter_fields: [comm, pid]
  determinism: low
  caveats:
    - "On a contended program this source shortens what it measures: the bench
       measured the contended workload 21 % faster under it, because a program on
       the context switch changes the lock's convoy. A lock measurement describes
       the run it perturbed, and is read beside that run rather than against an
       untraced one."
    - "An event is one bucket of one window, and it is stamped at the moment the
       window's first one began rather than at the drain that read it. A join
       that *opens* on this source would otherwise open at the window's close,
       and everything that happened in the same window as the first would fall
       outside the state. `window_ns` beside the value says how wide the window
       was."

- id: sched.futex
  family: sched
  summary: "Userspace futex wait"
  unit: ns
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:sys_enter(pt_regs *, long int)", "raw_tracepoint:sys_exit(pt_regs *, long int)", "kernel>=5.8"], cost: med, drained: true}
    - {id: "bpf:tp", requires: ["tracepoint:raw_syscalls:sys_enter", "tracepoint:raw_syscalls:sys_exit", "bpf"], cost: med, equivalent: true}
  modes: [trace]
  emits: [hist, topk, stack, raw, summary]
  targets: {pid: native, tid: native, launch: native, cgroup: bpf_only}
  keys: [task]
  filter_fields: [comm, pid, addr]
  determinism: low
  caveats:
    - "An event is one bucket of one window, and it is stamped at the moment the
       window's first one began rather than at the drain that read it. A join
       that *opens* on this source would otherwise open at the window's close,
       and everything that happened in the same window as the first would fall
       outside the state. `window_ns` beside the value says how wide the window
       was."

- id: sched.mutex
  family: sched
  summary: "pthread mutex contention"
  unit: ns
  backends:
    - {id: "preload", requires: ["dynamic-linking"], cost: med, targets: {launch: native}}
    # glibc's own probes: three traps per lock and unlock, and the one backend
    # that reaches a process already running. Not for a launch, which the shim
    # serves at a fraction of the cost.
    - {id: "bpf:usdt", requires: ["uprobe", "bpf", "btf"], cost: high,
       targets: {pid: native, tid: native, launch: "no"},
       degraded: "three uprobes per lock and unlock, about 2 us: serializes what it measures
         on hot locks, and a successful trylock is not seen"}
    - {id: "bpf:uprobe", requires: ["uprobe", "bpf", "symbols:pthread_mutex_lock"], cost: high,
       degraded: "~1-2 us per call: serializes what it measures on hot locks"}
  modes: [trace]
  # `stack` is the uprobe's: the shim refuses it by name, because walking a
  # stack inside every lock would cost more than the lock.
  emits: [hist, topk, stack, raw, summary]
  targets: {pid: native, tid: native, launch: native}
  keys: [task]
  filter_fields: [comm, addr, how, released_by]
  determinism: low
  caveats:
    - "Through the preload shim a record goes into a 3 MiB ring the tool maps in
       the program, so up to 3 MiB of the program's resident memory, as `mem.rss`
       reads it beside this source, is the ring."
    - "One event per acquisition, stamped when the thread asked for the mutex:
       `wait_ns` is the time until it had it, `hold_ns` the time until it let go.
       An uncontended acquisition is here too, with a wait of tens of
       nanoseconds -- it never reaches the kernel, which is why `sched.futex`
       cannot see it."
    - "Only pthread mutexes, taken through the exported symbol. Glibc's own
       internal locks, Rust's and Go's locks, and anything else that waits on a
       futex directly are invisible here and visible to `sched.futex`."
    - "A condition wait ends the hold it began in, and the reacquisition inside
       `pthread_cond_wait` is not an event: its wait for the mutex and its wait
       for the condition cannot be told apart. A failed `pthread_mutex_trylock`
       is not a wait and is not reported."
    - "A preloaded shim reaches a program only at exec, so the preload backend
       needs a program the tool launches. A running process is read through
       glibc's `libc:mutex_*` probes instead, which a glibc built without
       systemtap support does not carry."

- id: sched.irq
  family: sched
  summary: "Time spent in hard interrupt handlers"
  unit: ns
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:irq_handler_entry(int, irqaction *)", "raw_tracepoint:irq_handler_exit(int, irqaction *, int)", "kernel>=5.8"], cost: med, drained: true}
    - {id: "bpf:tp", requires: ["tracepoint:irq:irq_handler_entry", "tracepoint:irq:irq_handler_exit", "bpf"], cost: med, equivalent: true}
  modes: [trace, count]
  emits: [hist, topk, rate, raw, summary]
  targets: {system: native, cpu: native}
  keys: [cpu]
  filter_fields: [irq, cpu, name]
  determinism: low
  caveats:
    - "An event is one bucket of one window, and it is stamped at the moment the
       window's first one began rather than at the drain that read it. A join
       that *opens* on this source would otherwise open at the window's close,
       and everything that happened in the same window as the first would fall
       outside the state. `window_ns` beside the value says how wide the window
       was."

- id: sched.numa_balance
  family: sched
  summary: "Automatic NUMA balancing decisions"
  unit: count
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:sched_stick_numa(task_struct *, int, task_struct *, int)", "kernel>=5.8"], cost: low, drained: true}
    - {id: "bpf:tp", requires: ["tracepoint:sched:sched_stick_numa", "bpf"], cost: low, equivalent: true}
  modes: [trace, count]
  emits: [rate, topk, raw, summary]
  targets: {system: native}
  keys: [task]
  filter_fields: [comm, pid, node]
  determinism: low
