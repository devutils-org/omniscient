# The advice rules: from a reading of this run to the setting that governs
# the mechanism behind it. A table, not catalog entries; read by
# `src/triage/advise.rs`, held by its loader to the catalog and to
# `settings.yaml`.
#
# A rule never changes anything (`docs/DECISIONS.md`, boundary 5). It says
# what was measured, why it points at the setting, what the setting reads now,
# what changing it is expected to do to which reading, the command a person
# would type and at what scope, and how to check it: `omn advise --against`
# on the run before the change.
#
# Fields:
#   objectives  which of latency, tail, throughput, energy the advice serves.
#   evidence    every item must hold, on this run: a measure compared with a
#               constant (above, below, is), or a setting (is, is_not, above,
#               below, below_setting: another setting's value).
#   setting     the one setting the advice is about.
#   expect      the reading changing the setting moves, and which way:
#               down, up, or changes.
#   also        side effects expected beside it, reported and not required.
#   scope       process, cgroup or machine: who the change affects.
#   change      the command, as text. It is printed, never run.
#   truth       the test that changes the setting in a fixture and sees
#               `expect` move. A rule without one does not load.
#
# A measure is {source, mode, stat} and optionally {attr, target, on, per}:
#   stat   total, mean, max, min, count, first, last, over the summary of the
#          source's value, or over the events' `attr` when one is named.
#   target system to read the machine's rather than the workload's.
#   on     target_cpus: of a machine source's events, only those whose `cpu`
#          the target's affinity (process.cpus_allowed) allows.
#   per    another measure, or {run: wall_ns}, this one is divided by.
# or {run: wall_ns}, the launched program's wall clock.

- id: cgroup.memory.swap-denied
  summary: "The cgroup's OOM killer ran while the machine had swap the cgroup was not allowed to use."
  objectives: [latency, tail, throughput]
  evidence:
    - {source: mem.oom, mode: count, stat: total, above: 0}
    - {setting: cgroup.memory.swap.max, is: 0}
    - {setting: mm.swap_total, above: 0}
  setting: cgroup.memory.swap.max
  mechanism: >-
    When a cgroup's charge reaches memory.max, the kernel reclaims from that cgroup
    before it kills: page cache is dropped or written back, and anonymous memory
    can only go to swap. With memory.swap.max at 0 the cgroup's anonymous memory
    has nowhere to go, so a working set above the limit is killed at once, however
    much swap the machine has free.
  docs: admin-guide/cgroup-v2.rst
  expect: {source: mem.oom, mode: count, stat: total, goes: down}
  also:
    - {source: mem.pressure, mode: "poll@100ms", stat: max, goes: up}
  scope: cgroup
  change: >-
    echo max > <the cgroup>/memory.swap.max (or a size), or
    systemd-run --scope -p MemorySwapMax=<size or infinity> ... -- PROGRAM
  caveats:
    - "Swapping trades the kill for time: the pages that went to swap are faulted back in when used, which mem.pressure counts. A working set far above the limit thrashes instead of dying."
    - "memory.high is not the alternative here. On the development machine, with no swap allowed, MemoryHigh=100M under MemoryMax=128M did not stop the kill: it delayed it from 0.1 s to 260 s of throttling (docs/scenarios/advice.md)."
    - "Swap denied on purpose is common for latency-critical services, where a kill and a restart is the cheaper failure."
  truth: advice_truth::swap_allowed_to_the_cgroup_ends_the_kill

- id: oom.victim-by-size
  summary: "The OOM killer chose among the workload's processes by size alone: none of its victims had an adjustment."
  objectives: [latency, tail, throughput, energy]
  evidence:
    - {source: mem.oom, mode: trace, stat: count, above: 0}
    - {source: proc.exec, mode: trace, stat: count, above: 1}
    - {source: mem.oom, mode: trace, attr: oom_score_adj, stat: max, is: 0}
    - {source: mem.oom, mode: trace, attr: oom_score_adj, stat: min, is: 0}
  setting: process.oom_score_adj
  mechanism: >-
    The OOM killer kills the task with the highest oom_score: the memory it holds,
    as a share of what is available, scaled to 1000, plus its oom_score_adj. With
    every adjustment at 0 the largest process dies, which is the one that holds
    the most work. oom_score_adj from 1 to 1000 makes a process a likelier victim,
    and -1000 exempts it.
  docs: filesystems/proc.rst
  expect: {source: mem.oom, mode: trace, attr: comm, stat: first, goes: changes}
  scope: process
  change: >-
    echo 1000 > /proc/<pid of the process to sacrifice>/oom_score_adj, or
    choom -n 1000 -p <pid>, or OOMScoreAdjust= in its systemd unit
  caveats:
    - "This chooses which process dies, not whether one does: the memory is short either way, and cgroup.memory.swap-denied is about the whether."
    - "Raising a process's own adjustment needs no privilege; lowering one below what it was needs CAP_SYS_RESOURCE."
    - "Several processes is read from the workload's execs (proc.exec): a child that forks without exec is not counted, and a workload of one program has no choice to change."
  truth: advice_truth::an_adjustment_moves_the_oom_killer_to_the_other_process

- id: sched.shared-cpu
  summary: "The workload's threads waited to run on the few cpus its affinity allows, while the machine has more."
  objectives: [latency, throughput]
  evidence:
    - {source: sched.runqlat, mode: trace, stat: mean, above: 1000000}
    - {setting: process.cpus_allowed_count, below_setting: cpu.online_count}
  setting: process.cpus_allowed
  mechanism: >-
    A runnable thread waits in the run queue of a cpu its affinity allows. When a
    process's threads outnumber the cpus it may use, they take turns on them, and
    each turn is a wait the run-queue latency counts, however idle the other cpus
    of the machine are: the scheduler does not move a thread outside its mask.
  docs: scheduler/sched-design-CFS.rst
  expect: {source: sched.runqlat, mode: trace, stat: mean, goes: down}
  also:
    - {run: wall_ns, goes: down}
  scope: process
  change: >-
    taskset -pc <a wider cpu list> <pid> for a running process (each thread: -a),
    or taskset -c <list> PROGRAM, or CPUAffinity= in its systemd unit
  caveats:
    - "Narrow affinity is sometimes the point: a latency-critical process pinned away from the rest, or a cache shared on purpose. Widen it only where nothing else asked for the mask."
    - "The cpus the mask would add may be busy with other work: the run-queue latency of the machine's other tasks is the check."
  truth: advice_truth::a_wider_affinity_ends_the_wait_for_one_cpu

- id: io.readahead-refused
  summary: "The workload missed the page cache a thousand times and more, and each missed page was a block request of its own, though every backing device reads ahead: the program asked it not to."
  objectives: [latency, throughput]
  evidence:
    - {source: io.pagecache, mode: trace, stat: total, above: 1000}
    - {source: io.latency, mode: trace, stat: count, per: {source: io.pagecache, mode: trace, stat: total}, above: 0.5}
    - {setting: bdi.read_ahead_kb, above: 0, every: true}
  setting: bdi.read_ahead_kb
  mechanism: >-
    Readahead fetches the pages after the ones a sequential reader asked for, so
    the next read finds them cached. It is off for a file opened with
    posix_fadvise(POSIX_FADV_RANDOM) or madvise(MADV_RANDOM), and for a device whose
    filesystem's backing device has read_ahead_kb at 0; then every read the
    cache misses waits for the device.
  docs: block/queue-sysfs.rst
  expect: {source: io.latency, mode: trace, stat: count, per: {source: io.pagecache, mode: trace, stat: total}, goes: down}
  also:
    - {run: wall_ns, goes: down}
  scope: process
  change: >-
    in the program, drop posix_fadvise(fd, 0, 0, POSIX_FADV_RANDOM) or use
    POSIX_FADV_SEQUENTIAL for a file read in order; for the device,
    echo <KiB> > /sys/block/<dev>/queue/read_ahead_kb (machine, until reboot)
  caveats:
    - "Nothing read ahead is read off the block requests: one per page the cache missed, where readahead would have made one of many (8192 requests for 8192 misses under POSIX_FADV_RANDOM, 306 for 9728 without, docs/scenarios/advice.md). The requests are those submitted in the program's own context, which a sequential reader's are."
    - "A reader that is random for real gains nothing from readahead and pays for pages it never reads: the hint may be right."
    - "A file already in the page cache needs no readahead, and reads none: the evidence is only worth something on a cold cache."
  truth: advice_truth::readahead_refused_by_a_hint_returns_without_it

- id: bdi.readahead-off
  summary: "The workload missed the page cache a thousand times and more, and each missed page was a block request of its own: a backing device's readahead is off."
  objectives: [latency, throughput]
  evidence:
    - {source: io.pagecache, mode: trace, stat: total, above: 1000}
    - {source: io.latency, mode: trace, stat: count, per: {source: io.pagecache, mode: trace, stat: total}, above: 0.5}
    - {setting: bdi.read_ahead_kb, is: 0}
  setting: bdi.read_ahead_kb
  mechanism: >-
    A file's readahead is bounded by its filesystem's backing device
    (/sys/class/bdi): the block device's own for ext4 or xfs, one of its own
    for btrfs. At read_ahead_kb 0 readahead never runs for a file there, and
    every page a reader looks up is a read it waits for.
  docs: ABI/testing/sysfs-class-bdi
  expect: {source: io.latency, mode: trace, stat: count, per: {source: io.pagecache, mode: trace, stat: total}, goes: down}
  also:
    - {run: wall_ns, goes: down}
  scope: machine
  change: >-
    echo 128 > /sys/class/bdi/<bdi>/read_ahead_kb (until reboot): <bdi> is the
    instance the setting names; for a block device, also
    /sys/block/<dev>/queue/read_ahead_kb or blockdev --setra 256 /dev/<dev>, or a udev rule
  caveats:
    - "The rule holds when any backing device reads nothing ahead, not necessarily the one under the workload's files: the setting's instances name them."
    - "On btrfs the disk's queue/read_ahead_kb governs nothing a file reads: the filesystem's bdi does (btrfs-N). On an Arch guest, vda at 0 left btrfs reading 1546 pages ahead (docs/scenarios/advice.md)."
    - "A device set to 0 on purpose -- a database that does its own prefetching on direct I/O -- loses nothing to it."
  truth: advice_truth::a_device_s_readahead_set_again_reads_ahead

- id: mm.thp-defrag-stall
  summary: "Memory was compacted for huge pages the program never asked for: the machine's THP policy stalls every fault that wants one."
  objectives: [latency, tail]
  evidence:
    - {source: mem.compaction, mode: trace, target: system, stat: total, above: 10000000}
    - {setting: mm.thp.defrag, is: always}
    - {setting: process.madv_hugepage_mappings, is: 0}
  setting: mm.thp.defrag
  mechanism: >-
    With transparent_hugepage/defrag at always, a page fault that could be
    backed by a huge page and finds no free 2 MiB block stalls to compact
    memory -- migrating pages to make one -- whether or not the program asked
    for huge pages. At madvise, only memory madvised MADV_HUGEPAGE stalls; the
    rest takes small pages and leaves compaction to kcompactd.
  docs: admin-guide/mm/transhuge.rst
  expect: {source: mem.compaction, mode: trace, target: system, stat: total, goes: down}
  also:
    - {run: wall_ns, goes: down}
  scope: machine
  change: >-
    echo madvise > /sys/kernel/mm/transparent_hugepage/defrag (or defer+madvise)
    for the machine; for this program alone, prctl(PR_SET_THP_DISABLE) before it
    allocates, or MADV_NOHUGEPAGE on its large mappings
  caveats:
    - "mem.compaction is the machine's: compaction for another process in the window counts. The rule is for a machine the workload has to itself, or a window where nothing else allocates."
    - "Huge pages are not lost, only no longer waited for: khugepaged can still collapse the memory later, which a workload that lives long enough gets back."
    - "The program's madvised mappings are read when it starts; memory it madvises later is not in the evidence."
  truth: advice_truth::defrag_on_madvise_ends_the_compaction_stall


- id: tcp.unsent-backlog
  summary: "A connection held megabytes the program had written and the kernel had not sent: whatever it writes next waits behind all of them."
  objectives: [latency, tail]
  evidence:
    - {source: net.tcp.rtt, mode: "poll@100ms", attr: notsent_bytes, stat: max, above: 1048576}
    - {setting: net.ipv4.tcp_notsent_lowat, above: 1048576}
  setting: net.ipv4.tcp_notsent_lowat
  mechanism: >-
    A TCP socket is writable while its send buffer has room, and the buffer
    grows to tcp_wmem's maximum (4 MiB by default) whether the peer reads or
    not. When the peer is slower than the writer, the room fills with bytes
    that are not yet sent: a message written now is queued behind all of
    them, and the writer has no say in their order once they are in. With
    tcp_notsent_lowat set, write() and poll() wait while the unsent bytes are
    above it, so the queue the next message joins stays that short and the
    writer keeps the rest -- to drop, merge or reorder.
  docs: networking/ip-sysctl.rst
  expect: {source: net.tcp.rtt, mode: "poll@100ms", attr: notsent_bytes, stat: max, goes: down}
  scope: machine
  change: >-
    sysctl -w net.ipv4.tcp_notsent_lowat=131072 (until reboot; the network
    namespace's, so a container's own), or for the program's sockets alone,
    setsockopt(fd, IPPROTO_TCP, TCP_NOTSENT_LOWAT, ...) after it connects
  caveats:
    - "The bytes are not lost and the throughput is the peer's either way: the unsent bytes wait in the program instead of in the kernel. What gets shorter is the wait of what the program writes next, which only helps a program that has something more urgent to write, or that can drop what is stale."
    - "A socket that sets TCP_NOTSENT_LOWAT itself is governed by its own value, not the sysctl's: a backlog on such a socket is one the sysctl does not move."
    - "The sysctl belongs to the network namespace: a container reads and sets its own, and the host's says nothing of it."
    - "Polled every 100 ms: a backlog that built and drained between two polls is not seen."
  truth: advice_truth::a_low_unsent_mark_shortens_the_backlog

- id: irq.on-the-workload-cpus
  summary: "Interrupt handlers took a tenth and more of the run on the cpus the workload is pinned to, while the machine has others to take them."
  objectives: [latency, tail, throughput]
  evidence:
    - {source: sched.irq, mode: trace, target: system, attr: total_ns, stat: total, on: target_cpus, per: {run: wall_ns}, above: 0.1}
    - {setting: process.cpus_allowed_count, below_setting: cpu.online_count}
  setting: irq.smp_affinity_list
  mechanism: >-
    An interrupt runs on the cpu its affinity delivers it to, and its softirq
    -- a network card's receive processing -- on the same cpu after it,
    ahead of whatever thread was running there. A thread pinned to that cpu
    cannot be moved out of the way: every handler is time it does not run,
    which its cpu clock does not count and its wall clock does. An interrupt
    whose affinity leaves out the workload's cpus is handled elsewhere.
  docs: core-api/irq/irq-affinity.rst
  expect: {source: sched.irq, mode: trace, target: system, attr: total_ns, stat: total, on: target_cpus, per: {run: wall_ns}, goes: down}
  also:
    - {run: wall_ns, goes: down}
  scope: machine
  change: >-
    echo <cpus outside the workload's> > /proc/irq/<irq>/smp_affinity_list
    (until reboot) for each line sched.irq's hard rows name on the workload's
    cpus (`name`, `irq`); irqbalance moves them back unless told to ban those
    cpus (IRQBALANCE_BANNED_CPULIST), and isolcpus=managed_irq,<cpus> keeps a
    driver's own spread off them. Or pin the workload away from the
    interrupts' cpus instead (taskset)
  caveats:
    - "A driver that spreads its queues across the cpus itself (a multi-queue NVMe or virtio-blk, most network cards' managed vectors) refuses the write with EIO: those lines are moved only by isolcpus=managed_irq at boot, or by taking their cpus away from the workload."
    - "A network server's own receive interrupts on its own cpus are sometimes the point: the packet is processed where it is read, in a warm cache. Moving them away trades that for the time back."
    - "The interrupts are the machine's: any device's on those cpus counts, the workload's own included, and the run's hard rows say which they were."
    - "Interrupt time is measured by the irq tracepoints, so a kernel without them, or a cpu whose interrupts arrive faster than the drain reads them, leaves the share a lower bound."
  truth: advice_truth::interrupts_moved_off_the_pinned_cpu_give_it_back
