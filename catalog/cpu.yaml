- id: cpu.util
  family: cpu
  summary: "CPU utilization by state (user/sys/iowait/idle/steal)"
  unit: ratio
  backends:
    - {id: "fs:proc", requires: ["/proc/stat"], cost: low,
       targets: {system: native, cpu: native}}
    - {id: "fs:cgroup", requires: ["cgroup2:cpu.stat"], cost: free,
       targets: {cgroup: native, container: native}, filter_fields: [],
       degraded: "scoped to one cgroup: no per-cpu breakdown and no steal time"}
  modes: [poll, snapshot]
  emits: [timeline, raw, summary]
  targets: {system: native, cgroup: native, cpu: native, container: native}
  keys: [cgroup, cpu]
  filter_fields: [cpu]
  determinism: low

- id: cpu.pressure
  family: cpu
  summary: "PSI: CPU stall time"
  unit: ratio
  backends:
    - {id: "fs:proc", requires: ["/proc/pressure/cpu"], cost: free, targets: {system: native}}
    - {id: "fs:cgroup", requires: ["cgroup2:cpu.pressure"], cost: free, equivalent: true,
       targets: {cgroup: native, container: native}}
  modes: [poll, snapshot]
  emits: [timeline, raw, summary]
  targets: {system: native, cgroup: native, container: native}
  keys: [cgroup]
  filter_fields: []
  determinism: low
  caveats:
    - "Named as `mem.pressure` and `io.pressure` are: a poll reports
       `stall_ratio`, the `some` counter's increase over its own window, with
       `stalled_ns` and `interval_ns` beside it, and `full_stall_ratio` where
       the kernel writes a `full` line (at machine scope it always reads 0 for
       cpu). A snapshot observes no window and reports the kernel's decayed
       averages under their own names, `some_avg10` first."
    - "A poll's first read is its baseline and produces no event, so every
       share in the series covers a full interval."

- id: cpu.throttle
  family: cpu
  summary: "CFS cgroup throttling (nr_throttled, throttled_usec)"
  unit: ns
  backends:
    - {id: "fs:cgroup", requires: ["cgroup2:cpu.stat"], cost: free}
  modes: [poll, snapshot]
  emits: [timeline, raw, summary]
  targets: {cgroup: native}
  keys: [cgroup]
  filter_fields: []
  determinism: medium
  caveats:
    - "A throttled run is not comparable: the harness must invalidate it rather
       than average it in."

- id: cpu.flow
  family: cpu
  summary: "Exhaustive control flow (Intel PT / CoreSight ETM)"
  unit: count
  backends:
    - {id: "pmu:aux:intel_pt", requires: ["pmu:intel_pt"], cost: high}
    - {id: "pmu:aux:cs_etm", requires: ["pmu:cs_etm"], cost: high, equivalent: true}
  modes: [trace]
  emits: [raw, timeline]
  targets: {pid: native, tid: native, cpu: native, launch: native}
  keys: [task, cpu]
  filter_fields: [comm, cpu]
  determinism: high
  caveats:
    - "The kernel provides raw bytes; decoding (libipt, binary images, sideband)
       is a separate, late deliverable."
