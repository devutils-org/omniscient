# Family `cpu` — see CATALOG.md section 2.
# Every entry declares an ORDERED backend chain: the resolver keeps the first one
# viable on this machine and writes it into the resolved file.

- id: cpu.cycles
  family: cpu
  summary: "Unhalted CPU cycles"
  unit: count
  backends:
    - {id: "pmu", requires: ["pmu:PERF_COUNT_HW_CPU_CYCLES"], cost: free}
    - {id: "pmu:sw", requires: ["pmu:PERF_COUNT_SW_CPU_CLOCK"], cost: free,
       degraded: "CPU time, not cycles: blind to DVFS"}
  modes: [count, poll, sample]
  emits: [summary, timeline, rate, hist, topk, stack, raw]
  targets: {system: native, cgroup: native, pid: native, tid: native, cpu: native, launch: native, container: no}
  keys: [task, cgroup, cpu]
  filter_fields: [comm, cpu]
  determinism: medium
  caveats:
    - "Frequency-dependent: lock the governor or the measurement is not comparable."

- id: cpu.instructions
  family: cpu
  summary: "Retired instructions"
  unit: count
  backends:
    - {id: "pmu", requires: ["pmu:PERF_COUNT_HW_INSTRUCTIONS"], cost: free}
  modes: [count, poll, sample]
  emits: [summary, timeline, rate, hist, topk, stack, raw]
  targets: {system: native, cgroup: native, pid: native, tid: native, cpu: native, launch: native, container: no}
  keys: [task, cgroup, cpu]
  filter_fields: [comm, cpu]
  determinism: high
  caveats:
    - "The most stable metric of the core (typical CV < 0.1 %) but never bit-exact:
       interrupt skid, speculation, IRQs, SMT."
    - "Disabling SMT or pinning affinity moves the counter by 10-30 %."

- id: cpu.ipc
  family: cpu
  summary: "Instructions per cycle (derived)"
  unit: ratio
  primitive: false
  derived_from: [cpu.instructions, cpu.cycles]
  backends:
    - {id: "pmu", requires: ["pmu:PERF_COUNT_HW_INSTRUCTIONS", "pmu:PERF_COUNT_HW_CPU_CYCLES"], cost: free}
  modes: [count, poll]
  emits: [summary, timeline, raw]
  targets: {system: native, cgroup: native, pid: native, tid: native, cpu: native, launch: native, container: no}
  keys: [task, cgroup, cpu]
  filter_fields: [comm, cpu]
  determinism: medium
  caveats:
    - "A ratio, not an amount: a spin loop retires instructions at a high IPC
       while doing nothing. Read it beside `cpu.instructions`, never alone."
    - "Both counters must be read over the same window, which means one counter
       group; two separately scheduled counters give a ratio of two windows."

- id: cpu.branch_misses
  family: cpu
  summary: "Mispredicted branches"
  unit: count
  backends:
    - {id: "pmu", requires: ["pmu:PERF_COUNT_HW_BRANCH_MISSES"], cost: free}
  modes: [count, poll, sample]
  emits: [summary, timeline, rate, topk, stack, raw]
  targets: {system: native, cgroup: native, pid: native, tid: native, cpu: native, launch: native, container: no}
  keys: [task, cgroup, cpu]
  filter_fields: [comm, cpu]
  determinism: medium

- id: cpu.cache_misses
  family: cpu
  summary: "Last-level cache misses"
  unit: count
  backends:
    - {id: "pmu", requires: ["pmu:PERF_COUNT_HW_CACHE_MISSES"], cost: free}
  modes: [count, poll, sample]
  emits: [summary, timeline, rate, topk, stack, raw]
  targets: {system: native, cgroup: native, pid: native, tid: native, cpu: native, launch: native, container: no}
  keys: [task, cgroup, cpu]
  filter_fields: [comm, cpu]
  determinism: low

- id: cpu.topdown
  family: cpu
  summary: "Top-down Microarchitecture Analysis: front-end / back-end / bad-spec / retiring"
  unit: ratio
  backends:
    - {id: "pmu", requires: ["pmu:slots", "pmu:topdown-retiring", "pmu:topdown-bad-spec",
                             "pmu:topdown-fe-bound", "pmu:topdown-be-bound"], cost: low}
  modes: [count]
  emits: [summary, raw]
  targets: {system: native, cgroup: native, pid: native, tid: native, cpu: native, launch: native, container: no}
  keys: [task, cgroup, cpu]
  filter_fields: [comm, cpu]
  determinism: medium
  caveats:
    - "Heavily microarchitecture-dependent: map per CPU family, never hard-code
       event names. The five events are read from what the kernel publishes
       under /sys/bus/event_source/devices/cpu/events, so a machine either
       offers the method or is told which of them it is missing."
    - "Needs a pipeline that counts issue slots: Intel from Icelake, AMD from
       Zen 4. Nothing on older hardware measures the same thing, and nothing is
       substituted."
    - "Four fractions of one denominator, so they sum to 1. `accounted` carries
       that sum; anything but 1.0 means the five counters did not describe the
       same window, and the fractions are reported as counted rather than
       rescaled to hide it."
    - "`summary` follows `retiring`, the one of the four that is better when it
       is larger. The other three travel on the same event: read them with
       --emit raw."

- id: cpu.profile
  family: cpu
  summary: "On-CPU profile with call stacks"
  unit: count
  backends:
    - {id: "pmu", requires: ["pmu:PERF_COUNT_HW_CPU_CYCLES", "callchain"], cost: low}
    - {id: "pmu:sw", requires: ["pmu:PERF_COUNT_SW_CPU_CLOCK", "callchain"], cost: low,
       degraded: "time-based sampling: blind to phases running at reduced frequency"}
  modes: [sample]
  emits: [stack, topk, hist, raw]
  targets: {system: native, cgroup: native, pid: native, tid: native, cpu: native, launch: native, container: no}
  keys: [task, cgroup, cpu]
  filter_fields: [comm, cpu]
  determinism: low
  caveats:
    - "The stacks are only as good as the way they were unwound. `--stack auto`
       picks the best mode this machine and this target serve -- fp+leaf for a
       build with frame pointers, dwarf for one without -- and the notes say
       which, and why it passed over the others; dwarf copies 8 KiB of user
       stack with every sample. Where perf_event_paranoid refuses the kernel
       (2, the kernel's default) the stacks are user-only, and time the task
       spent in the kernel is not sampled at all."
    - "A time-based sample counts the time the task held its cpu, including the
       interrupts that ran on it meanwhile, and at high rates those interrupts
       are this profile's own. The kernel's own on-cpu figure leaves interrupt
       time out on a kernel built with IRQ_TIME_ACCOUNTING, so the two differ by
       exactly the time the task lost to interrupts: 0.7 % at 997 Hz and 28 % at
       100 kHz on the machine this was measured on."

- id: cpu.oncpu_time
  family: cpu
  summary: "CPU time actually consumed"
  unit: ns
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:sched_switch", "kernel>=5.8"], cost: low}
    - {id: "bpf:tp", requires: ["tracepoint:sched:sched_switch", "bpf"], cost: low, equivalent: true}
    - {id: "fs:cgroup", requires: ["cgroup2:cpu.stat"], cost: free, modes: [poll],
       targets: {cgroup: native, container: native}, filter_fields: [],
       degraded: "aggregated per cgroup, no stacks and no per-thread attribution"}
    - {id: "fs:proc", requires: ["/proc/[pid]/stat"], modes: [poll], cost: free,
       targets: {pid: native, tid: native, launch: native},
       degraded: "tick granularity, no per-site attribution"}
  modes: [trace, poll]
  emits: [summary, timeline, hist, rate]
  targets: {system: native, cgroup: native, pid: native, tid: native, launch: native, container: native}
  keys: [task, cgroup]
  filter_fields: [comm]
  determinism: low

- id: cpu.context_switches
  family: cpu
  summary: "Context switches"
  unit: count
  backends:
    - {id: "pmu:sw", requires: ["pmu:PERF_COUNT_SW_CONTEXT_SWITCHES"], cost: free}
  modes: [count, poll, sample]
  emits: [summary, timeline, rate, topk, stack, raw]
  targets: {system: native, cgroup: native, pid: native, tid: native, cpu: native, launch: native, container: no}
  keys: [task, cgroup, cpu]
  filter_fields: [comm, cpu]
  determinism: low
  caveats:
    - "Counts switches away from the task, matching the kernel's own voluntary
       plus nonvoluntary counters; it says nothing about what ran instead, nor
       about how long the task stayed off the cpu."

- id: cpu.migrations
  family: cpu
  summary: "Cross-core migrations"
  unit: count
  backends:
    - {id: "pmu:sw", requires: ["pmu:PERF_COUNT_SW_CPU_MIGRATIONS"], cost: free}
  modes: [count, poll]
  emits: [summary, timeline, rate, raw]
  targets: {system: native, cgroup: native, pid: native, tid: native, launch: native, container: no}
  keys: [task, cgroup]
  filter_fields: [comm]
  determinism: low

- id: cpu.util
  family: cpu
  summary: "CPU utilization by state (user/sys/iowait/idle/steal)"
  unit: ratio
  backends:
    - {id: "fs:proc", requires: ["/proc/stat"], cost: free,
       targets: {system: native, cpu: native}}
    - {id: "fs:cgroup", requires: ["cgroup2:cpu.stat"], cost: free,
       targets: {cgroup: native, container: native}, filter_fields: [],
       degraded: "scoped to one cgroup: no per-cpu breakdown and no steal time"}
  modes: [poll, snapshot]
  emits: [timeline, raw, summary]
  targets: {system: native, cgroup: native, cpu: native, container: native}
  keys: [cgroup, cpu]
  filter_fields: [cpu]
  determinism: low

- id: cpu.pressure
  family: cpu
  summary: "PSI: CPU stall time"
  unit: ratio
  backends:
    - {id: "fs:proc", requires: ["/proc/pressure/cpu"], cost: free, targets: {system: native}}
    - {id: "fs:cgroup", requires: ["cgroup2:cpu.pressure"], cost: free, equivalent: true,
       targets: {cgroup: native, container: native}}
  modes: [poll, snapshot]
  emits: [timeline, raw, summary]
  targets: {system: native, cgroup: native, container: native}
  keys: [cgroup]
  filter_fields: []
  determinism: low

- id: cpu.throttle
  family: cpu
  summary: "CFS cgroup throttling (nr_throttled, throttled_usec)"
  unit: ns
  backends:
    - {id: "fs:cgroup", requires: ["cgroup2:cpu.stat"], cost: free}
  modes: [poll, snapshot]
  emits: [timeline, raw, summary]
  targets: {cgroup: native, container: no}
  keys: [cgroup]
  filter_fields: []
  determinism: medium
  caveats:
    - "A throttled run is not comparable: the harness must invalidate it rather
       than average it in."

- id: cpu.flow
  family: cpu
  summary: "Exhaustive control flow (Intel PT / CoreSight ETM)"
  unit: count
  backends:
    - {id: "pmu:aux:intel_pt", requires: ["pmu:intel_pt"], cost: high}
    - {id: "pmu:aux:cs_etm", requires: ["pmu:cs_etm"], cost: high, equivalent: true}
  modes: [trace]
  emits: [raw, timeline]
  targets: {pid: native, tid: native, cpu: native, launch: native}
  keys: [task, cpu]
  filter_fields: [comm, cpu]
  determinism: high
  caveats:
    - "The kernel provides raw bytes; decoding (libipt, binary images, sideband)
       is a separate, late deliverable."
