# Family `cpu` — see CATALOG.md section 2.
# Every entry declares an ORDERED backend chain: the resolver keeps the first one
# viable on this machine and writes it into the resolved file.

- id: cpu.cycles
  family: cpu
  summary: "Unhalted CPU cycles"
  unit: count
  backends:
    - {id: "pmu", requires: ["pmu:PERF_COUNT_HW_CPU_CYCLES"], cost: low}
    - {id: "pmu:sw", requires: ["pmu:PERF_COUNT_SW_CPU_CLOCK"], cost: low, unit: ns,
       degraded: "CPU time, not cycles: blind to DVFS"}
  modes: [count, poll, sample]
  emits: [summary, timeline, rate, hist, topk, stack, raw]
  targets: {system: native, cgroup: native, pid: native, tid: native, cpu: native, launch: native}
  keys: [task, cgroup, cpu]
  filter_fields: [comm, cpu]
  determinism: medium
  caveats:
    - "Frequency-dependent: lock the governor or the measurement is not comparable."
    - "`-m sample@<hz> -e stack` is `perf record`'s default, a cycles profile:
       one sample every so many cycles -- the cpu's highest frequency over the
       rate asked for, so a sample per fixed number of cycles whatever the
       clock does, and fewer samples a second than asked while the clock is
       below its highest. A share of cycles, not of time: `cpu.profile` is the
       on-cpu time profile. Every counting source of this family samples the
       same way on its own counter (`perf record -e <event>`), in the kernel's
       frequency mode where a fixed period has no natural unit, each sample
       weighing one."

- id: cpu.instructions
  family: cpu
  summary: "Retired instructions"
  unit: count
  backends:
    - {id: "pmu", requires: ["pmu:PERF_COUNT_HW_INSTRUCTIONS"], cost: low}
  modes: [count, poll, sample]
  emits: [summary, timeline, rate, hist, topk, stack, raw]
  targets: {system: native, cgroup: native, pid: native, tid: native, cpu: native, launch: native}
  keys: [task, cgroup, cpu]
  filter_fields: [comm, cpu]
  determinism: high
  caveats:
    - "The most stable metric of the core (typical CV < 0.1 %) but never bit-exact:
       interrupt skid, speculation, IRQs, SMT."
    - "Disabling SMT or pinning affinity moves the counter by 10-30 %."

- id: cpu.ipc
  family: cpu
  summary: "Instructions per cycle (derived)"
  unit: ratio
  primitive: false
  derived_from: [cpu.instructions, cpu.cycles]
  backends:
    - {id: "pmu", requires: ["pmu:PERF_COUNT_HW_INSTRUCTIONS", "pmu:PERF_COUNT_HW_CPU_CYCLES"], cost: low}
  modes: [count, poll]
  emits: [summary, timeline, raw]
  targets: {system: native, cgroup: native, pid: native, tid: native, cpu: native, launch: native}
  keys: [task, cgroup, cpu]
  filter_fields: [comm, cpu]
  determinism: medium
  caveats:
    - "A ratio, not an amount: a spin loop retires instructions at a high IPC
       while doing nothing. Read it beside `cpu.instructions`, never alone."
    - "Both counters must be read over the same window, which means one counter
       group; two separately scheduled counters give a ratio of two windows."

