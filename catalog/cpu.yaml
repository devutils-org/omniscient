- id: cpu.topdown
  family: cpu
  summary: "Top-down Microarchitecture Analysis: front-end / back-end / bad-spec / retiring"
  unit: ratio
  backends:
    - {id: "pmu", requires: ["pmu:slots", "pmu:topdown-retiring", "pmu:topdown-bad-spec",
                             "pmu:topdown-fe-bound", "pmu:topdown-be-bound"], cost: low}
  modes: [count]
  emits: [summary, raw]
  targets: {system: native, cgroup: native, pid: native, tid: native, cpu: native, launch: native}
  keys: [task, cgroup, cpu]
  filter_fields: [comm, cpu]
  determinism: medium
  caveats:
    - "Heavily microarchitecture-dependent: map per CPU family, never hard-code
       event names. The five events are read from what the kernel publishes
       under /sys/bus/event_source/devices/cpu/events, so a machine either
       offers the method or is told which of them it is missing."
    - "Needs a pipeline that counts issue slots: Intel from Icelake, AMD from
       Zen 4. Nothing on older hardware measures the same thing, and nothing is
       substituted."
    - "Four fractions of one denominator, so they sum to 1. `accounted` carries
       that sum; anything but 1.0 means the five counters did not describe the
       same window, and the fractions are reported as counted rather than
       rescaled to hide it."
    - "`summary` follows `retiring`, the one of the four that is better when it
       is larger. The other three travel on the same event: read them with
       --emit raw."

- id: cpu.profile
  family: cpu
  summary: "On-CPU profile with call stacks"
  unit: count
  backends:
    - {id: "pmu", requires: ["pmu:PERF_COUNT_HW_CPU_CYCLES", "callchain"], cost: low}
    - {id: "pmu:sw", requires: ["pmu:PERF_COUNT_SW_CPU_CLOCK", "callchain"], cost: med,
       degraded: "time-based sampling: blind to phases running at reduced frequency"}
  modes: [sample]
  emits: [stack, topk, hist, raw]
  targets: {system: native, cgroup: native, pid: native, tid: native, cpu: native, launch: native}
  keys: [task, cgroup, cpu]
  filter_fields: [comm, cpu]
  determinism: low
  caveats:
    - "The stacks are only as good as the way they were unwound. `--stack auto`
       picks the best mode this machine and this target serve -- fp+leaf for a
       build with frame pointers, dwarf for one without -- and the notes say
       which, and why it passed over the others; dwarf copies 8 KiB of user
       stack with every sample. Where perf_event_paranoid refuses the kernel
       (2, the kernel's default) the stacks are user-only, and time the task
       spent in the kernel is not sampled at all."
    - "Each sample carries its thread as the `task` key, its process as `pid`
       and the thread's name as `comm`, read from `/proc` at a bounded rate.
       A cycles profile is `cpu.cycles -m sample -e stack`; the `pmu` row
       here has no collector, because a sample of this source is a period of
       on-cpu time that `omn latency` and `omn diff` read as nanoseconds."
    - "A time-based sample counts the time the task held its cpu, including the
       interrupts that ran on it meanwhile, and at high rates those interrupts
       are this profile's own. The kernel's own on-cpu figure leaves interrupt
       time out on a kernel built with IRQ_TIME_ACCOUNTING, so the two differ by
       exactly the time the task lost to interrupts: 0.7 % at 997 Hz and 28 % at
       100 kHz on the machine this was measured on."

- id: cpu.oncpu_time
  family: cpu
  summary: "CPU time actually consumed"
  unit: ns
  backends:
    # The `sched_stat_runtime` program: each thread's increments of the
    # scheduler's own `sum_exec_runtime` added up in the kernel, drained every
    # poll.
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:sched_stat_runtime(task_struct *, u64)", "raw_tracepoint:sched_process_fork(task_struct *, task_struct *)", "raw_tracepoint:sched_process_free(task_struct *)", "kernel>=6.1"],
       cost: low, modes: [poll], drained: true,
       targets: {system: native, cgroup: native, pid: native, tid: native, launch: native}}
    - {id: "bpf:tp", requires: ["tracepoint:sched:sched_switch", "bpf"], cost: low, equivalent: true}
    - {id: "fs:cgroup", requires: ["cgroup2:cpu.stat"], cost: free, modes: [poll],
       targets: {cgroup: native, container: native}, filter_fields: [],
       degraded: "aggregated per cgroup, no stacks and no per-thread attribution"}
    - {id: "fs:proc", requires: ["/proc/[pid]/stat"], modes: [poll], cost: free,
       targets: {pid: native, tid: native, launch: native},
       degraded: "tick granularity, no per-site attribution"}
    # `perf stat`'s task-clock: the kernel's software counter over the window,
    # the one backend that counts a launched program without tracefs.
    - {id: "pmu:sw", requires: ["pmu:PERF_COUNT_SW_TASK_CLOCK"], cost: low, modes: [count],
       targets: {pid: native, tid: native, cgroup: native, launch: native},
       degraded: "the target's threads in one total, read once when the window closes: no series and no per-thread split"}
  modes: [trace, poll, count]
  emits: [summary, timeline, hist, rate, raw]
  targets: {system: native, cgroup: native, pid: native, tid: native, launch: native, container: native}
  keys: [task, cgroup]
  filter_fields: [comm]
  determinism: low
  caveats:
    - "Through `bpf:raw_tp` each thread is its own series, keyed `task:<tid>`
       with its process as `pid`, in the scheduler's own nanoseconds
       (`se.sum_exec_runtime`, the first field of `/proc/<tid>/schedstat`).
       Through `fs:proc` one series is the process's total, `task:<pid>`, in
       ticks of 10 ms. Summing the threads gives the process."
    - "Through `bpf:raw_tp` a running thread is credited at each scheduler
       tick and when it leaves the cpu, so each edge of the window is at most
       one tick off: the first increment after the attach can reach back to
       the tick before it, and a thread on a cpu at the end is short by the
       time since its last tick."
    - "Through `fs:proc` the series is the process alone: `utime` and `stime`
       in `/proc/<pid>/stat` are its own threads', so what a launched program
       starts -- a shell's commands, a build driver's compilers -- is in no
       reading; their time reaches the parent's `cutime` only as it waits for
       them, and this backend does not read it. And a launched program is
       reaped before the run's closing read, so its cpu since the last poll,
       up to one interval, is in no reading either; the run counts it in its
       losses, as one failed read with that reason. The program's exit in the
       results carries the exact total, `cpu_ns`, from the reap (`wait4`),
       its waited-for children included."
    - "`-m count` is `perf stat`'s task-clock, through `pmu:sw`: the
       nanoseconds the target's threads held a cpu by the scheduler's clock,
       one total under `count` (`counter=task_clock_ns`), inherited by the
       children a launched program starts, as `perf stat` counts them."

- id: cpu.context_switches
  family: cpu
  summary: "Context switches"
  unit: count
  backends:
    - {id: "pmu:sw", requires: ["pmu:PERF_COUNT_SW_CONTEXT_SWITCHES"], cost: low}
  modes: [count, poll, sample]
  emits: [summary, timeline, rate, topk, stack, raw]
  targets: {system: native, cgroup: native, pid: native, tid: native, cpu: native, launch: native}
  keys: [task, cgroup, cpu]
  filter_fields: [comm, cpu]
  determinism: low
  caveats:
    - "Counts switches away from the task, matching the kernel's own voluntary
       plus nonvoluntary counters; it says nothing about what ran instead, nor
       about how long the task stayed off the cpu."

