- id: cpu.branches
  family: cpu
  summary: "Retired branch instructions"
  unit: count
  backends:
    - {id: "pmu", requires: ["pmu:PERF_COUNT_HW_BRANCH_INSTRUCTIONS"], cost: low}
  modes: [count, poll, sample]
  emits: [summary, timeline, rate, topk, stack, raw]
  targets: {system: native, cgroup: native, pid: native, tid: native, cpu: native, launch: native}
  keys: [task, cgroup, cpu]
  filter_fields: [comm, cpu]
  determinism: high
  caveats:
    - "The denominator of a branch-miss ratio: `cpu.branch_misses` over this,
       read over the same window, is what `perf stat` prints as the share of
       all branches missed."

