  family: cpu
  summary: "Cross-core migrations"
  unit: count
  backends:
    - {id: "pmu:sw", requires: ["pmu:PERF_COUNT_SW_CPU_MIGRATIONS"], cost: low}
  modes: [count, poll]
  emits: [summary, timeline, rate, raw]
  targets: {system: native, cgroup: native, pid: native, tid: native, launch: native}
