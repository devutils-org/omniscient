# Family `proc` (processes and syscalls) — see CATALOG.md section 9.

- id: proc.syscall
  family: proc
  summary: "Per-syscall latency and count"
  unit: ns
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:sys_enter(pt_regs *, long int)", "raw_tracepoint:sys_exit(pt_regs *, long int)", "kernel>=5.8"], cost: extreme, drained: true,
       filter_in_program: [syscall]}
    - {id: "bpf:tp", requires: ["tracepoint:raw_syscalls:sys_enter", "tracepoint:raw_syscalls:sys_exit", "bpf"], cost: extreme, equivalent: true, drained: true}
  modes: [trace, count]
  emits: [hist, topk, rate, raw, summary]
  targets: {pid: native, tid: native, cgroup: bpf_only, launch: native, system: native}
  keys: [task, syscall, comm]
  filter_fields: [comm, syscall, pid, errors]
  determinism: low
  caveats:
    - "An event is one bucket of one window, and it is stamped at the moment the
       window's first one began rather than at the drain that read it. A join
       that *opens* on this source would otherwise open at the window's close,
       and everything that happened in the same window as the first would fall
       outside the state. `window_ns` beside the value says how wide the window
       was."
    - "raw_syscalls fires on everything: aggregate in the kernel, or filter by
       syscall number inside the eBPF program."
    - "Every row carries its task, its syscall and the task's name when the call
       returned, so `-k syscall` is one run's `strace -c` table and `-k comm`
       the bpftrace tools' per-name one. A task that renames itself
       (`prctl(PR_SET_NAME)`) is counted under each name for the calls it made
       with it."
    - "`errors` on each row is how many of its calls returned an errno (a value
       in `[-4095, -1]`), `strace -c`'s `errors` column. It is per row (`-e
       raw`); no aggregating emit sums it yet."

- id: proc.calls
  family: proc
  summary: "One record per syscall: when, how long, what it returned, and openat's path"
  unit: ns
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:sys_enter(pt_regs *, long int)", "raw_tracepoint:sys_exit(pt_regs *, long int)", "kernel>=5.8"], cost: extreme,
       filter_in_program: [syscall]}
  modes: [trace]
  emits: [raw, timeline, hist, summary, topk]
  targets: {pid: native, tid: native, cgroup: bpf_only, launch: native, system: native}
  keys: [task, syscall, comm]
  filter_fields: [comm, syscall, pid, tid, ret, errno, error, path, fd, lat_ns]
  determinism: low
  caveats:
    - "Each call that returns is one event, stamped where it began: `lat_ns`, the
       raw `ret`, `errno` (the error a return in `[-4095, -1]` carries, zero
       otherwise), `error`, the task, its name and the syscall -- the line
       `strace -T` and `perf trace` print. `openat` also carries `path`, read out
       of the caller's memory when the call returns, up to 127 bytes, and `fd`
       when it succeeded: `opensnoop`'s line. `proc.syscall` is the cheap
       aggregate of the same calls."
    - "Every call is a ring write, so a target making hundreds of thousands of
       calls a second fills the ring and the program counts what it could not
       publish. A predicate naming one syscall (`syscall == \"openat\"`) is
       pushed into the program, which then records nothing else."
    - "A call the run never saw begin -- the thread was already inside it at the
       attach -- is in no record, and one still running at the end is said, not
       recorded."

- id: proc.exec
  family: proc
  summary: "Process execution events"
  unit: count
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:sched_process_exec(task_struct *, pid_t, linux_binprm *)", "kernel>=5.8"], cost: low}
    - {id: "bpf:tp", requires: ["tracepoint:sched:sched_process_exec", "bpf"], cost: low, equivalent: true}
  modes: [trace]
  emits: [raw, timeline, topk, summary]
  targets: {system: native, cgroup: bpf_only, pid: native, launch: native}
  keys: [task, comm]
  filter_fields: [comm, filename, pid, ppid]
  determinism: medium
  caveats:
    - "On a process or a launched program, the execs of it and of its
       descendants: the program reports the machine's, each with its parent
       (`ppid`, read in the kernel at the exec), and the run keeps those whose
       parent is the process or a descendant it has seen. A descendant that
       forked without exec'ing (a subshell) is found by walking `/proc`'s
       parents at the drain, so one that had already exited by then is not,
       and its child's execs are not kept."


- id: proc.exit
  family: proc
  summary: "Process exit events with exit code"
  unit: count
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:sched_process_exit(task_struct *, bool)|(task_struct *)", "kernel>=5.8"], cost: low}
    - {id: "bpf:tp", requires: ["tracepoint:sched:sched_process_exit", "bpf"], cost: low, equivalent: true}
  modes: [trace]
  emits: [raw, timeline, topk, summary]
  targets: {system: native, cgroup: bpf_only}
  keys: [task, comm]
  filter_fields: [comm, code, group_dead]
  determinism: medium
  caveats:
    - "The tracepoint fires once per thread, so a count of these events is a count of
       threads. `--filter 'group_dead == 1'` keeps one event per process, the last of
       its threads to leave."

- id: proc.fd
  family: proc
  summary: "Open file descriptors against the limit"
  unit: count
  backends:
    - {id: "fs:proc", requires: ["/proc/[pid]/fd"], cost: low}
  modes: [poll, snapshot]
  emits: [timeline, raw, summary]
  targets: {pid: native, launch: native}
  keys: [task, proc]
  filter_fields: [comm]
  determinism: medium
  caveats:
    - "The count alone says nothing: 900 open descriptors is comfortable against
       a limit of 524288 and an outage against a limit of 1024. The soft limit
       and the remaining headroom are reported alongside it."
    - "There is no cheap count. `FDSize` in `status` is the size of the
       allocated table rounded up to a power of two, not the number in use, so
       the directory is walked and the cost is one entry's work per open
       descriptor."
    - "Reading another process's table does not include the reader's own
       handle; reading one's own does. The collector accounts for which it is
       measuring, and getting that wrong is an off-by-one in either direction."
    - "One event per process, keyed by task and by proc (the pid namespace and
       the pid inside it, so a join can tell two containers' pid 1 apart). The
       descriptors behind the count are not enumerated -- that is one readlink
       per open descriptor, which is the cost the caveat above refuses -- so
       there is no file key here to join a descriptor to whatever else touched
       it."


- id: proc.threads
  family: proc
  summary: "Thread count"
  unit: count
  backends:
    - {id: "fs:proc", requires: ["/proc/[pid]/status"], cost: low}
  modes: [poll, snapshot]
  emits: [timeline, raw, summary]
  targets: {pid: native, launch: native}
  keys: [task, proc]
  filter_fields: [comm]
  determinism: medium
  caveats:
    - "A thread appears in procfs once it is running, not once the call that
       created it returns. A poll taken immediately after a program starts its
       workers will see fewer than it started."


- id: proc.tasks
  family: proc
  summary: "The machine's processes, or every thread of one, as top and ps list them"
  unit: ratio
  backends:
    - {id: "fs:proc", requires: ["/proc/[pid]/stat"], cost: low}
  modes: [poll, snapshot]
  emits: [raw, timeline, summary]
  targets: {system: native, pid: native, tid: native, launch: native}
  keys: [task, comm]
  filter_fields: [comm, pid, tid, ppid, state, uid, threads, rss_bytes, busy]
  determinism: low
  caveats:
    - "One event per process of the machine (`--system`), or per thread of a
       process (`--pid`, a launched program), each poll; every event of a poll
       carries the poll's one timestamp. Each carries `pid`, `tid`, `ppid`,
       `comm`, `state`, `uid`, `threads`, `rss_bytes` (from `statm`, as `top` reads it), `vsz_bytes`, `cpu_ns`,
       `utime_ns`, `stime_ns`, `nice`, `priority`, `minflt`, `majflt`, `cpu` (the
       one it last ran on) and `age_ns`."
    - "The value, `busy`, is the share of one cpu the task ran over the interval
       since the previous poll: `top`'s `%CPU` over a hundred, so a process of
       four spinning threads reads 4. A task first seen in a poll has no
       previous reading and its share is over its whole life instead, `ps`'s
       `%CPU`; `since` on the event says which (`poll` or `start`)."
    - "`utime` and `stime` count clock ticks (10 ms on most kernels), so a share
       is good to one tick over its interval: one per cent of a one-second poll.
       A task that lived between two polls is in neither."
    - "A process's line is its threads' sum; a thread's is its own. A process
       that leaves between the listing and its read is in no event and is not a
       loss: it is not on the machine any more."


- id: proc.signals
  family: proc
  summary: "Signals delivered"
  unit: count
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:signal_generate(int, kernel_siginfo *, task_struct *, int, int)", "kernel>=5.8"], cost: low}
    - {id: "bpf:tp", requires: ["tracepoint:signal:signal_generate", "bpf"], cost: low, equivalent: true}
  modes: [trace, count]
  emits: [raw, topk, rate, summary]
  targets: {pid: bpf_only, system: native, cgroup: bpf_only}
  keys: [task, comm]
  filter_fields: [comm, sig, pid, sender_comm, sender_pid]
  determinism: medium
  caveats:
    - "`comm` is the task the signal is for; `sender_pid`, `sender_tid` and
       `sender_comm` are the task that was running when it was generated, which
       is the sender for a `kill` and whatever was interrupted for a signal the
       kernel raised itself (a timer, a fault, a dying child)."

# The family's default: what `omn trace proc -- PROGRAM` composes. One band:
# `proc.syscall` declares `extreme`, beyond any band. See docs/lazy.md.
- default:
    family: proc
    question: "How many threads and open files does the program hold?"
    low:
      - {source: proc.threads, mode: "poll@100ms", emit: [timeline, summary], label: "threads"}
      - {source: proc.fd, mode: "poll@100ms", emit: [summary], label: "open files"}
