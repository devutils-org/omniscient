  scope: cgroup
  cgroup: memory.max
  mechanism: "The cgroup's hard memory limit: past it, its own OOM killer runs."
  docs: admin-guide/cgroup-v2.rst
  bears_on: [mem.oom, mem.cgroup]

- id: cgroup.memory.high
  scope: cgroup
  cgroup: memory.high
  mechanism: "The cgroup's throttling limit: past it, its tasks are made to reclaim and slowed, and nothing is killed."
  docs: admin-guide/cgroup-v2.rst
  bears_on: [mem.oom, mem.pressure, mem.cgroup]

- id: cgroup.memory.low
  scope: cgroup
  cgroup: memory.low
  mechanism: "The memory reclaim leaves the cgroup unless nothing else can be taken."
  docs: admin-guide/cgroup-v2.rst
  bears_on: [mem.reclaim, mem.pressure]

- id: cgroup.memory.swap.max
  scope: cgroup
  cgroup: memory.swap.max
  mechanism: "How much swap the cgroup may use."
  docs: admin-guide/cgroup-v2.rst
  bears_on: [mem.swap, mem.oom]

- id: cgroup.memory.oom.group
  scope: cgroup
  cgroup: memory.oom.group
  mechanism: "Whether an OOM kill in the cgroup kills every task in it rather than one."
  docs: admin-guide/cgroup-v2.rst
  bears_on: [mem.oom]

- id: cgroup.cpu.max
  scope: cgroup
  cgroup: cpu.max
  mechanism: "The cgroup's cpu quota and period: past the quota, its tasks wait for the next period."
  docs: admin-guide/cgroup-v2.rst
  bears_on: [cpu.throttle, sched.runqlat]

- id: cgroup.cpu.weight
  scope: cgroup
  cgroup: cpu.weight
  mechanism: "The cgroup's share of cpu against its siblings when they compete."
  docs: admin-guide/cgroup-v2.rst
  bears_on: [sched.runqlat]

- id: cgroup.cpuset.cpus.effective
  scope: cgroup
  cgroup: cpuset.cpus.effective
  mechanism: "The cpus the cgroup's tasks may run on, after every ancestor's restriction."
  docs: admin-guide/cgroup-v2.rst
  bears_on: [sched.runqlat]

- id: cgroup.io.max
  scope: cgroup
  cgroup: io.max
  mechanism: "The cgroup's I/O limits, per device."
  docs: admin-guide/cgroup-v2.rst
  bears_on: [io.latency]

- id: cgroup.pids.max
  scope: cgroup
  cgroup: pids.max
  mechanism: "How many tasks the cgroup may hold: past it fork fails."
  docs: admin-guide/cgroup-v2.rst
  bears_on: [proc.exec]
