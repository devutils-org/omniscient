# Family `net` — see CATALOG.md section 5.
# The key that crosses the whole stack is sock:cookie (bpf_get_socket_cookie),
# not the PID: on receive, processing happens in softirq, outside any process
# context. bpf_sk_storage carries keys along the socket.

- id: net.tcp.connect
  family: net
  summary: "TCP connection setup latency"
  unit: ns
  backends:
    # Opened where the caller sends the SYN, closed where the kernel learns
    # the answer: `tcp_finish_connect` for a SYN-ACK, `tcp_done_with_error`
    # for a RST or a timeout, the connect call's own return for a failure
    # before any packet left. The close runs in softirq, so the stamp carries
    # the caller. `tcp_done` beside `tcp_done_with_error`, for a kernel that
    # inlined the second into its callers (a clang build with link-time
    # optimisation): it reads the errno out of `sk_err`.
    - {id: "bpf:fentry", requires: ["btf", "bpf", "fentry:tcp_v4_connect(sock *, sockaddr_unsized *, int)|(sock *, sockaddr *, int)", "fentry:tcp_finish_connect", "fentry:tcp_done_with_error", "fentry:tcp_done"], cost: low}
    - {id: "bpf:kprobe", requires: ["kprobe", "bpf"], cost: low, degraded: "no BTF: struct offsets are not portable"}
  modes: [trace]
  emits: [hist, topk, raw, summary]
  targets: {pid: native, tid: native, cgroup: bpf_only, launch: native, container: bpf_only, system: native}
  keys: [sock, task]
  filter_fields: [comm, daddr, dport, family, outcome]
  determinism: low
  caveats:
    - "Attaching the trampolines costs about 65 ms, paid once per run whatever
       the run sees, and on a short run it is most of what the run cost: the
       bench measured 68 ms with no connection."
    - "Every handshake ends established, refused or failed, and each outcome
       is its own latency: a refusal in 30 us is not a fast connection."
    - "A SYN the peer dropped is retransmitted after the kernel's initial RTO,
       one second, so a handshake near 1 s is a lost SYN rather than a slow
       peer."

- id: net.tcp.accept
  family: net
  summary: "Connections a server accepted, with the listener's queue"
  unit: count
  backends:
    # The exit of `inet_csk_accept`, in the accepting task: the listener is
    # its first argument and the accepted socket its return value.
    - {id: "bpf:fentry", requires: ["btf", "bpf", "fentry:inet_csk_accept(sock *, proto_accept_arg *)|(sock *, int, int *, bool)"], cost: low}
  modes: [trace, count]
  emits: [rate, topk, raw, summary]
  targets: {pid: native, launch: native, system: native}
  keys: [sock, task]
  filter_fields: [comm, pid, saddr, sport, daddr, dport, family, backlog]
  determinism: low
  caveats:
    - "What `tcpaccept` prints: one event per accepted connection, keyed by
       the accepted socket's cookie (the key of `net.tcp.lifetime`,
       `net.tcp.rtt` and `net.sockets`), with the accepting task, both ends,
       and `backlog`, the listener's queue after this accept took one off it,
       beside `max_backlog`, the bound `listen` gave it. `tcpaccept`'s `BL`
       reads the accepted socket instead, which copied the listener's queue
       when its SYN arrived: six queued connections accepted in turn are
       `5` to `0` here and `0/16` to `5/16` there."
    - "A --pid or launched target keeps the accepts of that one process, not
       of its children."
    - "An accept that failed or would have blocked returned no socket and is
       no event."

- id: net.tcp.lifetime
  family: net
  summary: "Connection duration and volume"
  unit: ns
  backends:
    - id: "bpf:raw_tp"
      requires: ["bpf", "btf", "raw_tracepoint:inet_sock_set_state(sock *, int, int)", "kernel>=5.8"]
      join: {key: "sock:cookie", match: eq, ttl: 300s}
      cost: low
    - id: "bpf:tp"
      requires: ["tracepoint:sock:inet_sock_set_state", "bpf"]
      join: {key: "sock:cookie", match: eq, ttl: 300s}
      cost: low
      equivalent: true
  modes: [trace]
  emits: [hist, topk, raw, timeline, summary]
  targets: {system: native, pid: native, launch: native}
  keys: [sock, task]
  filter_fields: [comm, saddr, sport, daddr, dport, family, cookie, attributed]
  determinism: low
  caveats:
    - "A connection belongs to the process that connected it, or that closed
       it first (`SYN_SENT`, `FIN_WAIT1`, `LAST_ACK`, the transitions a
       process makes itself), as `tcplife` attributes it: `attributed` is
       `owner`. One no process acted on -- a reset, a timer -- carries the
       task current at its close, `attributed` `at_close`."
    - "A --pid or launched target keeps the connections of its process tree:
       its descendants are followed through /proc at each drain (20 ms), and
       a child that exited before it was ever seen is counted as a loss, not
       placed in the tree or out of it. So is an `at_close` connection: the
       task its close interrupted says nothing about who held it, so it is
       neither kept nor left out as another process's."

- id: net.tcp.rtt
  family: net
  summary: "RTT, congestion window and congestion state"
  unit: ns
  backends:
    - {id: "netlink", requires: ["sock_diag"], cost: med}
    - {id: "bpf:fentry", requires: ["btf", "bpf", "fentry:tcp_rcv_established"], cost: med, equivalent: true}
  modes: [poll, trace]
  emits: [timeline, hist, raw, summary]
  targets: {pid: native, system: native, cgroup: bpf_only}
  keys: [sock, task]
  filter_fields: [daddr, dport, saddr, sport]
  determinism: low
  caveats:
    - "Only an established connection has a round-trip estimate. Listening and
       closing sockets report zero, and reporting that as a measured latency of
       zero would be a lie with a number attached, so they are left out."
    - "This is the kernel's smoothed estimate, not a measured packet round trip:
       it is what the stack currently believes about the path, which is what
       drives its own decisions."
    - "Polling sees the connections alive at each tick. One opened and closed
       between two ticks is never seen -- a property of polling, not a loss."
    - "Beside the round trip, each event carries the rest of `tcp_info` that
       `ss -ti` prints, under names that carry their unit: `rto_ns`,
       `min_rtt_ns`, `busy_ns`, `pacing_rate_bytes_per_s` and
       `delivery_rate_bytes_per_s` (bytes, where `ss` prints bits),
       `bytes_acked`, `bytes_received`, `bytes_sent`, `unacked`, `lost`,
       `segs_out`, `snd_wnd` and more, and `congestion`, the algorithm's
       name. Through `netlink` only; a field the kernel's `tcp_info` ends
       before is absent, not zero."
    - "Narrowing to a process matches socket inodes against /proc/[pid]/fd, so a
       socket passed to another process over a unix socket is attributed to
       whoever holds the descriptor now."


- id: net.tcp.retransmit
  family: net
  summary: "TCP retransmissions"
  unit: count
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:tcp_retransmit_skb(sock *, sk_buff *, int)|(sock *, sk_buff *)", "kernel>=5.8"], cost: low}
    - {id: "bpf:tp", requires: ["tracepoint:tcp:tcp_retransmit_skb", "bpf"], cost: low, equivalent: true}
  modes: [trace, count]
  emits: [rate, topk, raw, summary]
  targets: {system: native, pid: bpf_only, cgroup: bpf_only}
  keys: [sock, task]
  filter_fields: [saddr, sport, daddr, dport]
  determinism: low

- id: net.drops
  family: net
  summary: "Dropped packets with drop reason"
  unit: count
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:kfree_skb(sk_buff *, void *, skb_drop_reason, sock *)|(sk_buff *, void *, skb_drop_reason)", "kernel>=5.8"], cost: low}
    - {id: "bpf:tp", requires: ["tracepoint:skb:kfree_skb", "bpf"], cost: low, equivalent: true}
  modes: [trace, count]
  emits: [rate, topk, raw, summary, stack]
  targets: {system: native}
  keys: [sock]
  filter_fields: [reason, protocol]
  determinism: medium
  caveats:
    - "`-e stack` adds the kernel stack of each drop, interned in the kernel
       (one walk per distinct stack, 64 frames deep) and named through
       /proc/kallsyms, and `function`, the symbol `location` is in: where the
       packet died and how it got there, as the bpftrace drop tools print it;
       the tracer's own two leaf frames (`bpf_trace_run*`, `bpf_prog_*`) are
       taken off. Without it no stack is walked."
    - "The drop reason field only exists on recent kernels: discover the
       tracepoint format at runtime instead of assuming it."

- id: net.bytes
  family: net
  summary: "Network volume"
  unit: bytes
  backends:
    - {id: "fs:proc", requires: ["/proc/net/dev"], cost: free,
       targets: {system: native, iface: native}, filter_fields: [iface],
       keys: [iface, dir], degraded: "per interface, system-wide"}
    - {id: "netlink", requires: ["rtnetlink"], cost: free, equivalent: true,
       targets: {system: native, iface: native}, filter_fields: [iface], keys: [iface]}
    # `comm` lives here and nowhere else: a socket send knows its process, and
    # /proc/net/dev has no idea which one moved a byte. The interface is the
    # other way round, so this backend does not claim it.
    - {id: "bpf:fentry", requires: ["btf", "bpf", "fentry:sock_sendmsg"], cost: low, equivalent: true,
       targets: {system: native, pid: native, cgroup: native, container: native},
       filter_fields: [comm], keys: [iface, sock, task, cgroup]}
  modes: [poll, count]
  emits: [rate, timeline, summary, topk, raw]
  targets: {system: native, iface: native, pid: bpf_only, cgroup: bpf_only, container: bpf_only}
  keys: [iface, sock, task, cgroup, dir]
  filter_fields: [iface, comm]
  determinism: low
  caveats:
    - "The file holds counters that only grow, so a run reports the increment
       between two reads. The baseline is read before the observed program
       starts, so its first bytes are in the first interval; the runner's
       first tick, microseconds after it, is passed over rather than reported
       as an interval of its own."
    - "Loopback traffic is counted twice, once received and once transmitted,
       because it is both."
    - "A series is an interface, and its `bytes` are both directions: each
       event carries `rx` and `tx` beside them, which `raw` keeps to the end
       of the run. Keyed on `dir` (`--keys iface,dir`), each interface's
       increase is two events instead, `dir:rx` and `dir:tx`, one series per
       direction; `fs:proc` alone splits it."
    - "Per-process attribution is not available from this file. It needs the
       eBPF backend, and the resolver will say so rather than dividing a
       machine-wide number."


- id: net.packets
  family: net
  summary: "Packet counts"
  unit: count
  backends:
    - {id: "fs:proc", requires: ["/proc/net/dev"], cost: free, keys: [iface, dir]}
    - {id: "netlink", requires: ["rtnetlink"], cost: free, equivalent: true, keys: [iface]}
  modes: [poll, count]
  emits: [rate, timeline, summary]
  targets: {system: native, iface: native}
  keys: [iface, dir]
  filter_fields: [iface]
  determinism: low
  caveats:
    - "Counters that only grow: a run reports the increment between two reads.
       The baseline is read before the observed program starts, and the
       runner's first tick, microseconds after it, is passed over rather than
       reported as an interval."
    - "A series is an interface, and its `packets` are both directions, with
       `rx` and `tx` beside them. Keyed on `dir` (`--keys iface,dir`), each
       interface's increase is two events, `dir:rx` and `dir:tx`, one series
       per direction, as `ip -s link` reports them; `fs:proc` alone splits
       it."


- id: net.snmp
  family: net
  summary: "Every protocol counter, by nstat's name"
  unit: count
  backends:
    - {id: "fs:proc", requires: ["/proc/net/snmp", "/proc/net/netstat"], cost: free}
  modes: [count, poll, snapshot]
  emits: [raw]
  targets: {system: native}
  keys: []
  filter_fields: [name, section]
  determinism: medium
  caveats:
    - "Every counter of /proc/net/snmp, /proc/net/netstat and /proc/net/snmp6,
       named as `nstat` names it, the section and the field run together:
       `TcpRetransSegs`, `TcpExtListenOverflows`, `Ip6InReceives`. Each event
       is one counter, `name` and `section` beside its `value`; ask for one
       with `--filter 'name == \"TcpRetransSegs\"'`."
    - "A poll or a count reports increments, and only of the counters that
       moved, as `nstat` does: a counter absent from an interval moved by zero
       in it. The baseline is read before the observed program starts. A
       snapshot reports every counter as it stands, as `value_since_boot`."
    - "A few fields are settings or gauges, not counters -- `TcpCurrEstab`,
       `IpForwarding`, `IpDefaultTTL`, `TcpRtoAlgorithm`, `TcpRtoMin`,
       `TcpRtoMax`, `TcpMaxConn` (-1 for no limit) -- and are reported as
       they stand in every interval, marked `gauge`."
    - "Only `raw`: a series per counter needs a key naming the counter, which
       the tool does not have yet, and one series of every counter summed
       would be a number about nothing."
    - "The counters are the reading process's network namespace's."

- id: net.sockets
  family: net
  summary: "Every TCP and UDP socket, its state, queues and owner"
  unit: bytes
  backends:
    - {id: "netlink", requires: ["sock_diag"], cost: low}
  modes: [snapshot, poll]
  emits: [raw]
  targets: {system: native, pid: native}
  keys: [sock]
  filter_fields: [protocol, family, state, saddr, sport, daddr, dport, uid, pid, comm]
  determinism: medium
  caveats:
    - "What `ss -tuanp` lists: one event per socket, keyed by its cookie, with
       `protocol`, `state` in `ss`'s words (`LISTEN`, `ESTAB`, `TIME-WAIT`,
       `UNCONN`), the endpoints, `uid`, and `pid` and `comm` of the process
       holding it."
    - "`recv_q` and `send_q` mean what `ss` says: on a listening socket the
       accept queue's length and its bound; on any other, bytes the
       application has not read and bytes the peer has not acknowledged."
    - "The owner is found by matching socket inodes against /proc/<pid>/fd,
       which another user's processes do not open to an unprivileged reader:
       their sockets carry no `pid`, and the run's notes say how many
       processes were unreadable. Under --pid an unreadable process is
       refused at attach, and one that becomes unreadable (a setuid exec)
       is a failed read, never an empty inventory. A connection still in an accept queue, and
       a socket in TIME-WAIT, belong to no process."
    - "Each poll lists the sockets alive at that tick; one opened and closed
       between two ticks is never seen."

- id: net.socket
  family: net
  summary: "Socket read and write latency"
  unit: ns
  backends:
    # Receives at `sock_recvmsg`, for every family. Sends at the families'
    # own `sendmsg`, because every syscall path inlines `__sock_sendmsg` and
    # `sock_sendmsg` sees only the kernel's own senders: measured, 2000 sends
    # and zero calls.
    # Both count in the kernel, one row per (task, op, socket, log2 bucket)
    # drained on a tick: one event stands for every call in its bucket.
    - {id: "bpf:fentry", requires: ["btf", "bpf", "fentry:sock_recvmsg", "fentry:inet_sendmsg"], cost: low, drained: true}
    # A kernel that inlined `sock_recvmsg` into the syscalls -- a clang build
    # of 7.2, measured: no call of it beside 44 of `inet_recvmsg` -- is timed
    # at the families' own receive functions, the way the sends already are.
    - {id: "bpf:fentry:families", requires: ["btf", "bpf", "fentry:inet_recvmsg", "fentry:inet_sendmsg"], cost: low, drained: true,
       degraded: "receives timed at the families' own recvmsg, as the sends are: inet, inet6 and unix sockets only, because sock_recvmsg is off this kernel's syscall path"}
    - {id: "bpf:kprobe", requires: ["kprobe", "bpf"], cost: med, drained: true,
       degraded: "no BTF: struct offsets are not portable across kernels"}
  modes: [trace, count]
  emits: [hist, topk, raw, summary]
  targets: {pid: native, tid: native, cgroup: bpf_only, launch: native, container: bpf_only, system: native}
  keys: [sock, task, iface]
  filter_fields: [comm, bytes, dport, family, op, iface]
  determinism: low
  caveats:
    - "Sends are timed for inet, inet6 and unix sockets only; receives for
       every family. Compare the two directions within those families."
    - "A receive's latency includes the wait for data. A blocking recv that
       waited a second for its peer is one second here, and is not a slow
       network."
    - "An event is a histogram row, not a call: `count` says how many."
    - "`iface` is the interface the socket's cached route leaves by, read at
       the call. A unix socket, an unconnected datagram socket and a socket in
       another network namespace carry none."

- id: net.backlog
  family: net
  summary: "Accept and SYN queue drops"
  unit: count
  backends:
    - {id: "fs:proc", requires: ["/proc/net/netstat"], cost: low}
  modes: [count, poll, snapshot]
  emits: [timeline, rate, raw, summary]
  targets: {system: native}
  keys: []
  filter_fields: []
  determinism: medium
  caveats:
    - "Overflows and drops are reported apart because they mean different
       things: an overflow is an application too slow to accept, a drop without
       one is usually the SYN queue or a cookie, and the fix differs."
    - "These are counters, so a run reports the increment between two reads and
       its first read is a baseline that produces nothing."


- id: net.qdisc
  family: net
  summary: "Transmit scheduling latency"
  unit: ns
  backends:
    # Bucketed in the kernel and drained on a tick: one event is one bucket of
    # one window, standing for every packet in it.
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:qdisc_enqueue(Qdisc *, netdev_queue *, sk_buff *)", "raw_tracepoint:qdisc_dequeue(Qdisc *, netdev_queue *, int, sk_buff *)", "kernel>=5.8"], cost: low, drained: true}
    - {id: "bpf:tp", requires: ["tracepoint:qdisc:qdisc_enqueue", "tracepoint:qdisc:qdisc_dequeue", "bpf"], cost: low, equivalent: true, drained: true}
  modes: [trace]
  emits: [hist, raw, summary, timeline]
  targets: {system: native, iface: bpf_only}
  keys: [iface]
  filter_fields: [iface, netns]
  determinism: low
  caveats:
    - "An event is one bucket of one window, and it is stamped at the moment the
       window's first one began rather than at the drain that read it. A join
       that *opens* on this source would otherwise open at the window's close,
       and everything that happened in the same window as the first would fall
       outside the state. `window_ns` beside the value says how wide the window
       was."
    - "Every network namespace's disciplines are read, and an interface's index
       is only an index inside its namespace: lo is 1 in each. The key carries
       the device's namespace, read in the kernel (`netns`, its inode), so
       another namespace's lo is another interface, printed
       `iface:lo@netns:<inode>`, and an --iface target is compared by both."

- id: net.softirq
  family: net
  summary: "Time spent in network softirq processing"
  unit: ns
  backends:
    # A count and an exact total per (cpu, vector, bucket), drained on a tick.
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:softirq_entry(unsigned int)", "raw_tracepoint:softirq_exit(unsigned int)", "kernel>=5.8"], cost: med, drained: true}
    - {id: "bpf:tp", requires: ["tracepoint:irq:softirq_entry", "tracepoint:irq:softirq_exit", "bpf"], cost: med, equivalent: true, drained: true}
  modes: [trace, count]
  emits: [hist, rate, raw, summary]
  targets: {system: native, cpu: native}
  keys: [cpu]
  filter_fields: [cpu, vec]
  determinism: low
  caveats:
    - "An event is one bucket of one window, and it is stamped at the moment the
       window's first one began rather than at the drain that read it. A join
       that *opens* on this source would otherwise open at the window's close,
       and everything that happened in the same window as the first would fall
       outside the state. `window_ns` beside the value says how wide the window
       was."

- id: net.hwts
  family: net
  summary: "NIC hardware timestamps (PHC domain)"
  unit: ns
  backends:
    # Per packet, which is what the source is for and what needs a socket this
    # tool owns: SO_TIMESTAMPING on it, and the PHC to read its stamps against.
    # It serves a process because a socket belongs to one; an interface does not
    # have a socket, which is why the fallback below exists at all.
    # A timestamp per packet is `trace`, and only this backend makes one.
    - {id: "so_timestamping", requires: ["so_timestamping", "phc"], cost: free,
       modes: [trace], targets: {pid: native, launch: native}, filter_fields: [dport]}
    # Per interface, over the ethtool netlink family and the PTP character
    # device. What the card can stamp, and how far its clock is from ours: a
    # reading, once or repeated, so `poll` and `snapshot` and never `trace` --
    # the resolver passes it over for a `trace` request with that reason
    # rather than resolving onto it and failing at the start.
    - {id: "netlink:ethtool", requires: ["netlink", "ethtool", "phc"], cost: free,
       modes: [poll, snapshot], targets: {iface: native, system: native}, filter_fields: [iface],
       degraded: "what an interface can timestamp and how far its clock has
                  drifted from CLOCK_MONOTONIC, not the timestamps of individual
                  packets: it says whether a latency measured elsewhere is the
                  card's word or the kernel's guess, and cannot itself split one"}
  modes: [trace, poll, snapshot]
  emits: [raw, timeline, summary]
  targets: {pid: native, launch: native, iface: native, system: native}
  keys: [sock, iface]
  filter_fields: [iface, dport]
  determinism: high
  caveats:
    - "The only way to settle 'is it the network or is it us': it splits latency
       into NIC / kernel / application segments."
    - "A different clock domain from CLOCK_MONOTONIC: calibration is mandatory and
       ts_err_ns is non-zero on these events."
    - "The measured value is the offset between an interface's own clock and
       CLOCK_MONOTONIC, so an interface with no hardware clock is refused by
       name rather than reported as an offset of zero: its packets are stamped
       from CLOCK_REALTIME like every other software timestamp, and there is no
       second clock to be offset from."
    - "Reading a PTP hardware clock needs read permission on /dev/ptp<n>, which
       is root and the `clock` group on most distributions. An interface whose
       clock is out of reach is named in the run's notes, because out of reach
       and absent are different answers and only the first is a privilege to
       grant."
    - "A PTP hardware clock is free-running unless something disciplines it.
       Nothing bounds how fast it drifts from CLOCK_MONOTONIC the way the
       kernel's slew ceiling bounds the realtime clock, which is why polling
       this source is the way to find out rather than assuming a rate."

- id: net.xdp
  family: net
  summary: "In-driver XDP counters"
  unit: count
  backends:
    - {id: "bpf", requires: ["xdp", "bpf"], cost: free}
  modes: [count, poll]
  emits: [rate, summary, timeline]
  targets: {iface: native}
  keys: []
  filter_fields: [iface]
  determinism: medium

- id: net.capture
  family: net
  summary: "Raw packet capture"
  unit: bytes
  backends:
    - {id: "af_packet", requires: ["af_packet:tpacket_v3"], cost: high}
  modes: [trace]
  emits: [raw, timeline]
  targets: {iface: native, system: native}
  # A frame off the wire has no socket: the lookup that would give it one has
  # not happened yet, and on receive it never happens in a process context at
  # all. What a captured frame does have is the interface it crossed.
  keys: [iface]
  filter_fields: [iface, protocol, saddr, sport, dport, daddr, direction]
  determinism: high
  caveats:
    - "Loopback hands a packet socket every frame twice, once leaving
       (`direction` `outgoing`) and once arriving (`host`), and both are kept:
       they are two real crossings of the device. A count of packets as
       tcpdump gives it on `lo` keeps one, `--filter 'direction != \"outgoing\"'`."

    - "Watch buffer drops. A capture that loses packets under load silently
       produces wrong conclusions."
    - "The kernel is told to copy only the headers of each frame, through a
       classic BPF filter on the socket, so no payload enters this process.
       `bytes` is still the frame's length on the wire; `captured_bytes` is what
       was copied."
    - "A packet the snaplen cut short before its ports reports no ports, which
       is not port zero."
    - "Frames are stamped from CLOCK_REALTIME by the kernel and converted here,
       so every event carries a non-zero ts_err_ns: the width of the calibration
       plus what the realtime clock could have been slewed by since."
    - "Needs CAP_NET_RAW. The build does not grant it, so this source reports
       the privilege it is missing rather than collecting."

- id: net.iface
  family: net
  summary: "Interface errors, drops and pause frames"
  unit: count
  backends:
    - {id: "netlink", requires: ["ethtool"], cost: free}
    - {id: "fs:proc", requires: ["/proc/net/dev"], cost: low, degraded: "generic counters only, no driver-specific ones"}
  modes: [count, poll, snapshot]
  emits: [timeline, rate, raw, summary]
  targets: {iface: native, system: native}
  keys: [iface]
  filter_fields: [iface]
  determinism: medium
  caveats:
    - "Errors and drops are counted apart: a bad frame and a full queue are
       different failures, and summing them would hide which one happened."
    - "The procfs backend carries the counters every driver keeps. The long
       driver-specific list `ethtool -S` prints needs the ethtool netlink
       family, which is why that backend is first in the chain."
    - "Apart, and all of them in every emit: each interface is one series per
       counter kind, keyed `<iface>/errors`, `/drops`, `/fifo`, `/collisions`,
       `/carrier`, `/mcast` and `/missed`, whose value is frames. `mcast` is
       multicast frames received, not a failure, kept because `ip -s link`
       prints it beside them; `missed` is `rx_missed_errors` from sysfs, frames
       the card had no buffer for, already inside `drops` (the kernel adds it
       into the receive drop column) and given apart as `ip -s link` does. The `iface` field is the
       interface alone, so a filter on it keeps every kind of that interface."
    - "These are counters, so a run reports the increment between two reads and
       its first read is a baseline that produces nothing."


- id: net.request
  family: net
  summary: "One request's life by state, and the network on either side of it"
  unit: ns
  backends:
    # The server declares where a request starts and ends, with two USDT
    # probes, `request__start(id)` and `request__done(id)`, any provider. The
    # birth writes the id into the serving task's own storage
    # (`bpf_task_storage`), and every program that later runs in that task
    # reads it back: `sched_switch` to add up the request's time by state, the
    # block layer's issue to put `req:<id>` on the requests it submits. See
    # `src/bpf/request.rs`, and `docs/scenarios/vertical.md` for why the birth
    # is declared rather than derived from the connection.
    #
    # A second argument on both probes, the descriptor of the connection,
    # adds the two network rows: `net_rx` from the request's first byte
    # reaching the socket, `net_tx` to the response's last byte leaving it.
    # Neither runs in the serving thread, so both are read by the socket's
    # cookie -- see `src/bpf/request_net.rs`. Those four functions are the
    # first backend's, with `sock_def_readable` and `__tcp_push_pending_frames`
    # beside the first two for a kernel that inlined them (a clang build with
    # link-time optimisation); the second follows the thread and not the
    # socket.
    - {id: "bpf:usdt", requires: ["uprobe_multi", "bpf", "btf", "raw_tracepoint:sched_switch(bool, task_struct *, task_struct *, unsigned int)", "raw_tracepoint:sched_waking(task_struct *)", "fentry:tcp_data_ready", "fentry:tcp_event_new_data_sent", "fentry:sk_wait_data", "fentry:sk_stream_wait_memory", "fentry:sock_def_readable", "fentry:__tcp_push_pending_frames"], cost: low}
    - {id: "bpf:usdt:threads", requires: ["uprobe_multi", "bpf", "btf", "raw_tracepoint:sched_switch(bool, task_struct *, task_struct *, unsigned int)", "raw_tracepoint:sched_waking(task_struct *)"], cost: low,
       degraded: "no `net_rx` or `net_tx`: the socket the probes name is not followed, and a sleep on it is counted in `sleep_ns`"}
  modes: [trace]
  emits: [raw, summary, hist, topk]
  targets: {pid: native, launch: native}
  keys: [req, task, sock]
  filter_fields: [comm, tid, holder_tid]
  determinism: medium
  caveats:
    - "The program has to declare its requests: `request__start(id)` where one
       begins and `request__done(id)` where it ends, in the executable itself,
       with the id as the first argument. A program that declares none is
       refused with the probes it does carry. Nothing is guessed from the
       connection: a keep-alive connection is not one request, and a request is
       not over at its first send."
    - "Linux 6.6 or later. Every site is linked with a uprobe-multi link, which
       follows the process and keeps the probes' semaphores raised, and this
       source has no older route: below 6.6 `uprobe_multi` is missing, and
       names the kernel's refusal."
    - "A request is followed in the task that declared it. A server that hands
       a request to another thread must declare it again there, with the same
       id; the time between the two declarations is in neither."
    - "The four states tile the request's life exactly -- on a cpu, runnable,
       asleep interruptibly, asleep uninterruptibly -- so their sum is the
       request's total by construction, and is not evidence of anything. What
       is evidence is which state a known delay lands in, and the block
       requests that carry the request's id in `io.latency`."
    - "`sleep_ns` is the interruptible sleep of the serving task: a lock, a
       timer, another socket. A sleep on the request's own socket is not in it
       when the probes name that socket -- it is `rx_wait_ns` or `tx_wait_ns`.
       `holder_tid` is the task whose wakeup ended the longest such sleep,
       which for a lock is the thread that released it. `disk_ns`
       is uninterruptible sleep, usually a disk, and on btrfs the completion
       reaches the reader through a kworker, so it is the device's time plus
       that hop."
    - "`net_rx_ns` and `net_tx_ns` are read by the socket's cookie, not by the
       request's id: the first byte is queued in softirq and the last leaves
       when the peer opens its window, and neither runs in the serving thread.
       They are KEY where every other row is IDENTITY. `span_ns`, first byte
       in to last byte out, is the whole the six rows tile."
    - "`net_rx` starts at the first byte that arrived on the socket since its
       previous request ended; bytes that arrive while a request is live are
       that request's. Two pipelined requests whose bytes arrive before the
       first is born give the second no `net_rx` rather than a wrong one."
    - "`net_tx` ends when the last byte leaves the stack -- `snd_nxt` reaching
       what the server had queued at `request__done` -- which on loopback is
       its arrival in the peer's receive queue. What the client then takes to
       read it is the client's, and in no row."
    - "`rx_bytes` is what the server read off the socket from the request's
       first byte to its end (`copied_seq` at the first byte's arrival and at
       the end), and `tx_bytes` what it queued on it from the birth to the end
       (`write_seq`), so a response still queued at the end is counted whole.
       Each is absent, not zero, when its start was not seen; both wrap past
       4 GiB in one request. `holder_since_ns` is when the longest sleep began.
       The run's counts by name -- `never_ended`, `unborn`, `replaced`,
       `filtered_out` -- are the result's `fields`, the numbers its notes say."

# The family's default: what `omn trace net -- PROGRAM` composes, per cost
# band. See docs/lazy.md.
- default:
    family: net
    question: "How long does the program wait on its sockets and connections?"
    low:
      - {source: net.socket, mode: trace, emit: [hist, summary], label: "socket latency"}
    med:
      - {source: net.socket, mode: trace, emit: [hist, summary], label: "socket latency"}
      - {source: net.tcp.connect, mode: trace, emit: [hist, summary], label: "connect latency"}
