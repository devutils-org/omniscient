# Family `mem` — see CATALOG.md section 3.
# Cardinal rule: the accounting metric is always explicit. RSS, PSS, USS, live
# heap, retained heap and memory.current are six different numbers, all correct.
# A `mem` request without a named metric must fail rather than pick a default.

- id: mem.rss
  family: mem
  summary: "Resident footprint (pages in RAM, shared ones counted in full)"
  unit: bytes
  backends:
    - {id: "fs:proc:smaps_rollup", requires: ["/proc/[pid]/smaps_rollup"], cost: med}
    - {id: "fs:proc:statm", requires: ["/proc/[pid]/statm"], cost: free,
       degraded: "resident pages only: no per-VMA breakdown, and no PSS or USS to cross-check against"}
  modes: [poll, snapshot]
  emits: [timeline, raw, summary]
  targets: {pid: native, tid: native, cgroup: native, launch: native, container: native}
  keys: [task, proc, cgroup]
  filter_fields: [comm]
  determinism: medium
  caveats:
    - "malloc() allocates nothing: RSS only rises on first write. An
       allocation-site profile and an RSS curve never line up."
    - "THP breaks reproducibility: khugepaged promotes in the background and RSS
       grows in 2 MB steps. Freeze and log the mode."
    - "Beside a preload source (`mem.heap.*`, `sched.mutex`) up to 3 MiB of what
       this reads is the tool's: the shim's record ring -- 65 536 slots of 48
       bytes -- is mapped into the target and becomes resident as records are
       written, so a program that allocates a lot carries all of it."
    - "Each event carries what `top` shows beside RES: `virt_bytes` (VIRT,
       the whole address space, most of it never touched) and `shared_bytes`
       (SHR, resident pages backed by a file or by shared memory, which other
       processes may count too), from statm; and over smaps_rollup the
       swapped, transparently huge and locked parts as `swap_bytes`,
       `anon_huge_bytes` and `locked_bytes`."

- id: mem.pss
  family: mem
  summary: "Proportional footprint (shared pages divided by the number of mappers)"
  unit: bytes
  backends:
    - {id: "fs:proc:smaps_rollup", requires: ["/proc/[pid]/smaps_rollup"], cost: med}
    - {id: "fs:proc:smaps", requires: ["/proc/[pid]/smaps"], cost: med,
       degraded: "walks every VMA: expensive on large address spaces"}
  modes: [poll, snapshot]
  emits: [timeline, raw, summary]
  targets: {pid: native, cgroup: native, launch: native, container: native}
  keys: [task, proc, cgroup, mem]
  filter_fields: [comm]
  determinism: medium
  caveats:
    - "PSS is the only one of the three footprints that sums across processes
       without double counting: RSS counts a shared page in full in every
       process that maps it."

- id: mem.uss
  family: mem
  summary: "Private footprint (what dies with the process)"
  unit: bytes
  backends:
    - {id: "fs:proc:smaps_rollup", requires: ["/proc/[pid]/smaps_rollup"], cost: med}
    - {id: "fs:proc:smaps", requires: ["/proc/[pid]/smaps"], cost: med,
       degraded: "walks every VMA: expensive on large address spaces"}
  modes: [poll, snapshot]
  emits: [timeline, raw, summary]
  targets: {pid: native, launch: native}
  keys: [task, proc, mem]
  filter_fields: [comm]
  determinism: medium
  caveats:
    - "The kernel publishes no USS line: this is Private_Clean + Private_Dirty,
       so privately mapped huge pages, which the kernel counts separately in
       Private_Hugetlb, are not in it."

- id: mem.cgroup
  family: mem
  summary: "Cgroup memory accounting (current / peak / stat)"
  unit: bytes
  backends:
    - {id: "fs:cgroup", requires: ["cgroup2:memory.current"], cost: free}
  modes: [poll, snapshot]
  emits: [timeline, raw, summary]
  targets: {cgroup: native, container: native, pid: native, tid: native, launch: native}
  keys: [cgroup]
  filter_fields: []
  determinism: medium
  caveats:
    - "A pid names a cgroup here: the process's own cgroup is resolved and the
       whole of it is reported, which includes every other process placed there.
       This is the number the OOM killer compares against, and it is not a
       property of the process."
    - "This is not a footprint. Page cache the process read is charged here and
       is in nobody's RSS; kernel memory -- stacks, page tables, slab -- is
       charged here and appears in no userspace footprint at all; and a page
       shared across cgroups is charged once, to whoever faulted it first."
    - "The root cgroup is not accounted: it publishes no memory.current, so a
       process that nobody moved into a cgroup is refused rather than answered
       with the machine's total."

- id: mem.faults
  family: mem
  summary: "Minor and major page faults"
  unit: count
  backends:
    - {id: "pmu:sw", requires: ["pmu:PERF_COUNT_SW_PAGE_FAULTS"], cost: low}
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:page_fault_user", "kernel>=5.8"], cost: low,
       degraded: "x86 only for this tracepoint"}
    - {id: "bpf:tp", requires: ["tracepoint:exceptions:page_fault_user", "bpf"], cost: low,
       degraded: "x86 only for this tracepoint"}
  modes: [count, sample, trace]
  emits: [summary, rate, hist, topk, stack, raw]
  targets: {system: native, cgroup: native, pid: native, tid: native, cpu: native, launch: native}
  keys: [task, mem, cgroup, cpu]
  filter_fields: [comm, addr]
  determinism: medium
  caveats:
    - "Correlate with mem.heap.alloc through the mem:[base,len) key (interval join)
       to attribute memory to whoever brings it into existence."
    - "A fault is not a page, and not proportional to pages either: how many
       faults a range costs depends on how it is backed and where it lands --
       an 8 MiB mapping cost 515 faults, or 4 when it landed on four aligned
       huge pages. The THP mode is in the environment. Fault counts say where
       faults happened, not how much memory was made resident."
    - "At perf_event_paranoid 2 without CAP_PERFMON a program's faults are sampled in
       user mode only: every fault its own code takes is there, and the ones the kernel
       takes on its behalf (a read() into a buffer never touched) are not. The run says
       when that happened."

- id: mem.page_alloc
  family: mem
  summary: "Kernel page allocations and frees"
  unit: count
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:mm_page_alloc(page *, unsigned int, gfp_t, int)", "raw_tracepoint:mm_page_free(page *, unsigned int)", "kernel>=5.8"], cost: med, drained: true}
    - {id: "bpf:tp", requires: ["tracepoint:kmem:mm_page_alloc", "tracepoint:kmem:mm_page_free", "bpf"], cost: med, equivalent: true}
  modes: [trace, count]
  emits: [hist, topk, rate, raw, summary]
  targets: {system: native, cgroup: bpf_only}
  keys: [task, cgroup]
  filter_fields: [order, comm, direction]
  determinism: medium
  caveats:
    - "Allocations are the events unless a filter names `direction`: a
       histogram of allocations and frees together is a histogram of neither,
       so the frees are counted in the run's notes by default, and
       `direction == 'free'` makes them the events."

- id: mem.kmalloc
  family: mem
  summary: "Kernel slab allocations"
  unit: bytes
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:kmalloc(long unsigned int, void *, size_t, size_t, gfp_t, int)|(long unsigned int, void *, size_t, size_t, gfp_t)", "raw_tracepoint:kfree(long unsigned int, void *)", "kernel>=5.8"], cost: med, drained: true}
    - {id: "bpf:tp", requires: ["tracepoint:kmem:kmalloc", "tracepoint:kmem:kfree", "bpf"], cost: med, equivalent: true}
  modes: [trace, count]
  emits: [hist, topk, rate, raw, summary]
  targets: {system: native}
  keys: [task]
  filter_fields: [bytes, comm]
  determinism: medium
  caveats:
    - "Frees are counted, never events: `kfree` carries the pointer and the
       call site and not the size, so a free has no bytes to be measured in, and
       `direction` is not a filter field here."

- id: mem.heap.alloc
  family: mem
  summary: "Userspace allocations by call site"
  unit: bytes
  backends:
    - {id: "preload", requires: ["preload:shim"], cost: extreme}
    - {id: "bpf:usdt", requires: ["usdt:libc"], cost: extreme, equivalent: true}
    - {id: "bpf:uprobe", requires: ["uprobe", "bpf", "symbols:malloc"], cost: extreme,
       degraded: "~1-2 us per call: heavily dilates allocation-heavy workloads"}
  modes: [trace]
  emits: [hist, topk, stack, raw, summary]
  targets: {pid: native, launch: native}
  keys: [task, mem]
  filter_fields: [bytes, comm, op, freed_bytes, freed_untracked]
  determinism: high
  caveats:
    - "A preloaded shim reaches a program only at exec, so this needs a program
       the tool launches, not one already running."
    - "A statically linked program, or one with its own allocator, ignores the
       shim: the run reports no allocation rather than reporting none happened."

- id: mem.heap.live
  family: mem
  summary: "Live heap: allocated and not yet freed"
  unit: bytes
  backends:
    - {id: "preload", requires: ["preload:shim"], cost: extreme}
    - {id: "fs:proc", requires: ["allocator-stats:jemalloc|tcmalloc"], cost: free,
       degraded: "depends on the linked allocator, no allocation site"}
  modes: [poll, snapshot]
  emits: [timeline, raw, summary]
  targets: {pid: native, launch: native}
  keys: [task]
  filter_fields: []
  determinism: high
  caveats:
    - "Live heap is what the program asked for, not what it holds: malloc returns
       an address and the pages behind it become resident only on first write. This
       number and an RSS curve answer different questions and will not line up."
    - "A preloaded shim reaches a program only at exec, so this needs a program
       the tool launches, and a snapshot of one is refused: it would be taken
       before the program allocated anything."

- id: mem.heap.retained
  family: mem
  summary: "Fragmentation: memory retained by the allocator but no longer live"
  unit: bytes
  primitive: false
  derived_from: [mem.heap.live]
  backends:
    - {id: "preload", requires: ["preload:shim", "/proc/[pid]/pagemap", "/proc/[pid]/smaps_rollup"], cost: extreme}
  modes: [poll, snapshot]
  emits: [timeline, raw, summary]
  targets: {pid: native, launch: native}
  keys: [task]
  filter_fields: []
  determinism: high
  caveats:
    - "free() returns nothing: the allocator keeps its arenas. This is the metric
       that predicts OOMs in production, and almost nobody collects it."
    - "This is not RSS minus live heap. That subtraction mixes the executable, the
       stacks and every file mapping into a heap number, and subtracts bytes that
       were asked for but never made resident. What is counted here is the pages of
       ranges the program allocated and then freed, read from /proc/[pid]/pagemap.
       RSS is reported beside the number for scale and is not part of it."
    - "A page shared between a freed range and a live one is counted as live, so
       the number is a lower bound: at most one page per end of each freed range."
    - "The table of freed ranges is bounded. What it evicts is counted and
       surfaced as a loss, because retained memory missing from the table looks
       exactly like retained memory that does not exist."

- id: mem.cache_l1
  family: mem
  summary: "L1 data cache misses"
  unit: count
  backends:
    - {id: "pmu", requires: ["pmu:L1-dcache-load-misses", "pmu:L1-dcache-loads"], cost: low}
  modes: [count, sample]
  emits: [summary, rate, topk, stack, raw]
  targets: {system: native, cgroup: native, pid: native, tid: native, cpu: native, launch: native}
  keys: [task, cgroup, cpu]
  filter_fields: [comm, cpu]
  determinism: low
  caveats:
    - "A miss count is not a miss rate: twice the work misses twice as often and
       is no worse for it. The loads are counted in the same group and travel on
       the event, so the rate can be had without a second run."

- id: mem.cache_llc
  family: mem
  summary: "Last-level cache misses"
  unit: count
  backends:
    - {id: "pmu", requires: ["pmu:LLC-load-misses", "pmu:LLC-loads"], cost: low}
    - {id: "pmu:generic", requires: ["pmu:PERF_COUNT_HW_CACHE_MISSES", "pmu:PERF_COUNT_HW_CACHE_REFERENCES"], cost: low,
       degraded: "the architectural cache-miss counter: every last-level access that
         missed, not loads only, and what each vendor puts in it differs"}
  modes: [count, sample]
  emits: [summary, rate, topk, stack, raw]
  targets: {system: native, cgroup: native, pid: native, tid: native, cpu: native, launch: native}
  keys: [task, cgroup, cpu]
  filter_fields: [comm, cpu]
  determinism: low
  caveats:
    - "The last level is not the same cache on two machines: L3 on a desktop
       part, a shared victim cache on a server one. Two runs are comparable only
       on the same model."
    - "AMD family 17h exposes no last-level cache descriptor at all, so the
       first backend is missing there and the architectural counter is what
       answers."

- id: mem.cache_tlb
  family: mem
  summary: "Data and instruction TLB misses"
  unit: count
  backends:
    - {id: "pmu", requires: ["pmu:dTLB-load-misses", "pmu:iTLB-load-misses"], cost: low}
  modes: [count, sample]
  emits: [summary, rate, topk, stack, raw]
  targets: {system: native, cgroup: native, pid: native, tid: native, cpu: native, launch: native}
  keys: [task, cgroup, cpu]
  filter_fields: [comm, cpu]
  determinism: low
  caveats:
    - "Two counters added: the data side and the instruction side. Both travel
       on the event, because which of the two moved is the first question, and a
       total that cannot be decomposed cannot answer it."
    - "A miss is a page-table walk, not a stall: a hardware walker hides most of
       them. Read it beside `mem.thp`, which is what usually changes the number."

- id: mem.latency
  family: mem
  summary: "Memory access latency (load latency sampling)"
  unit: cycles
  backends:
    - {id: "pmu:pebs", requires: ["pmu:pebs:mem-loads"], cost: med}
    - {id: "pmu:ibs", requires: ["pmu:ibs_op"], cost: med,
       degraded: "AMD family 17h times a load only when it misses L1d, so L1 hits are
         counted by level and are in no bucket; PEBS with a low latency threshold
         times them too"}
  modes: [sample]
  emits: [hist, topk, stack, raw]
  targets: {system: native, cgroup: native, pid: native, tid: native, cpu: native, launch: native, container: native}
  keys: [task, mem, cpu]
  filter_fields: [comm, cpu, addr, level]
  determinism: low
  caveats:
    - "The value is core cycles from the miss to the data, not nanoseconds: the
       clock a core runs at moves with load and temperature, and the cycle count
       is what the hardware measured. Compare two runs in cycles or not at all."
    - "Each event is one tagged op, and the unit tags one op in every so many,
       not one load: most of what it tags is arithmetic and branches, so a
       distribution needs a rate far above what a profile would ask for, and a
       workload whose loads are a small share of its ops yields few of them."
    - "`level` says which level answered. On AMD family 17h an L3 hit and a hit
       in a sibling core's cache are reported alike, as `peer`, because the
       unit does not tell them apart; `perf script` prints the same word as
       \"core, same node Any cache hit\". The share of `peer` moves from run
       to run with what else holds the L3, and a reference that counts cycles
       between tags rather than ops times a different mix of loads."
    - "A rate in Hz is a target the kernel adjusts the period towards, not a
       promise. Counting ops with the kernel's accesses filtered out, the IBS
       unit of family 17h settles at about 70 % of 4000 Hz; the run says the
       rate it delivered over the time the followed tasks ran."

- id: mem.sharing
  family: mem
  summary: "False sharing: cache lines in HITM across cores"
  unit: count
  backends:
    - {id: "pmu:pebs", requires: ["pmu:pebs:mem-loads", "pmu:pebs:mem-stores"], cost: med}
    - {id: "pmu:ibs", requires: ["pmu:ibs_op"], cost: med, equivalent: true}
  modes: [sample]
  emits: [topk, stack, raw]
  targets: {system: native, cgroup: native, pid: native, cpu: native, launch: native, container: native}
  keys: [task, mem, cpu]
  filter_fields: [comm, cpu, addr, level]
  determinism: low
  caveats:
    - "HITM is an access answered by another core's cache holding the line
       modified. False sharing leaves it, and so does true sharing: two cores
       writing the same counter look the same as two writing neighbouring ones.
       The addresses on the events tell them apart; the count cannot."
    - "A HITM taken by one task alone is a line it shares with something this
       run does not follow -- or its own line, left dirty on a core it migrated
       away from. The run names the lines more than one task fought over."
    - "The series is the cache line by default, because the line is what two
       cores fight over; `--key task` ranks the tasks instead."

- id: mem.bandwidth
  family: mem
  summary: "DRAM throughput"
  unit: bytes
  backends:
    - {id: "pmu:uncore", requires: ["pmu:uncore_imc"], cost: free}
    - {id: "pmu:rdt", requires: ["rdt:mbm"], cost: free,
       degraded: "attribution per RDT class, available only on some CPUs"}
  modes: [count, poll]
  emits: [rate, timeline, summary]
  targets: {system: native}
  keys: []
  filter_fields: []
  determinism: low
  caveats:
    - "The uncore is inherently package-scoped: --pid must be REFUSED, never
       degraded into a system-wide value presented as per-process attribution."

- id: mem.numa
  family: mem
  summary: "Memory access locality (local / remote)"
  unit: count
  backends:
    - {id: "pmu", requires: ["pmu:pebs:mem-loads"], cost: med}
    - {id: "fs:proc", requires: ["/proc/[pid]/numa_maps"], cost: med,
       targets: {pid: native, tid: native, launch: native}, filter_fields: [comm, node],
       degraded: "page placement, not accesses: a page on the wrong node that is never touched costs nothing, and this cannot tell the two apart"}
    - {id: "fs:sys", requires: ["/sys/devices/system/node/node0/numastat"], cost: free,
       targets: {system: native}, filter_fields: [node],
       degraded: "allocations, not accesses, and the machine's rather than anyone's: each page is counted once, on the node it came from, as a hit when that was the node asked for and a miss when it was not"}
  modes: [sample, poll]
  emits: [topk, hist, raw, summary, timeline]
  targets: {system: native, cgroup: native, pid: native, cpu: native, launch: native, container: native}
  keys: [node, task, mem, cpu]
  filter_fields: [comm, cpu, node]
  determinism: low
  caveats:
    - "One event per node, never a locality ratio computed from placement: a
       process with two thirds of its pages on node 0 may be doing all of its
       work from node 1, and one number would hide exactly that."
    - "numa_maps counts each mapping in its own page size, so a transparently
       promoted region is counted in 2 MiB pages and not in 4 KiB ones."

- id: mem.system
  family: mem
  summary: "The machine's memory: used, available, cache, slab, swap (what free prints)"
  unit: bytes
  backends:
    - {id: "fs:proc", requires: ["/proc/meminfo"], cost: free}
  modes: [poll, snapshot]
  emits: [timeline, raw, summary]
  targets: {system: native}
  keys: []
  filter_fields: []
  determinism: low
  caveats:
    - "Used is total minus available, as free computes it since procps 4:
       available is the kernel's estimate of what a new program could get
       without swapping, cache and reclaimable slab included. Total minus free
       would call every cached page used."
    - "The slab is the machine's total, split into its reclaimable and
       unreclaimable halves; the split per cache that slabtop prints is in
       /proc/slabinfo, which only root can read."

- id: mem.wss
  family: mem
  summary: "Real working set (pages actually touched)"
  unit: bytes
  backends:
    - {id: "fs:sys:damon", requires: ["damon"], cost: low}
    - {id: "fs:sys:page_idle", requires: ["/sys/kernel/mm/page_idle/bitmap", "/proc/[pid]/pagemap"], cost: low,
       degraded: "expensive scan, perturbs reclaim"}
    - {id: "fs:proc:clear_refs", requires: ["/proc/[pid]/smaps_rollup", "writable:/proc/[pid]/clear_refs"], cost: high,
       targets: {pid: native, tid: native, launch: native},
       degraded: "one number for the whole process, not which pages: the kernel's referenced bits are cleared and Referenced: is read back, so the working set is a size and not a set"}
  modes: [poll]
  emits: [timeline, raw, summary]
  targets: {system: native, cgroup: native, pid: native, tid: native, launch: native, container: native}
  keys: [task, cgroup, mem]
  filter_fields: []
  determinism: medium
  caveats:
    - "A working set the TLB holds is not seen. The referenced bit is set when
       the cpu walks the page tables, and a clear does not flush what the TLB
       already caches: sixteen mebibytes in eight huge pages, walked twice right
       after a clear, read as 4 KiB. Small pages are not exempt, only harder to
       cache: 64 of them read as 2 % and 1 024 as 37 to 99 % on a Ryzen 9
       3900X, and 4 096 in full there but as half on a cloud runner's cpu. The
       undercount is of the hottest pages, and is largest for a small working
       set over short windows."
    - "This measurement changes what it measures. Clearing the referenced bits
       is process-wide and visible to anything else reading them, and it is the
       kernel's own input to reclaim: for as long as it takes the process to
       touch its pages again, all of them look cold."
    - "A snapshot is refused. A working set is what gets touched over a window,
       and a single read observes none."
    - "page_idle needs CAP_SYS_ADMIN twice over -- the bitmap is root-only, and
       an unprivileged reader of /proc/[pid]/pagemap is handed zeroed page frame
       numbers, which index nothing."
    - "clear_refs also needs /proc/[pid]/clear_refs to be writable, which it is
       for this user's own processes and is not for anyone else's: the
       requirement asks it with access(W_OK), so a process this user may not
       write is refused by the resolver, before anything is attached."

- id: mem.reclaim
  family: mem
  summary: "Direct reclaim"
  unit: ns
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:mm_vmscan_direct_reclaim_begin(gfp_t, int, mem_cgroup *)|(int, gfp_t)", "raw_tracepoint:mm_vmscan_direct_reclaim_end(long unsigned int, mem_cgroup *)|(long unsigned int)", "raw_tracepoint:mm_vmscan_memcg_reclaim_begin", "raw_tracepoint:mm_vmscan_memcg_reclaim_end", "kernel>=5.8"], cost: low, drained: true}
    - {id: "bpf:tp", requires: ["tracepoint:vmscan:mm_vmscan_direct_reclaim_begin", "tracepoint:vmscan:mm_vmscan_direct_reclaim_end", "tracepoint:vmscan:mm_vmscan_memcg_reclaim_begin", "tracepoint:vmscan:mm_vmscan_memcg_reclaim_end", "bpf"], cost: low, equivalent: true}
  modes: [trace, count]
  emits: [hist, topk, rate, raw, summary]
  targets: {system: native, cgroup: bpf_only, pid: bpf_only, container: bpf_only}
  keys: [task, cgroup]
  filter_fields: [comm]
  determinism: medium
  caveats:
    - "An event is one bucket of one window, and it is stamped at the moment the
       window's first episode began rather than at the drain that read it. That
       matters for one thing: a join that *opens* on this source would otherwise
       open at the window's close, and everything that happened in the same
       window as the first episode would fall outside the state. `window_ns`
       beside the value says how wide the drain's window was, and
       `enclosing_ns` how long after the stamp the row's last episode ended:
       the window that encloses every episode the row counts, which an
       `overlap` rule names as `enclosing:` to credit the row whole. A `count`
       run's rows are added up over the run and carry no `enclosing_ns`."

- id: mem.compaction
  family: mem
  summary: "Memory compaction"
  unit: ns
  backends:
    - {id: "bpf:raw_tp", requires: ["bpf", "btf", "raw_tracepoint:mm_compaction_begin(compact_control *, long unsigned int, long unsigned int, bool)|(long unsigned int, long unsigned int, long unsigned int, long unsigned int, bool)", "raw_tracepoint:mm_compaction_end(compact_control *, long unsigned int, long unsigned int, bool, int)|(long unsigned int, long unsigned int, long unsigned int, long unsigned int, bool, int)", "kernel>=5.8"], cost: low, drained: true}
    - {id: "bpf:tp", requires: ["tracepoint:compaction:mm_compaction_begin", "tracepoint:compaction:mm_compaction_end", "bpf"], cost: low, equivalent: true}
  modes: [trace, count]
  emits: [hist, rate, raw, summary]
  targets: {system: native}
  keys: []
  filter_fields: []
  determinism: low
  caveats:
    - "An event is one bucket of one window, and it is stamped at the moment the
       window's first episode began rather than at the drain that read it. That
       matters for one thing: a join that *opens* on this source would otherwise
       open at the window's close, and everything that happened in the same
       window as the first episode would fall outside the state. `window_ns`
       beside the value says how wide the drain's window was, and
       `enclosing_ns` how long after the stamp the row's last episode ended:
       the window that encloses every episode the row counts, which an
       `overlap` rule names as `enclosing:` to credit the row whole. A `count`
       run's rows are added up over the run and carry no `enclosing_ns`."

- id: mem.thp
  family: mem
  summary: "Transparent huge pages: promotions and current mode"
  unit: count
  backends:
    - {id: "fs:sys", requires: ["/sys/kernel/mm/transparent_hugepage/enabled", "/proc/vmstat", "kernel>=6.8"], cost: low}
    - {id: "fs:proc", requires: ["/proc/vmstat"], cost: low,
       degraded: "promotion counters only, not the configured mode"}
  modes: [poll, snapshot]
  emits: [timeline, raw, summary]
  targets: {system: native}
  keys: []
  filter_fields: []
  determinism: low
  caveats:
    - "The THP mode must be frozen and logged just like clock frequencies."
    - "This is the PMD-sized huge page, and every event says how large that is.
       Recent kernels also allocate smaller multi-size huge pages and count each
       size apart; adding the sizes together would give a number of huge pages
       that is a quantity of nothing."
    - "The counters are the machine's. A promotion cannot be attributed to a
       process, which is why the only target is the machine."
    - "resident_huge_pages is the huge pages mapped whole, by one PMD entry:
       what /proc/meminfo calls AnonHugePages, and what the TLB sees. It is not
       every huge folio. A folio whose PMD was split into small entries that
       still map all of it (an mprotect or mremap of part of it, a fork) is in
       neither that count nor partially_mapped_huge_pages, and fs:sys carries
       every folio apart as huge_folios: 494 against 357 whole on the
       development machine."

- id: mem.swap
  family: mem
  summary: "Swap in / swap out"
  unit: bytes
  backends:
    - {id: "fs:proc", requires: ["/proc/vmstat"], cost: free, targets: {system: native}}
    - {id: "fs:cgroup", requires: ["cgroup2:memory.swap.current", "cgroup2:memory.stat:pswpout"], cost: free, equivalent: true,
       targets: {cgroup: native, container: native, pid: native, tid: native, launch: native}}
  modes: [poll, snapshot, count]
  emits: [timeline, rate, raw, summary]
  targets: {system: native, cgroup: native, container: native, pid: native, tid: native, launch: native}
  keys: [cgroup]
  filter_fields: []
  determinism: low
  caveats:
    - "What moved is not what is out. This source measures the flow -- pages
       written to, or read back from, a swap device during the window -- because
       that is what costs time. The stock is carried beside it as
       swapped_bytes where the kernel publishes one, and a cgroup that paged a
       gigabyte out and read it all back has a flow of two gigabytes and a stock
       of nothing."
    - "pswpin and pswpout are in pages, while almost every neighbouring counter
       in the same files is in bytes or in kilobytes."
    - "A zero-filled page is never written to a swap device. The kernel records
       that it was zero and counts it in swpout_zero, reported here as
       out_zero_bytes, so a process that allocates a gigabyte and leaves it
       untouched grows swapped_bytes by a gigabyte with no traffic at all. The
       flow and the stock disagreeing is not a bug."
    - "A pid names a cgroup for the fs:cgroup backend: swap is accounted per
       cgroup, never per process."

- id: mem.pressure
  family: mem
  summary: "PSI: memory stall time"
  unit: ratio
  backends:
    - {id: "fs:proc", requires: ["/proc/pressure/memory"], cost: free, targets: {system: native}}
    - {id: "fs:cgroup", requires: ["cgroup2:memory.pressure"], cost: free, equivalent: true,
       targets: {cgroup: native, container: native, pid: native, tid: native, launch: native}}
  modes: [poll, snapshot]
  emits: [timeline, raw, summary]
  targets: {system: native, cgroup: native, container: native, pid: native, tid: native, launch: native}
  keys: [cgroup]
  filter_fields: []
  determinism: low
  caveats:
    - "`some` and `full` are not two precisions of one number. `some` is time
       during which at least one task was stalled on memory; `full` is time
       during which every runnable task was, which is the machine having
       stopped. The gap between them is the diagnosis."
    - "A poll reports the share of its own window, computed from the counter.
       A snapshot observes no window and reports the kernel's decayed averages
       under their own names -- they describe the last ten seconds to five
       minutes, which overlaps the run without being about it."
    - "Absent is not zero: a kernel built without CONFIG_PSI and a machine under
       no memory pressure are different answers, and only the second is a
       number."
    - "A pid names a cgroup here: pressure is accounted per cgroup, never per
       process."

