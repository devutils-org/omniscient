# The release archive, built on a tag: scripts/release.sh builds it, verifies
# its checksum and contents, and runs the extracted tree with the build tree
# moved out of the way (docs/install.md, "Checking a release"). Only then is it
# attached to a GitHub release named after the tag.
#
# Linked against glibc 2.17 through zig (`cargo zigbuild`, in
# scripts/release.sh), because the glibc a binary needs is the newest one it
# was linked against, whatever the runner's own. docs/install.md promises 2.17, and
# both the build and the verify step fail when a binary needs more
# (`GLIBC_FLOOR` in scripts/release.sh), so a newer runner or a dependency
# linking a newer symbol stops the release instead of raising the floor.
#
# No capability is granted here or carried by the archive. The runner's checks
# are the ones that need none (`omn list`, `mem.rss`, `mem.heap.alloc`), which
# is also what a user who has not yet run setcap meets first.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  archive:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: zig and cargo-zigbuild, which link the archive against glibc 2.17
        run: |
          python3 -m pip install --user ziglang==0.16.0
          cargo install cargo-zigbuild --locked
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' > "$HOME/.local/bin/zig"
          chmod +x "$HOME/.local/bin/zig"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: The tag names the version being built
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"
            exit 1
          fi

      - name: Build the archive
        run: scripts/release.sh

      - name: Verify it, and run the extracted tree
        run: scripts/release.sh verify "target/dist/$(scripts/release.sh name).tar.gz"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="$(scripts/release.sh name)"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            "target/dist/$name.tar.gz" "target/dist/$name.tar.gz.sha256"
