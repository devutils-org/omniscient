# The suite on a hosted runner: fmt, clippy, every test, and one cell of the
# portability matrix, in two cells. docs/portability.md says what each is and is
# not.
#
# The runner is deliberately unprivileged: a distribution kernel, no file
# capabilities, no GPU. The eBPF and per-cpu perf tests skip there, loudly, as
# they are written to -- and a skip is not a pass, so the last step fails the
# job on any skip whose reason is not one its cell is expected to have
# (.github/expected-skips.txt, and for the image as shipped
# .github/expected-skips-stock.txt as well).
#
# - `defaults` is a stock kernel's defaults: perf_event_paranoid 2, unprivileged
#   user namespaces, a cgroup delegated to the user. The unprivileged perf path
#   is exercised there.
# - `stock` is the hosted image as shipped: perf_event_paranoid 4 (Ubuntu's
#   patch: no perf event at all for an unprivileged process), AppArmor's
#   user-namespace restriction, and root's service cgroup, which delegates
#   nothing. Every perf test has to skip there with the machine's reason.
#
# `make` is not used for the build, because its capability step runs
# `sudo -n setcap`, and a hosted runner's sudo needs no password: the build
# would grant the capabilities this cell exists to go without. The two C
# fixtures `make` builds beside the tool are built by their own targets, which
# grant nothing.
#
# Started by hand only (Actions tab, or `gh workflow run ci -f cell=both`): the
# repository is private, so every minute counts against the account's included
# minutes, and `make check` on the development machine is the everyday check.
# A second run on the same ref cancels the one still running.

name: ci

on:
  workflow_dispatch:
    inputs:
      cell:
        description: "Matrix cell to run"
        type: choice
        options: [both, defaults, stock]
        default: both

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"

jobs:
  suite:
    name: suite (${{ matrix.cell }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      # One cell failing says nothing about the other; both are read.
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(inputs.cell == 'both' && '["defaults","stock"]' || format('["{0}"]', inputs.cell)) }}
    env:
      OMN_CI_CELL: ${{ matrix.cell }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # What the tests launch: a C compiler and <sys/sdt.h> for the USDT and
      # vertical-case fixtures, python3 and node for the runtime workloads,
      # iproute2 for the network scenarios; for `tests/cases.rs`, the
      # programs the cases measure and the tools their references use (sqlite3,
      # strace, unzip; gcc and make are build-essential's, taskset
      # util-linux's). A skip because one of these is missing is the
      # workflow's fault, and the gate refuses it.
      - name: Workloads the tests launch
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            build-essential systemtap-sdt-dev python3 nodejs iproute2 util-linux jq \
            sqlite3 strace unzip

      # bpftool, for `btf.rs`'s cross-check of a variable's type id against the
      # running kernel's own numbering. Ubuntu's packages are not a source for
      # it on this runner: `linux-tools-$(uname -r)` for the azure kernel
      # installs no bpftool binary at all, and /usr/sbin/bpftool is a wrapper
      # that answers "WARNING: bpftool not found for kernel 6.17.0-1022" (runs
      # 37f17c8 and 37155975223, both cells). The source is upstream's own
      # static build, pinned by version and checksum: one binary, no library
      # it could miss, and dumping a BTF blob does not depend on the kernel
      # it was built beside. Ubuntu's builds are tried after it, when the
      # download fails or what it brought cannot dump. Whichever answers `btf dump file` of this kernel's
      # BTF -- what `btf.rs` asks of it -- goes first on PATH; when none
      # does, the job stops here, rather than as a skip in the suite.
      - name: bpftool
        env:
          BPFTOOL_VERSION: v7.7.0
          BPFTOOL_SHA256: 09150596f09356b0ff632dd7f9856e0ea86bf96b269e9bc94278d9a9432a268c
        run: |
          vmlinux=/sys/kernel/btf/vmlinux
          tried=()
          chosen=
          # The first of `$@` that dumps this kernel's BTF, into `chosen`.
          first_that_dumps() {
            for candidate in "$@"; do
              tried+=("$candidate")
              if said=$("$candidate" btf dump file "$vmlinux" format raw 2>&1 >/dev/null); then
                chosen=$candidate
                return 0
              fi
              echo "$candidate does not dump $vmlinux: $(printf '%s' "$said" | head -n 1)"
            done
            return 1
          }
          archive="$RUNNER_TEMP/bpftool.tar.gz"
          if curl -fsSL --retry 3 -o "$archive" \
              "https://github.com/libbpf/bpftool/releases/download/$BPFTOOL_VERSION/bpftool-$BPFTOOL_VERSION-amd64.tar.gz" \
            && echo "$BPFTOOL_SHA256  $archive" | sha256sum -c -; then
            mkdir -p "$RUNNER_TEMP/bpftool"
            tar -xzf "$archive" -C "$RUNNER_TEMP/bpftool"
            chmod +x "$RUNNER_TEMP/bpftool/bpftool"
            first_that_dumps "$RUNNER_TEMP/bpftool/bpftool" \
              || echo "::warning::upstream bpftool $BPFTOOL_VERSION does not dump $vmlinux"
          else
            echo "::warning::upstream bpftool $BPFTOOL_VERSION did not download or did not match its checksum"
          fi
          # Ubuntu's builds, whenever upstream's did not serve: not
          # downloaded, or downloaded and unable to dump.
          if [ -z "$chosen" ]; then
            sudo apt-get install -yq --no-install-recommends "linux-tools-$(uname -r)" linux-tools-generic \
              || echo "::warning::Ubuntu's linux-tools did not install"
            ubuntu=()
            for path in /usr/lib/linux-tools/*/bpftool /usr/lib/linux-tools-*/bpftool; do
              [ -x "$path" ] && ubuntu+=("$path")
            done
            first_that_dumps "${ubuntu[@]}" || true
          fi
          if [ -z "$chosen" ]; then
            echo "::error::no bpftool here dumps $vmlinux (tried: ${tried[*]:-none}); btf.rs's cross-check would skip"
            exit 1
          fi
          sudo install -m 0755 "$chosen" /usr/local/bin/bpftool
          hash -r
          # Ahead of Ubuntu's wrapper in /usr/sbin, which is what the suite
          # found before.
          if [ "$(command -v bpftool)" != /usr/local/bin/bpftool ]; then
            echo "::error::bpftool on PATH is $(command -v bpftool), not the one installed"
            exit 1
          fi
          echo "bpftool on PATH: /usr/local/bin/bpftool, from $chosen"
          bpftool version | head -n 1
          # The line the cross-check reads, so a dump that holds no variable is
          # said here too.
          bpftool btf dump file "$vmlinux" | grep -m 1 -E "^\[[0-9]+\] VAR 'runqueues' " \
            || { echo "::error::bpftool dumped $vmlinux with no VAR 'runqueues'"; exit 1; }

      # The cell is a stock kernel's defaults with no capabilities, which the
      # hosted image is not in three places, each set back here and printed by
      # the next step (docs/portability.md, "The thirteenth wave"):
      #
      # - perf_event_paranoid is 4 on Ubuntu, a Debian patch upstream never
      #   took: every perf_event_open of an unprivileged process is refused,
      #   its own counters included. The unprivileged perf path this cell
      #   exists to exercise is then never exercised, and the first run's
      #   suite was 45 tests asserting what paranoid 2 serves. 2 is the kernel's
      #   own default. (Those tests are wrong at 4 as well, and are filed with
      #   their owners; a paranoid-4 cell is for when they are fixed.)
      # - apparmor_restrict_unprivileged_userns is 1 on Ubuntu from 23.10:
      #   `unshare -Urm` is refused, and the scenarios that build their own
      #   device, namespace or /proc/diskstats inside one skip. Upstream allows
      #   an unprivileged user namespace.
      # - the job runs in root's service cgroup, which delegates nothing. A
      #   systemd user session delegates its subtree to its user, which is
      #   where the cgroup scenarios make their cgroups on a workstation; the
      #   step below makes the same shape by hand, two delegating levels deep
      #   as a session is (`user@<uid>.service`, then `app.slice`, then the
      #   scope that holds the shell): `omn-ci` and `omn-ci/app`, owned by the
      #   runner's user with every controller the tests ask enabled below
      #   each, and the job's shell in the leaf `omn-ci/app/job`. The leaf
      #   itself cannot hand anything down -- a cgroup that holds processes
      #   may not enable a controller below it -- so a test that makes a
      #   cgroup walks up to the nearest ancestor that does. One level was not
      #   enough: two tests of `tests/cross_machine.rs` make the same
      #   `omn-cross-machine-<pid>.scope` at once, the second finds it taken
      #   under `omn-ci` and, with no other delegating ancestor to fall back
      #   to, skipped as *"no ancestor of /omn-ci/job delegates the memory
      #   controller"* (run 37155975223), where a workstation's second level
      #   answered it. That collision is filed with the test's owner.
      #   GITHUB_ENV cannot move a process, so every later step moves its own
      #   shell first -- with sudo, because a move is checked against the
      #   cgroup both places share, and that is the root.
      - name: Configure the cell
        if: matrix.cell == 'defaults'
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=2
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo mkdir -p /sys/fs/cgroup/omn-ci/app/job
          for level in /sys/fs/cgroup /sys/fs/cgroup/omn-ci /sys/fs/cgroup/omn-ci/app; do
            for controller in cpu memory io pids; do
              echo "+$controller" | sudo tee "$level/cgroup.subtree_control" >/dev/null || true
            done
          done
          for level in omn-ci omn-ci/app; do
            delegated=$(cat "/sys/fs/cgroup/$level/cgroup.subtree_control")
            echo "$level delegates: $delegated"
            for controller in cpu memory io pids; do
              case " $delegated " in
                *" $controller "*) ;;
                *) echo "::error::$level does not hand the $controller controller down"; exit 1 ;;
              esac
            done
          done
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/omn-ci
          echo "OMN_CI_CGROUP=/sys/fs/cgroup/omn-ci/app/job/cgroup.procs" >> "$GITHUB_ENV"

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build, without capabilities
        run: |
          cargo build --workspace
          make vertical-server triage-fixture
          if getcap target/debug/omn | grep -q cap_; then
            echo "::error::target/debug/omn carries capabilities; this cell is the one without"
            exit 1
          fi

      # The cell as the tool sees it, first, so a surprising skip can be read
      # against the machine that produced it.
      - name: This machine
        run: |
          uname -a
          echo "perf_event_paranoid $(cat /proc/sys/kernel/perf_event_paranoid)"
          echo "unprivileged_bpf_disabled $(cat /proc/sys/kernel/unprivileged_bpf_disabled)"
          echo "apparmor_restrict_unprivileged_userns $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"
          if [ -n "${OMN_CI_CGROUP:-}" ]; then echo "$$" | sudo tee "$OMN_CI_CGROUP" >/dev/null; fi
          echo "cgroup $(cat /proc/self/cgroup)"
          ulimit -l
          ls -l /sys/kernel/btf/vmlinux || true
          ls -ld /sys/kernel/tracing || true
          target/debug/omn list | tail -n 3

      # One cell of the portability matrix, swept before the suite so the
      # suite's own `tests/portability.rs` judges it.
      - name: The matrix cell of this runner
        run: |
          if [ -n "${OMN_CI_CGROUP:-}" ]; then echo "$$" | sudo tee "$OMN_CI_CGROUP" >/dev/null; fi
          config=nocaps
          [ "$OMN_CI_CELL" = stock ] && config=stock
          OMN_MATRIX_CELL="ci-$(uname -r | cut -d- -f1)-$config" OMN_MATRIX_CONFIG=$config \
            cargo test --test portability sweep_this_machine -- --ignored --exact --nocapture

      - name: Suite
        run: |
          set -o pipefail
          if [ -n "${OMN_CI_CGROUP:-}" ]; then echo "$$" | sudo tee "$OMN_CI_CGROUP" >/dev/null; fi
          cargo test --workspace --no-fail-fast -- --nocapture 2>&1 | tee target/test.log

      - name: Every skip is an expected one
        if: always()
        run: |
          expected=(.github/expected-skips.txt)
          [ "$OMN_CI_CELL" = stock ] && expected+=(.github/expected-skips-stock.txt)
          .github/scripts/skip-gate.sh target/test.log "${expected[@]}"

      - name: Keep the cell and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-cell-and-log-${{ matrix.cell }}
          path: |
            target/matrix/cells
            target/test.log
          if-no-files-found: warn
          retention-days: 7
